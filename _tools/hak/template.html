<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=STIX+Two+Text:ital,wght@0,400..700;1,400..700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 얇은 머리줄(단원·문항) / 공통 16:10 칠판 한 장 / 아래줄 왼쪽 문항 목록, 오른쪽 진행·조작 */
:root{
  --paper:#ffffff;
  --ink:#1c2231;
  --muted:#727a8c;
  --faint:#a9afbd;
  --rule:#e6e8ee;
  --plum:#5d3b8f;
  --plum-soft:#f3eff9;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:6px 8px;box-sizing:border-box;display:flex;flex-direction:column;gap:6px;overflow:hidden;
  -webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--plum);outline-offset:2px}

/* 머리줄 */
.head{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}
.title{display:flex;align-items:baseline;gap:14px;min-width:0}
.num{font-size:30px;line-height:1;font-weight:700;letter-spacing:-.01em;color:var(--plum);font-variant-numeric:tabular-nums}
.sec{font-size:17px;font-weight:600;color:var(--ink);white-space:nowrap}
.unit{font-size:13px;color:var(--muted);white-space:nowrap}
.head .grow{flex:1}
.icon{height:46px;width:46px;justify-content:center;padding:0;border:1px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--muted);font-size:13px;display:inline-flex;align-items:center;gap:6px}
.icon:hover{color:var(--ink);border-color:var(--faint)}
.icon svg{width:18px;height:18px}

/* 칠판 */
.view{flex:1;min-height:0;display:flex;align-items:flex-start;justify-content:flex-start}
.stage{position:relative;background:#fff;overflow:hidden}
.stage img{display:block;user-select:none;-webkit-user-drag:none}
.stage .base{width:100%;height:100%}
.stage .layer{position:absolute;mix-blend-mode:multiply;opacity:0;transition:opacity .35s ease}
.stage .layer.on{opacity:1}
.stage.enter{animation:enter .28s ease}
.plink{display:inline-flex;align-items:center;gap:6px;
  height:36px;padding:0 14px;border:1.5px solid var(--plum);border-radius:18px;background:var(--plum-soft);
  color:var(--plum);font-size:15px;font-weight:600;text-decoration:none;white-space:nowrap}
.plink:hover{background:var(--plum);color:#fff}
.plink svg{width:14px;height:14px}
@keyframes enter{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* 아래줄 */
.bar{display:flex;align-items:center;gap:24px;flex-wrap:wrap;border-top:1px solid var(--rule);padding-top:6px}
.toc{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px clamp(10px,1.8vw,34px);flex:1;min-width:0}
.grp{display:flex;align-items:center;gap:4px}
.grp span{font-size:12px;color:var(--faint);margin-right:4px;white-space:nowrap}
.grp button{min-width:34px;height:30px;padding:0 8px;border:0;border-radius:7px;background:transparent;color:var(--muted);font-size:14px;font-weight:500;font-variant-numeric:tabular-nums}
.grp button:hover{background:var(--plum-soft);color:var(--ink)}
.grp button.cur{background:var(--plum);color:#fff}

.ctrl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.ghost{height:46px;padding:0 14px;border:1px solid var(--rule);border-radius:10px;background:var(--paper);color:var(--ink);font-size:14px;font-weight:500}
.ghost:hover{border-color:var(--faint)}
.ghost:disabled{opacity:.35;cursor:default}
.nav{display:flex;gap:8px}
.nav button{height:46px;min-width:132px;border-radius:12px;font-size:17px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.prev{border:1px solid var(--ink);background:var(--paper);color:var(--ink)}
.next{border:1px solid var(--ink);background:var(--ink);color:#fff}
.nav button:disabled{opacity:.28;cursor:default}
.nav svg{width:18px;height:18px}

@media (max-width:1500px){.grp span{display:none}.nav button{min-width:104px}.bar{gap:16px}}
@media (max-width:760px){
  .num{font-size:26px}
  .ctrl{width:100%;justify-content:space-between}
  .nav{flex:1 1 100%}.nav button{flex:1;min-width:0}
}
@media (prefers-reduced-motion:reduce){.stage .layer{transition:none}.stage.enter{animation:none}}
</style>



<main class="view" id="view"><div class="stage" id="stage"></div></main>

<footer class="bar">
  <div class="title"><span class="num" id="num"></span><span class="sec" id="sec"></span></div>
  <a class="plink" id="plink" target="_blank" rel="noopener" hidden>Link <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h7v7M13 3L4 12"/></svg></a>
  <nav class="toc" id="toc" aria-label="문항 이동"></nav>
  <div class="ctrl">

    </div>
    <button class="ghost" id="reset" type="button">문제만</button>
    <button class="ghost" id="all" type="button">풀이 전체</button>
    <div class="nav">
      <button class="prev" id="prev" type="button"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4l-6 6 6 6"/></svg>이전</button>
      <button class="next" id="next" type="button"><span id="nextTxt">다음</span><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 4l6 6-6 6"/></svg></button>
    </div>
    <button class="icon" id="fs" type="button" title="전체화면" aria-label="전체화면"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 6V2h4M14 6V2h-4M2 10v4h4M14 10v4h-4"/></svg></button>
  </div>
</footer>

__APPS__
<script>
const DATA=__DATA__;
const $=id=>document.getElementById(id);
const stage=$('stage'),view=$('view');
let p=0,s=0,tx=null;
// 개념 앱: 각 앱을 Shadow DOM 안에 한 번만 만들어 두고, 그 페이지에서 화면에 붙인다(상태 유지)
const appHost={};
(function(){const park=document.createElement('div');park.hidden=true;document.body.appendChild(park);
  DATA.filter(d=>d.kind==='app').forEach(d=>{
    if(appHost[d.app])return;const tpl=document.getElementById('app-'+d.app);if(!tpl)return;
    const h=document.createElement('div');park.appendChild(h);appHost[d.app]=h;
    const R=h.attachShadow({mode:'open'});R.innerHTML=tpl.textContent;
    try{window.__appInit[d.app](R)}catch(e){console.error(e)}
  });})();
const isApp=()=>DATA[p].kind==='app';

function build(){
  const d=DATA[p];
  stage.innerHTML='';
  window.__appOn=d.kind==='app'?d.app:null;
  if(d.kind==='app'){if(appHost[d.app])stage.appendChild(appHost[d.app]);stage.classList.remove('enter');void stage.offsetWidth;stage.classList.add('enter');fit();return}
  const b=new Image();b.className='base';b.src=d.base;b.alt=d.sec+' '+d.num+' 문제';b.draggable=false;stage.appendChild(b);
  d.steps.forEach(st=>{
    const im=new Image();im.className='layer';im.src=st.src;im.alt='';im.draggable=false;
    im.dataset.step=st.step;if(st.until)im.dataset.until=st.until;
    im.style.left=(st.x/d.w*100)+'%';im.style.top=(st.y/d.h*100)+'%';
    im.style.width=(st.w/d.w*100)+'%';im.style.height=(st.h/d.h*100)+'%';
    stage.appendChild(im);
  });
  stage.classList.remove('enter');void stage.offsetWidth;stage.classList.add('enter');
  fit();
}
function fit(){
  const d=DATA[p],W=view.clientWidth,H=view.clientHeight,r=d.w/d.h;
  if(d.kind==='app'){stage.style.width=W+'px';stage.style.height=H+'px';return}
  let w=W,h=W/r;if(h>H){h=H;w=H*r}
  stage.style.width=Math.floor(w)+'px';stage.style.height=Math.floor(h)+'px';
}
function render(){
  const d=DATA[p],n=d.n;
  $('num').textContent=d.num;
  $('sec').textContent=d.sec;
  const pl=$('plink');pl.hidden=!d.link;if(d.link){pl.href=d.link;pl.title=(d.linkName||'연결 자료')+' 열기'}
  $('reset').disabled=$('all').disabled=d.kind==='app';
  stage.querySelectorAll('.layer').forEach(el=>{
    const i=+el.dataset.step,u=el.dataset.until?+el.dataset.until:0;
    el.classList.toggle('on',i<s&&(!u||s<u));
  });
  $('prev').disabled=(p===0&&s===0);
  $('next').disabled=(p===DATA.length-1&&s===n);
  $('nextTxt').textContent=(s===n&&p<DATA.length-1)?'다음 문제':'다음';
  document.querySelectorAll('#toc button').forEach(b=>b.classList.toggle('cur',+b.dataset.i===p));
}
function go(np,ns){if(np!==p){p=np;build()}s=ns;render()}
function next(){const n=DATA[p].n;if(s<n)go(p,s+1);else if(p<DATA.length-1)go(p+1,0)}
function prev(){if(s>0)go(p,s-1);else if(p>0)go(p-1,DATA[p-1].n)}

// 문항 목록(단원별 묶음)
(function(){
  const groups=[];
  DATA.forEach((d,i)=>{
    const g=d.g||d.sec;
    let G=groups.find(x=>x.name===g);if(!G){G={name:g,items:[]};groups.push(G)}
    G.items.push({i,label:d.toc||d.num});
  });
  const short={'이항분포 복습':'이항분포 복습','중단원 학습 점검':'중단원','대단원 학습 평가':'대단원','교과서 외 문제':'교과서 외'};
  $('toc').innerHTML=groups.map(G=>'<div class="grp"><span>'+(short[G.name]||G.name)+'</span>'+
    G.items.map(it=>'<button type="button" data-i="'+it.i+'">'+it.label+'</button>').join('')+'</div>').join('');
})();

$('next').onclick=next;$('prev').onclick=prev;
$('reset').onclick=()=>go(p,0);
$('all').onclick=()=>go(p,DATA[p].n);
$('toc').onclick=e=>{const b=e.target.closest('button');if(b)go(+b.dataset.i,0)};
$('fs').onclick=()=>{
  try{
    if(document.fullscreenElement)document.exitFullscreen();
    else{const r=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();if(r&&r.catch)r.catch(()=>{})}
  }catch(e){}
};
document.addEventListener('fullscreenchange',()=>{$('fs').title=document.fullscreenElement?'창 모드':'전체화면'});
document.addEventListener('keydown',e=>{
  if(isApp()&&!['PageDown','PageUp'].includes(e.key))return;
  if(e.target.closest&&e.target.closest('button')&&(e.key===' '||e.key==='Enter'))return;
  if(['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();next()}
  else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){e.preventDefault();prev()}
  else if(e.key==='Home'){go(p,0)}else if(e.key==='End'){go(p,DATA[p].n)}
});
view.addEventListener('touchstart',e=>{tx=e.changedTouches[0].clientX},{passive:true});
view.addEventListener('touchend',e=>{if(tx===null||isApp()){tx=null;return}const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>60)(dx<0?next:prev)()});
view.addEventListener('click',e=>{if(!isApp()&&e.target.closest('.stage'))next()});
new ResizeObserver(fit).observe(view);
build();render();
</script>
