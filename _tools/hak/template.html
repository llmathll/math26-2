<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=STIX+Two+Text:ital,wght@0,400..700;1,400..700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 얇은 머리줄(단원·문항) / 공통 16:10 칠판 한 장 / 아래줄 왼쪽 문항 목록, 오른쪽 진행·조작 */
:root{
  --paper:#ffffff;
  --ink:#1c2231;
  --muted:#727a8c;
  --faint:#a9afbd;
  --rule:#e6e8ee;
  --plum:#5d3b8f;
  --plum-soft:#f3eff9;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:6px 8px;box-sizing:border-box;display:flex;flex-direction:column;gap:6px;overflow:hidden;
  -webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--plum);outline-offset:2px}

/* 머리줄 */
.head{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}
.title{display:flex;align-items:baseline;gap:14px;min-width:0}
.num{font-size:30px;line-height:1;font-weight:700;letter-spacing:-.01em;color:var(--plum);font-variant-numeric:tabular-nums}
.sec{font-size:17px;font-weight:600;color:var(--ink);white-space:nowrap}
.unit{font-size:13px;color:var(--muted);white-space:nowrap}
.head .grow{flex:1}
.icon{height:46px;width:46px;justify-content:center;padding:0;border:1px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--muted);font-size:13px;display:inline-flex;align-items:center;gap:6px}
.icon:hover{color:var(--ink);border-color:var(--faint)}
.icon svg{width:18px;height:18px}

/* 칠판 */
.view{flex:1;min-height:0;display:flex;align-items:flex-start;justify-content:flex-start;overflow:hidden}
.stage{position:relative;background:#fff;overflow:hidden;transition:transform .6s ease}
.stage img{display:block;user-select:none;-webkit-user-drag:none}
.stage .base{width:100%;height:100%}
.stage .layer{position:absolute;mix-blend-mode:multiply;opacity:0;transition:opacity .35s ease}
.stage .layer.on{opacity:1}
.stage svg.ink{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.stage svg.ink path{fill:none;stroke-linecap:round;stroke-linejoin:round}
/* 답 가리개(분홍 네모): 교사가 눌러서 엶 */
.stage svg.ink g.cov{pointer-events:all;cursor:pointer}
.stage svg.ink g.cov rect.face{fill:#fde4e7;stroke:#e0707a}
.stage.enter{animation:enter .28s ease}
.plink{display:inline-flex;align-items:center;gap:6px;
  height:36px;padding:0 14px;border:1.5px solid var(--plum);border-radius:18px;background:var(--plum-soft);
  color:var(--plum);font-size:15px;font-weight:600;text-decoration:none;white-space:nowrap}
.plink:hover{background:var(--plum);color:#fff}
.plink[hidden]{display:none}
.plink svg{width:14px;height:14px}
@keyframes enter{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* 아래줄 */
.bar{display:flex;align-items:center;gap:24px;flex-wrap:wrap;border-top:1px solid var(--rule);padding-top:6px}
.toc{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px clamp(10px,1.8vw,34px);flex:1;min-width:0}
.grp{display:flex;align-items:center;gap:4px}
.grp span{font-size:12px;color:var(--faint);margin-right:4px;white-space:nowrap}
.grp button{min-width:34px;height:30px;padding:0 8px;border:0;border-radius:7px;background:transparent;color:var(--muted);font-size:14px;font-weight:500;font-variant-numeric:tabular-nums}
.grp button:hover{background:var(--plum-soft);color:var(--ink)}
.grp button.cur{background:var(--plum);color:#fff}

.ctrl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.ghost{height:46px;padding:0 14px;border:1px solid var(--rule);border-radius:10px;background:var(--paper);color:var(--ink);font-size:14px;font-weight:500}
.ghost:hover{border-color:var(--faint)}
.ghost:disabled{opacity:.35;cursor:default}
.nav{display:flex;gap:8px}
.nav button{height:46px;min-width:132px;border-radius:12px;font-size:17px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.prev{border:1px solid var(--ink);background:var(--paper);color:var(--ink)}
.next{border:1px solid var(--ink);background:var(--ink);color:#fff}
.nav button:disabled{opacity:.28;cursor:default}
.nav svg{width:18px;height:18px}

@media (max-width:1500px){.grp span{display:none}.nav button{min-width:104px}.bar{gap:16px}}
@media (max-width:760px){
  .num{font-size:26px}
  .ctrl{width:100%;justify-content:space-between}
  .nav{flex:1 1 100%}.nav button{flex:1;min-width:0}
}
@media (prefers-reduced-motion:reduce){.stage .layer{transition:none}.stage.enter{animation:none}}
</style>

<script>
const DATA=__DATA__;
const $=id=>document.getElementById(id);
const stage=$('stage'),view=$('view');
let p=0,s=0,tx=null,running=[],paths=[],covEls=[],rev=new Set(),autoTok=0;
const WRITE_SPEED=1.7;      // 펜 순서 쓰기 속도(비교 화면에서 고른 값)
const STEP_MAX_MS=3200;     // 한 단계는 길어도 약 3.2초
const UNIFORM_TOL=0.9;     // 공통 배율 기준(중앙값의 90%보다 작아져야 하는 문항만 따로 축소)
const NS='http://www.w3.org/2000/svg';
// 개념 앱: 각 앱을 Shadow DOM 안에 한 번만 만들어 두고, 그 페이지에서 화면에 붙인다(상태 유지)
const appHost={};
(function(){const park=document.createElement('div');park.hidden=true;document.body.appendChild(park);
  DATA.filter(d=>d.kind==='app').forEach(d=>{
    if(appHost[d.app])return;const tpl=document.getElementById('app-'+d.app);if(!tpl)return;
    const h=document.createElement('div');park.appendChild(h);appHost[d.app]=h;
    const R=h.attachShadow({mode:'open'});R.innerHTML=tpl.textContent;
    try{window.__appInit[d.app](R)}catch(e){console.error(e)}
  });})();
const isApp=()=>DATA[p].kind==='app';

function build(){
  const d=DATA[p];
  stopAnim(true);stage.innerHTML='';paths=[];covEls=[];stepY=null;stage.style.transform='';
  window.__appOn=d.kind==='app'?d.app:null;
  if(d.kind==='app'){if(appHost[d.app])stage.appendChild(appHost[d.app]);stage.classList.remove('enter');void stage.offsetWidth;stage.classList.add('enter');fit();return}
  const b=new Image();b.className='base';b.src=d.base;b.alt=d.sec+' '+d.num+' 문제';b.draggable=false;stage.appendChild(b);
  d.steps.forEach(st=>{
    const im=new Image();im.className='layer';im.src=st.src;im.alt='';im.draggable=false;
    im.dataset.step=st.step;if(st.until)im.dataset.until=st.until;
    im.style.left=(st.x/d.w*100)+'%';im.style.top=(st.y/d.h*100)+'%';
    im.style.width=(st.w/d.w*100)+'%';im.style.height=(st.h/d.h*100)+'%';
    stage.appendChild(im);
  });
  if(d.strokes){
    const svg=document.createElementNS(NS,'svg');svg.setAttribute('class','ink');svg.setAttribute('viewBox',`0 0 ${d.w} ${d.h}`);
    d.strokes.forEach(t=>{
      const el=document.createElementNS(NS,'path');el.setAttribute('d',t.d);
      if(t.f){el.style.fill=t.c;el.style.stroke='none'}else{el.style.stroke=t.c;el.style.strokeWidth=t.w}
      if(t.mb)el.style.mixBlendMode='multiply';
      const op=t.a<1?t.a:1;el.style.opacity=op;
      const fade=!!(t.f||t.dash);
      if(t.dash)el.style.strokeDasharray=t.dash.map(v=>Math.max(v,0.01)).join(' ');
      else if(!t.f){el.setAttribute('pathLength',1000);el.style.strokeDasharray='1000 1000'}
      el.style.visibility='hidden';svg.appendChild(el);paths.push({t,el,op,fade});
    });
    // 답 가리개: 그 단계를 쓸 때 네모로 가려 두고, 누르면 그 안의 답을 씀. 네모를 모두 열면 다음 단계로
    (d.covers||[]).forEach((c,k)=>{
      const sc=d.w/2700,pd=3*sc,hp=16*sc,g=document.createElementNS(NS,'g');g.setAttribute('class','cov');
      g.innerHTML=`<rect x="${c.x-hp}" y="${c.y-hp}" width="${c.w+2*hp}" height="${c.h+2*hp}" fill="transparent"/>`+
        `<rect class="face" x="${c.x-pd}" y="${c.y-pd}" width="${c.w+2*pd}" height="${c.h+2*pd}" rx="${10*sc}" stroke-width="${5*sc}"/>`;
      g.style.visibility='hidden';
      g.addEventListener('click',e=>{e.stopPropagation();if(dragged)return;if(parseFloat(getComputedStyle(g).opacity)<.5||g.style.visibility==='hidden')return;reveal(k)});
      svg.appendChild(g);covEls.push({c,g,k});
    });
    stage.appendChild(svg);
  }
  stage.classList.remove('enter');void stage.offsetWidth;stage.classList.add('enter');
  fit();
}
function fit(){
  const d=DATA[p],W=view.clientWidth,H=view.clientHeight,r=d.w/d.h;
  if(d.kind==='app'){stage.style.width=W+'px';stage.style.height=H+'px';return}
  // 글자 크기 통일: 모든 문항에 같은 배율(공통 배율)을 쓰고, 그 배율로 넘치는 큰 문항만 들어갈 만큼 줄인다.
  // 공통 배율 = (각 문항이 꽉 차는 배율의 중앙값 × UNIFORM_TOL) 이상인 문항들 중 가장 작은 배율
  const fits=DATA.filter(x=>x.kind!=='app'&&!x.solo).map(x=>x.follow?W/x.w:Math.min(W/x.w,H/x.h)).sort((a,b)=>a-b);
  const med=fits[Math.floor(fits.length/2)],common=Math.min(...fits.filter(f=>f>=med*UNIFORM_TOL));
  const k=d.follow?Math.min(common*(d.scale||1),W/d.w):Math.min(common*(d.scale||1),W/d.w,H/d.h);
  stage.style.width=Math.floor(d.w*k)+'px';stage.style.height=Math.floor(d.h*k)+'px';
  follow(true);
}
// follow: 화면보다 긴 문항은 지금 쓰는 단계가 보이도록 화면이 따라 내려간다
//   ↑문제 보기 버튼, 위아래 끌기·마우스 휠로 직접 올려 볼 수 있음(manual). 다음·이전·문항 이동을 하면 다시 따라가기.
let stepY=null,manual=null,curOff=0;
function overOf(){const d=DATA[p];if(d.kind==='app'||!d.follow)return 0;const k=stage.clientWidth/d.w;return Math.max(0,d.h*k-view.clientHeight)}
function autoOff(){
  const d=DATA[p],k=stage.clientWidth/d.w,H=view.clientHeight,over=overOf();if(over<=0)return 0;
  if(!stepY){stepY={};paths.forEach(({t,el})=>{try{const b=el.getBBox();const r=stepY[t.s]||(stepY[t.s]=[1e9,-1e9]);r[0]=Math.min(r[0],b.y);r[1]=Math.max(r[1],b.y+b.height)}catch(e){}});}
  let off=0;
  if(s>0){const r=stepY[s-1],pad=0.04*H;let bot=-1e9;for(let i=0;i<s;i++)if(stepY[i])bot=Math.max(bot,stepY[i][1]);   // 지금까지 쓴 것 중 가장 아래가 보이게
    if(bot>-1e9)off=Math.max(0,bot*k+pad-H);if(r&&r[0]*k-pad<off)off=Math.max(0,r[0]*k-pad)}       // 단, 지금 단계의 윗부분은 보이게
  off=Math.min(off,over);
  if(off>0&&d.gaps&&d.gaps.length){            // 위 끝을 항상 줄 사이 빈 띠에 맞춤(글자가 잘리지 않게).
    const r=stepY[s-1],pad=0.04*H,top=r?r[0]*k-pad:1e9;   // 필요하면 문항 끝보다 더 올려도 됨(아래는 빈 곳)
    const ok=d.gaps.map(g=>g*k).filter(g=>g>=off-1&&g<=top);    // 지금까지 쓴 것이 다 보이는 빈 띠 중
    if(ok.length)off=Math.min(...ok);                           // 가장 덜 올리는 것(단계가 갈수록 위치는 그대로거나 내려감)
  }
  return off;
}
function setOff(off,instant){
  curOff=off;
  if(instant){stage.style.transition='none';stage.style.transform=off?`translateY(${-off}px)`:'';void stage.offsetWidth;stage.style.transition=''}
  else stage.style.transform=`translateY(${-off}px)`;
  view.style.touchAction=overOf()>0?'none':'';
}
function follow(instant){
  const over=overOf();
  if(over<=0){manual=null;setOff(0,true);return}
  if(manual!==null){manual=Math.max(0,Math.min(manual,Math.max(over,autoOff())));setOff(manual,instant)}else setOff(autoOff(),instant);
}
function render(animate){
  const d=DATA[p],n=d.n;
  $('num').textContent=d.num;
  const pl=$('plink');pl.hidden=!d.link;if(d.link){pl.href=d.link;pl.title=(d.linkName||'연결 자료')+' 열기'}
  $('reset').disabled=$('all').disabled=d.kind==='app';
  stage.querySelectorAll('.layer').forEach(el=>{
    const i=+el.dataset.step,u=el.dataset.until?+el.dataset.until:0;
    el.classList.toggle('on',i<s&&(!u||s<u));
  });
  drawInk(animate);
  follow(!animate);
  $('prev').disabled=(p===0&&s===0);
  nextLabel();
  document.querySelectorAll('#toc button').forEach(b=>b.classList.toggle('cur',+b.dataset.i===p));
}
// 펜 획: 지난 단계는 그대로, 방금 단계는 쓴 순서대로 그리기
function stopAnim(cancel){running.forEach(a=>{try{cancel?a.cancel():a.finish()}catch(e){}});running=[]}
const writing=()=>running.some(a=>a.playState==='running'||a.playState==='pending');
const hidCov=t=>t.k!=null&&DATA[p].covers[t.k].s===s-1&&!rev.has(t.k);   // 지금 단계의 아직 안 연 가리개 속 획
const pending=()=>covEls.some(o=>o.c.s===s-1&&!rev.has(o.k));
function drawInk(animate){
  stopAnim(true);if(!paths.length)return;
  const i=s-1,d=DATA[p],cur=paths.filter(x=>x.t.s===i&&!hidCov(x.t));
  const pxPerMs=2.2*WRITE_SPEED*(d.w/2700),total=cur.reduce((a,x)=>a+x.t.l,0);
  const k=Math.max(1,total/pxPerMs/STEP_MAX_MS);let t0=0;const shown=new Set();
  covEls.forEach(({c,g,k:ck})=>{const on=c.s===i&&!rev.has(ck);g.style.visibility=on?'visible':'hidden';g.style.opacity=on?1:0});
  paths.forEach(({t,el,op,fade})=>{
    if(hidCov(t)){el.style.visibility='hidden';if(!fade)el.style.strokeDashoffset=1000;
      if(animate&&!shown.has(t.k)){shown.add(t.k);running.push(covEls[t.k].g.animate([{opacity:0},{opacity:1}],{duration:260,delay:t0,fill:'both'}));t0+=220}
      return}
    if(t.s<i||(t.s===i&&!animate)){el.style.visibility='visible';if(!fade)el.style.strokeDashoffset=0;return}
    if(t.s>i){el.style.visibility='hidden';if(!fade)el.style.strokeDashoffset=1000;return}
    el.style.visibility='visible';
    if(fade){running.push(el.animate([{opacity:0},{opacity:op}],{duration:260,delay:t0,fill:'both'}));t0+=200;return}
    el.style.strokeDashoffset=0;const dur=Math.max(40,t.l/pxPerMs/k);
    running.push(el.animate([{strokeDashoffset:1000,opacity:0,offset:0},{strokeDashoffset:999,opacity:op,offset:0.01},{strokeDashoffset:0,opacity:op,offset:1}],
      {duration:dur,delay:t0,easing:'ease-in-out',fill:'both'}));
    t0+=dur+(dur>120?50:15);
  });
}
function reveal(k){
  if(rev.has(k))return;rev.add(k);const o=covEls[k],d=DATA[p],pxPerMs=2.2*WRITE_SPEED*(d.w/2700);
  o.g.style.opacity=0;o.g.style.visibility='hidden';
  running.push(o.g.animate([{opacity:1,visibility:'visible'},{opacity:0,visibility:'visible'}],{duration:220}));
  let t0=120;
  paths.filter(x=>x.t.k===k).forEach(({t,el,op,fade})=>{
    el.style.visibility='visible';
    if(fade){running.push(el.animate([{opacity:0},{opacity:op}],{duration:260,delay:t0,fill:'both'}));t0+=200;return}
    el.style.strokeDashoffset=0;const dur=Math.max(40,t.l/pxPerMs);
    running.push(el.animate([{strokeDashoffset:1000,opacity:0,offset:0},{strokeDashoffset:999,opacity:op,offset:0.01},{strokeDashoffset:0,opacity:op,offset:1}],
      {duration:dur,delay:t0,easing:'ease-in-out',fill:'both'}));
    t0+=dur+(dur>120?50:15);
  });
  nextLabel();
  if(!pending()&&s<DATA[p].n){                   // 이 단계 가리개를 모두 열면 다 쓴 뒤 잠깐 쉬고 다음 단계로
    const tok=++autoTok,pp=p,ss=s;
    Promise.all(running.map(a=>a.finished.catch(()=>{}))).then(()=>setTimeout(()=>{if(tok===autoTok&&p===pp&&s===ss)go(p,s+1,true)},800));
  }
}
function go(np,ns,animate,all){manual=null;autoTok++;if(np!==p){p=np;build()}s=ns;rev=new Set(all?covEls.map(o=>o.k):[]);render(!!animate)}
function next(){if(writing()){stopAnim(false);return}   // 쓰는 중이면 먼저 그 단계를 완성
  const n=DATA[p].n;
  if(s===n&&pending()){covEls.filter(o=>o.c.s===s-1&&!rev.has(o.k)).forEach(o=>reveal(o.k));return}   // 마지막 단계 가리개: 다음 = 답 보이기, 한 번 더 = 다음 문제
  if(s<n)go(p,s+1,true);else if(p<DATA.length-1)go(p+1,0)}
function nextLabel(){const n=DATA[p].n;$('nextTxt').textContent=(s===n&&p<DATA.length-1&&!pending())?'다음 문제':'다음';
  $('next').disabled=(p===DATA.length-1&&s===n&&!pending())}
function prev(){if(s>0)go(p,s-1);else if(p>0)go(p-1,DATA[p-1].n,false,true)}

// 문항 목록(단원별 묶음)
(function(){
  const groups=[];
  DATA.forEach((d,i)=>{
    const g=d.g||d.sec;
    let G=groups.find(x=>x.name===g);if(!G){G={name:g,items:[]};groups.push(G)}
    G.items.push({i,label:d.toc||d.num});
  });
  const short={'이항분포 복습':'이항분포 복습','중단원 학습 점검':'중단원','대단원 학습 평가':'대단원','수학 익힘책':'익힘책','교과서 외 문제':'교과서 외'};
  $('toc').innerHTML=groups.map(G=>'<div class="grp"><span>'+(short[G.name]||G.name)+'</span>'+
    G.items.map(it=>'<button type="button" data-i="'+it.i+'">'+it.label+'</button>').join('')+'</div>').join('');
})();

$('next').onclick=next;$('prev').onclick=prev;
$('reset').onclick=()=>go(p,0);
$('all').onclick=()=>go(p,DATA[p].n,false,true);
$('toc').onclick=e=>{const b=e.target.closest('button');if(b)go(+b.dataset.i,0)};
$('fs').onclick=()=>{
  try{
    if(document.fullscreenElement)document.exitFullscreen();
    else{const r=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();if(r&&r.catch)r.catch(()=>{})}
  }catch(e){}
};
document.addEventListener('fullscreenchange',()=>{$('fs').title=document.fullscreenElement?'창 모드':'전체화면'});
document.addEventListener('keydown',e=>{
  if(isApp()&&!['PageDown','PageUp'].includes(e.key))return;
  if(e.target.closest&&e.target.closest('button')&&(e.key===' '||e.key==='Enter'))return;
  if(['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();next()}
  else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){e.preventDefault();prev()}
  else if(e.key==='Home'){go(p,0)}else if(e.key==='End'){go(p,DATA[p].n,false,true)}
});
view.addEventListener('touchstart',e=>{tx=e.changedTouches[0].clientX},{passive:true});
view.addEventListener('touchend',e=>{if(tx===null||isApp()||dragged){tx=null;return}const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>60)(dx<0?next:prev)()});
let dragY=null,dragX=0,drag0=0,dragged=false;
view.addEventListener('click',e=>{if(dragged){dragged=false;return}if(!isApp()&&e.target.closest('.stage')){if(!writing()&&pending())return;next()}});   // 가리개가 남아 있으면 화면 탭으로 넘어가지 않음(아래 다음 버튼·키는 넘어감)
// 위아래 끌기·휠: 긴 문항을 직접 올려 보기
view.addEventListener('wheel',e=>{if(isApp()||overOf()<=0)return;e.preventDefault();manual=curOff+e.deltaY;follow(true)},{passive:false});
view.addEventListener('pointerdown',e=>{if(isApp()||overOf()<=0)return;dragY=e.clientY;dragX=e.clientX;drag0=curOff;dragged=false});
view.addEventListener('pointermove',e=>{if(dragY===null)return;const dy=e.clientY-dragY;
  if(!dragged&&Math.abs(dy)>28&&Math.abs(dy)>Math.abs(e.clientX-dragX)*1.5)dragged=true;
  if(dragged){manual=drag0-dy;follow(true)}});
['pointerup','pointercancel'].forEach(t=>view.addEventListener(t,()=>{dragY=null;if(dragged)setTimeout(()=>{dragged=false},350)}));
new ResizeObserver(fit).observe(view);
build();render();
</script>
