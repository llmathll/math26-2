<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>소수 카드 뽑기 · 확률과통계</title>
<style>
/* chalk-stage.css v2 — 공통 스타일 (단일 파일 배포용 인라인 사본)
   원본과 동일하게 유지할 것. 수정은 chalk-stage.css 쪽에서 하고 다시 붙여넣기. */
/* ============================================================================
   chalk-stage.css  v2
   고등학교 확률과통계 수업용 16:9 인터랙티브 앱 공통 스타일

   설계 전제
   - 1600 x 900 고정 스테이지를 translate + scale 로 TV 화면에 꽉 채운다
   - 교실 뒷자리 기준 가독성: 본문 최소 32px(스테이지 좌표 기준)
   - 화면 텍스트는 최소, 도형/도표/인터랙션이 주인공
   - 수식은 MathJax/KaTeX 없이 CSS 로만 조판

   v2 변경점 ('카드 합의 확률' 앱에서 검증한 것들을 승격)
   - 세로 3분할 골격 확정: .app-head(고정) / 본문(가변) / .app-foot(고정)
     → 본문이 넘쳐 아래 결과 바를 덮는 사고를 구조적으로 막는다
   - .app-foot : 이전·다음·전체화면 등 하단 조작 버튼바
   - .panelWrap : [hidden] 으로 전환하는 탭 본문
   - .tabnav : 상단 탭 버튼
   - .pcard / .pcard-sm : 숫자 카드(주사위·카드 문항용), 뒤집기 애니메이션 포함
   - .posbars : 'n가지'를 위치 강조 막대로 보여주는 경우의 수 시각화
   - .case-card : 경우를 나눠 세는 유형 카드
   - .stamp : 알약형 → 제목 앞 숫자형으로 변경 (버튼으로 오인되던 문제)
   - .result 에 is-teal / is-coral 상태 추가

   사용법
   - 단일 HTML 파일 배포가 원칙이므로, 실제 앱에서는 이 파일 내용을
     <style> 안에 그대로 붙여넣어 사용하세요. (Google Sites 임베드 대비)
   - 개발 중에는 <link rel="stylesheet" href="chalk-stage.css"> 로 써도 됩니다.
   - 컴포넌트 클래스는 kebab-case 와 camelCase 양쪽을 모두 받습니다.
     (.case-card / .caseCard 둘 다 동작 — 기존 앱 호환용)

   함께 쓰는 JS (앱 쪽에 넣을 것)
     const STAGE_W=1600, STAGE_H=900;
     function fitStage(){
       const vv=window.visualViewport;
       const w=vv?vv.width:innerWidth, h=vv?vv.height:innerHeight;
       const s=Math.min(w/STAGE_W, h/STAGE_H);
       stage.style.transform=`translate(${Math.round((w-STAGE_W*s)/2)}px,
                                       ${Math.round((h-STAGE_H*s)/2)}px) scale(${s})`;
     }
     [0,60,300,700].forEach(t=>setTimeout(fitStage,t));   // 로드/회전 후 재계산
============================================================================ */

@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap');

/* ---------------------------------------------------------------- 1. 토큰 */
:root {
  /* 배경 계열 (칠판) */
  --bg-deep:      #0a1420;   /* 스테이지 바깥 레터박스 */
  --bg:           #0e1b2b;   /* 칠판면 */
  --panel:        #16283e;   /* 얹는 카드 */
  --panel-2:      #1d3350;   /* 한 단계 밝은 카드 */
  --line:         rgba(214, 229, 245, .18);
  --line-strong:  rgba(214, 229, 245, .38);

  /* 분필 계열 (글자) */
  --chalk:        #eaf1f8;
  --chalk-soft:   #b9cadd;
  --chalk-faint:  #7d94ad;

  /* 포인트 컬러 */
  --amber:        #f5b642;   /* 핵심 값, 정답, 강조 */
  --coral:        #ff7d6a;   /* 제외/여사건/주의 */
  --teal:         #49d1c0;   /* 조건, 성립, 확정 */
  --violet:       #9d8cf5;   /* 보조 분기 */

  --amber-dim:    rgba(245, 182,  66, .16);
  --coral-dim:    rgba(255, 125, 106, .16);
  --teal-dim:     rgba( 73, 209, 192, .16);
  --violet-dim:   rgba(157, 140, 245, .16);

  /* 타이포 (스테이지 1600x900 좌표 기준 절대값) */
  --f-en: 'Space Grotesk';
  --f-kr: 'Noto Sans KR';
  --t-hero:   76px;
  --t-title:  54px;
  --t-h2:     40px;
  --t-body:   32px;
  --t-small:  26px;
  --t-tag:    22px;

  /* 형태 */
  --r-s: 10px;
  --r-m: 18px;
  --r-l: 28px;

  /* 골격 여백 — 머리말+발판을 함께 쓰는 화면 기준으로 잡은 값 */
  --sheet-pad-x: 40px;
  --sheet-pad-t: 30px;
  --sheet-pad-b: 26px;
  --sheet-gap:   18px;
  --stage-pad:   44px;   /* 발판 없는 단순 화면용 (구버전 호환) */

  /* 컴포넌트 치수 */
  --pcard-w:    108px;
  --pcard-h:    150px;
  --pcard-fs:    56px;
  --pcard-sm-w:  54px;
  --pcard-sm-h:  76px;
  --pcard-sm-fs: 28px;
}

/* -------------------------------------------------- 2. 리셋 & 스테이지 골격 */
* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;                 /* TV 미러링 시 스크롤 방지 */
  background: var(--bg-deep);
  overscroll-behavior: none;
  touch-action: manipulation;
  -webkit-text-size-adjust: 100%;
}

body {
  color: var(--chalk);
  font-family: var(--f-en), var(--f-kr), system-ui, sans-serif;
  font-size: var(--t-body);
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

/* 레터박스 영역: 화면 전체를 덮고 여백 0 */
.viewport {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background: var(--bg-deep);
}

/* 고정 스테이지: JS 가 transform: translate(x,y) scale(s) 를 넣어준다 */
.stage {
  position: absolute;
  top: 0;
  left: 0;
  width: 1600px;
  height: 900px;
  transform-origin: 0 0;
  will-change: transform;
  overflow: hidden;
  background:
    radial-gradient(120% 90% at 18% 8%, #16273b 0%, rgba(22,39,59,0) 60%),
    radial-gradient(100% 80% at 92% 96%, #142335 0%, rgba(20,35,53,0) 62%),
    var(--bg);
}

/* 분필 가루 질감 + 가장자리 비네팅 (아주 옅게) */
.stage::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    repeating-linear-gradient(115deg, rgba(255,255,255,.014) 0 2px, rgba(255,255,255,0) 2px 7px),
    radial-gradient(130% 110% at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,.34) 100%);
}

/* 스테이지 안쪽 기본 레이아웃 (내용 여백은 여기서만 준다)
   머리말/발판은 고정, 가운데 본문만 늘어나게 해서 넘침을 구조적으로 막는다 */
.sheet {
  position: relative;
  z-index: 1;
  width: 100%;
  height: 100%;
  padding: var(--sheet-pad-t) var(--sheet-pad-x) var(--sheet-pad-b);
  display: flex;
  flex-direction: column;
  gap: var(--sheet-gap);
}

/* 발판 없이 본문만 쓰는 단순 화면 */
.sheet--loose { padding: var(--stage-pad); gap: 26px; }

/* ------------------------------------------------------------ 3. 머리말 */
.app-head {
  flex: 0 0 auto;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
  padding-bottom: 14px;
  border-bottom: 2px solid var(--line);
}

.app-title {
  margin: 0;
  font-size: var(--t-title);
  font-weight: 700;
  letter-spacing: -.02em;
  line-height: 1.1;
}

.app-sub {
  margin: 6px 0 0;
  font-size: var(--t-small);
  font-weight: 400;
  color: var(--chalk-soft);
}

/* 문항 번호 등 식별자 — 제목 앞에 붙는 숫자.
   조작 대상이 아니므로 버튼처럼 보이지 않게 테두리를 두지 않는다. */
.stamp {
  display: inline-block;
  margin-right: 14px;
  color: var(--amber);
  font-size: 1em;
  font-weight: 700;
  letter-spacing: -.02em;
  vertical-align: baseline;
}

/* 구버전 알약형 배지가 필요할 때 */
.stamp--pill {
  margin-right: 0;
  padding: 8px 20px;
  border: 2px solid var(--amber);
  border-radius: 999px;
  font-size: var(--t-small);
  font-weight: 600;
  letter-spacing: .04em;
  white-space: nowrap;
}

/* 상단 탭 */
.tabnav { display: flex; align-items: center; gap: 12px; }
.tabnav .btn { padding: 11px 24px; font-size: var(--t-tag); }
.tabnav .btn.is-active {
  background: var(--amber-dim);
  border-color: var(--amber);
  color: var(--amber);
}

/* ------------------------------------------------------------- 4. 발판 */
/* 하단 조작 버튼바. 왼쪽에 .dots, 오른쪽에 버튼 묶음이 기본 배치. */
.app-foot {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding-top: 14px;
  border-top: 2px solid var(--line);
}

/* 탭으로 전환되는 본문 한 장 */
.panelWrap,
.panel-wrap {
  display: flex;
  flex-direction: column;
  gap: var(--sheet-gap);
  flex: 1 1 auto;
  min-height: 0;
}
.panelWrap[hidden],
.panel-wrap[hidden] { display: none; }

/* -------------------------------------------------------- 5. 면 / 카드류 */
.panel {
  position: relative;
  padding: 26px 30px;
  border: 2px solid var(--line);
  border-radius: var(--r-l);
  background: var(--panel);
}

.panel--flat  { background: transparent; }
.panel--raise { background: var(--panel-2); border-color: var(--line-strong); }
.panel--tight { padding: 18px 20px; border-radius: var(--r-m); }

/* 문제 원문처럼 '인용'되는 블록 */
.quote {
  padding: 24px 30px 24px 34px;
  border-left: 8px solid var(--amber);
  border-radius: 0 var(--r-m) var(--r-m) 0;
  background: rgba(245, 182, 66, .07);
  font-size: var(--t-body);
  line-height: 1.55;
}

/* 결론/정답 강조 면. 판정 결과에 따라 색을 바꾼다. */
.result {
  padding: 18px 30px;
  border: 3px solid var(--amber);
  border-radius: var(--r-l);
  background: var(--amber-dim);
  font-size: var(--t-h2);
  font-weight: 600;
  text-align: center;
}
.result.is-teal  { border-color: var(--teal);  background: var(--teal-dim); }
.result.is-coral { border-color: var(--coral); background: var(--coral-dim); }
.result.is-off   { border-color: var(--line);  background: transparent; }

/* 작은 라벨 조각 */
.tag {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 16px;
  border: 2px solid var(--line-strong);
  border-radius: 999px;
  font-size: var(--t-tag);
  font-weight: 500;
  color: var(--chalk-soft);
  white-space: nowrap;
}

.tag.is-amber  { border-color: var(--amber);  color: var(--amber);  background: var(--amber-dim); }
.tag.is-coral  { border-color: var(--coral);  color: var(--coral);  background: var(--coral-dim); }
.tag.is-teal   { border-color: var(--teal);   color: var(--teal);   background: var(--teal-dim); }
.tag.is-violet { border-color: var(--violet); color: var(--violet); background: var(--violet-dim); }
.tag--lg { padding: 10px 22px; font-size: var(--t-small); }

/* 나무그림·벤다이어그램 등에서 재사용하는 원형 노드 */
.node {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 84px;
  height: 84px;
  border: 3px solid var(--line-strong);
  border-radius: 50%;
  background: var(--panel-2);
  font-size: var(--t-h2);
  font-weight: 600;
  user-select: none;
}

.node.is-amber  { border-color: var(--amber);  color: var(--amber);  }
.node.is-coral  { border-color: var(--coral);  color: var(--coral);  }
.node.is-teal   { border-color: var(--teal);   color: var(--teal);   }
.node.is-violet { border-color: var(--violet); color: var(--violet); }
.node.is-off    { border-color: var(--line); color: var(--chalk-faint); background: transparent; }

/* --------------------------------------------------------- 6. 숫자 카드 */
/* 카드·주사위 문항에서 '윗면의 수'를 보여주는 카드.
   .pcard 는 클릭해 뒤집는 큰 카드, .pcard-sm 은 경우를 나열하는 작은 카드. */
.pcardsRow,
.pcards-row { display: flex; gap: 16px; }
.pcardsRow--sm,
.pcards-row--sm { gap: 8px; }

.pcard {
  width: var(--pcard-w);
  height: var(--pcard-h);
  border-radius: var(--r-m);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--f-en);
  font-weight: 700;
  font-size: var(--pcard-fs);
  line-height: 1;
  border: 3px solid var(--line-strong);
  background: var(--panel);
  cursor: pointer;
  user-select: none;
  transition: box-shadow .15s ease;
}
.pcard:hover { box-shadow: 0 0 0 4px rgba(255, 255, 255, .14); }

.pcard-sm {
  width: var(--pcard-sm-w);
  height: var(--pcard-sm-h);
  border-radius: var(--r-s);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--f-en);
  font-weight: 700;
  font-size: var(--pcard-sm-fs);
  line-height: 1;
  border: 2px solid var(--line-strong);
}

/* 카드 종류(색) — 문항에서 '파란 카드/노란 카드'처럼 구분할 때 */
.pcard.suit-amber,  .pcard-sm.suit-amber  { border-color: var(--amber);  color: var(--amber);  background: var(--amber-dim); }
.pcard.suit-coral,  .pcard-sm.suit-coral  { border-color: var(--coral);  color: var(--coral);  background: var(--coral-dim); }
.pcard.suit-teal,   .pcard-sm.suit-teal   { border-color: var(--teal);   color: var(--teal);   background: var(--teal-dim); }
.pcard.suit-violet, .pcard-sm.suit-violet { border-color: var(--violet); color: var(--violet); background: var(--violet-dim); }

/* 지금 주목해야 할 카드 */
.pcard.hi, .pcard-sm.hi { box-shadow: 0 0 0 4px var(--coral); }

/* 뒤집기: JS 에서 클래스를 뗐다 붙이면 재생된다 */
@keyframes pcardFlip {
  0%   { transform: rotateY(0); }
  50%  { transform: rotateY(90deg); }
  100% { transform: rotateY(0); }
}
.pcard.flip, .pcard-sm.flip { animation: pcardFlip .46s ease; }

/* ------------------------------------------------- 7. 경우의 수 시각화 */
/* 'C(4,1)=4가지'를 말로만 하지 않고, 자리 하나씩 강조한 막대 4개로 보여준다.
   막대마다 .show 를 시차를 두고 붙이면 세는 과정이 눈에 보인다. */
.posbars {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  height: 24px;
}
.posbar {
  display: flex;
  gap: 3px;
  opacity: 0;
  transform: scale(.6);
  transition: opacity .22s ease, transform .22s ease;
}
.posbar.show { opacity: 1; transform: scale(1); }
.possq {
  width: 11px;
  height: 20px;
  border-radius: 3px;
  background: rgba(255, 255, 255, .16);
}
.possq.hi       { background: var(--coral); }
.possq.hi-amber { background: var(--amber); }
.possq.hi-teal  { background: var(--teal);  }

/* --------------------------------------------------- 8. 경우 분류 카드 */
/* 경우를 몇 가지 유형으로 나눠 각각 세는 구조.
   위에 .tag 로 유형 이름을 얹고, 카드 아래쪽에 경우의 수를 고정 배치한다. */
.case-col, .caseCol {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  min-height: 0;
}

.case-card, .caseCard {
  width: 100%;
  flex: 1 1 auto;
  min-height: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  cursor: pointer;
  transition: border-color .15s ease, box-shadow .15s ease;
}
.case-card:hover, .caseCard:hover { border-color: var(--amber); }

/* 지금 조작 결과가 이 유형에 해당한다 */
.case-card.is-live, .caseCard.is-live {
  border-color: var(--amber);
  box-shadow: 0 0 0 5px var(--amber-dim);
}
/* 이미 세어 공개한 유형 */
.case-card.is-revealed, .caseCard.is-revealed { border-color: var(--coral); }

/* 카드 바닥에 붙는 '경우의 수' 구역 — 카드 높이가 달라도 줄이 맞는다 */
.case-foot, .caseFoot {
  width: 100%;
  margin-top: auto;
  padding-top: 14px;
  border-top: 1px dashed var(--line);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}

.case-count, .caseCountVal {
  font-family: var(--f-en);
  font-weight: 700;
  font-size: 46px;
  line-height: 1.1;
  color: var(--chalk-faint);
}
.case-card.is-revealed .case-count,
.caseCard.is-revealed .caseCountVal { color: var(--coral); }

/* 근거 한 줄. 높이를 고정해 공개 전후로 레이아웃이 흔들리지 않게 한다. */
.case-formula, .caseFormula {
  margin: 0;
  height: 30px;
  font-size: var(--t-tag);
  color: var(--chalk-soft);
  text-align: center;
}

/* ------------------------------------------------------------- 9. 표 */
.tbl {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--t-body);
  font-variant-numeric: tabular-nums;
}

.tbl th,
.tbl td {
  padding: 14px 18px;
  border: 2px solid var(--line);
  text-align: center;
}

.tbl th {
  background: rgba(255, 255, 255, .05);
  font-weight: 600;
  color: var(--chalk-soft);
}

.tbl td.is-hit { background: var(--amber-dim); color: var(--amber); font-weight: 600; }
.tbl td.is-out { color: var(--chalk-faint); text-decoration: line-through; }

/* -------------------------------------------------------- 10. 조작 버튼 */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 13px 28px;
  border: 2px solid var(--line-strong);
  border-radius: 999px;
  background: transparent;
  color: var(--chalk);
  font-family: inherit;
  font-size: var(--t-small);
  font-weight: 600;
  cursor: pointer;
  transition: background .18s ease, border-color .18s ease, color .18s ease, opacity .18s ease;
}

.btn:hover  { background: rgba(255, 255, 255, .07); }
.btn:active { transform: translateY(1px); }

.btn--amber  { border-color: var(--amber);  color: var(--amber);  }
.btn--amber:hover  { background: var(--amber-dim); }
.btn--teal   { border-color: var(--teal);   color: var(--teal);   }
.btn--teal:hover   { background: var(--teal-dim); }
.btn--coral  { border-color: var(--coral);  color: var(--coral);  }
.btn--coral:hover  { background: var(--coral-dim); }
.btn--violet { border-color: var(--violet); color: var(--violet); }
.btn--violet:hover { background: var(--violet-dim); }

.btn[disabled] { opacity: .3; cursor: default; }
.btn[disabled]:hover { background: transparent; }

/* 버튼 안 아이콘 (선 아이콘 기준) */
.btn svg { width: 22px; height: 22px; flex: none; }

:where(button, [tabindex], .draggable):focus-visible {
  outline: 3px solid var(--amber);
  outline-offset: 4px;
}

/* 진행 표시 점 */
.dots { display: flex; gap: 12px; align-items: center; }
.dots i {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--line-strong);
  transition: background .2s ease, transform .2s ease;
}
.dots i.on { background: var(--amber); transform: scale(1.25); }

/* 리모컨/키보드 안내 (키보드를 병행할 때만) */
.hint {
  font-size: var(--t-tag);
  color: var(--chalk-faint);
}
.key {
  display: inline-block;
  padding: 2px 10px;
  border: 2px solid var(--line-strong);
  border-radius: 8px;
  font-size: .9em;
}

/* ------------------------------------------------ 11. 단계별 설명 노출 */
/* 원칙: 조작(드래그 완료, 케이스 클릭 등)의 '결과로' .on 이 붙는다.
   구조 전환이 아니면 이전 단계를 지우지 말고 아래로 누적한다. */
.step {
  opacity: 0;
  transform: translateY(14px);
  transition: opacity .32s ease, transform .32s ease;
  pointer-events: none;
}
.step.on {
  opacity: 1;
  transform: none;
  pointer-events: auto;
}

/* 자리를 차지하지 않고 사라져야 할 때 */
.step--collapse { display: none; }
.step--collapse.on { display: block; }

/* 시선을 한 번 끌어야 하는 값 */
@keyframes pop {
  0%   { transform: scale(1); }
  45%  { transform: scale(1.14); }
  100% { transform: scale(1); }
}
.pop { animation: pop .42s ease; }

@keyframes glow {
  0%, 100% { box-shadow: 0 0 0 0 rgba(245, 182, 66, 0); }
  50%      { box-shadow: 0 0 0 10px rgba(245, 182, 66, .22); }
}
.glow { animation: glow 1.1s ease 2; }

/* -------------------------------------------- 12. 드래그 / 드롭 인터랙션 */
.draggable {
  cursor: grab;
  user-select: none;
  touch-action: none;              /* 모바일/터치 TV 에서 스크롤 가로채기 방지 */
  transition: box-shadow .16s ease, transform .16s ease;
}
.draggable:active { cursor: grabbing; }

.draggable.is-dragging {
  z-index: 50;
  transform: scale(1.06);
  box-shadow: 0 18px 40px rgba(0, 0, 0, .45);
}

.slot {
  display: flex;
  align-items: center;
  justify-content: center;
  border: 3px dashed var(--line-strong);
  border-radius: var(--r-m);
  color: var(--chalk-faint);
  background: rgba(255, 255, 255, .02);
  transition: border-color .16s ease, background .16s ease, color .16s ease;
}

.slot.is-over {
  border-color: var(--amber);
  background: var(--amber-dim);
  color: var(--amber);
}

.slot.is-filled {
  border-style: solid;
  border-color: var(--teal);
  background: var(--teal-dim);
  color: var(--teal);
}

.slot.is-wrong {
  border-color: var(--coral);
  background: var(--coral-dim);
  color: var(--coral);
}

/* -------------------------------------------------- 13. 화살표 연결 레이어 */
/* .stage 안에 position:absolute; inset:0 인 SVG 를 깔고 그 위에 노드를 둔다 */
.arrow-layer {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 5;
  overflow: visible;
}

.arrow {
  fill: none;
  stroke: var(--chalk-soft);
  stroke-width: 4;
  stroke-linecap: round;
}

.arrow.is-amber { stroke: var(--amber); }
.arrow.is-coral { stroke: var(--coral); }
.arrow.is-teal  { stroke: var(--teal);  }
.arrow.is-ghost { stroke: var(--line-strong); stroke-dasharray: 10 12; }

/* 그어지는 과정을 보여줄 때: JS 에서 pathLength 를 잡고 클래스만 토글 */
@keyframes draw { to { stroke-dashoffset: 0; } }
.arrow.is-draw {
  stroke-dasharray: 1000;
  stroke-dashoffset: 1000;
  animation: draw .55s ease forwards;
}

/* 화살촉 색은 marker 정의에서 currentColor 대신 fill 을 직접 지정 */
.arrow-head        { fill: var(--chalk-soft); }
.arrow-head--amber { fill: var(--amber); }
.arrow-head--coral { fill: var(--coral); }
.arrow-head--teal  { fill: var(--teal);  }

/* SVG 안에서 쓰는 글자 */
.svg-label {
  font-family: var(--f-en), var(--f-kr), sans-serif;
  font-size: 28px;
  font-weight: 600;
  fill: var(--chalk-soft);
}
.svg-label.is-amber { fill: var(--amber); }
.svg-label.is-teal  { fill: var(--teal);  }
.svg-label.is-coral { fill: var(--coral); }

/* ------------------------------------------------------------ 14. 수식 */
/* 마이너스는 반드시 유니코드 마이너스(−, U+2212)를 쓸 것. 하이픈 금지. */

.m {
  font-family: var(--f-en), var(--f-kr), serif;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  line-height: 1.15;               /* 분수가 들어가도 줄 높이가 뛰지 않게 */
}

/* 변수는 이탤릭 */
.var { font-style: italic; }

/* 연산자 좌우 여백 */
.op { margin: 0 .22em; }

/* 스택형 분수: 가로 분수선 (슬래시 금지) */
.frac {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  vertical-align: middle;
  margin: 0 .2em;
  transform: translateY(-.06em);
  line-height: 1.02;
}
.frac > .num { padding: 0 .32em .05em; }
.frac > .den { padding: .07em .32em 0; border-top: .07em solid currentColor; }

/* 첨자: <sub>/<sup> 대신 translateY 로 위치 제어 (앱 간 시각 일관성) */
.sub {
  display: inline-block;
  font-size: .60em;
  font-style: italic;
  transform: translateY(.40em);
  letter-spacing: .01em;
}
.sup {
  display: inline-block;
  font-size: .60em;
  transform: translateY(-.52em);
}
.sub.is-up { font-style: normal; }   /* 숫자 첨자는 정체로 */

/* 조합 nCr / 순열 nPr / 중복조합 nHr */
.comb { display: inline-flex; align-items: center; }
.comb > .pre  { font-size: .60em; font-style: italic; transform: translateY(.40em); }
.comb > .sym  { font-size: 1em; font-weight: 500; margin: 0 .04em; }
.comb > .post { font-size: .60em; font-style: italic; transform: translateY(.40em); }

/* 시그마: 위/아래 범위 */
.sum {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  vertical-align: middle;
  margin: 0 .16em;
  line-height: 1;
}
.sum > .top { font-size: .46em; margin-bottom: .12em; }
.sum > .sym { font-size: 1.45em; line-height: .92; }
.sum > .bot { font-size: .46em; margin-top: .12em; }

/* 늘어나는 괄호 */
.paren {
  display: inline-block;
  transform: scaleY(1.5);
  transform-origin: center;
  margin: 0 .1em;
  font-weight: 300;
}

/* 강조 색 (수식 안에서) */
.hl-amber  { color: var(--amber);  }
.hl-coral  { color: var(--coral);  }
.hl-teal   { color: var(--teal);   }
.hl-violet { color: var(--violet); }
.hl-dim    { color: var(--chalk-faint); }

/* 취소선 (여사건, 제외되는 경우) */
.strike {
  position: relative;
  color: var(--chalk-faint);
}
.strike::after {
  content: "";
  position: absolute;
  left: -.08em;
  right: -.08em;
  top: 52%;
  height: 3px;
  background: var(--coral);
  transform: rotate(-6deg);
}

/* -------------------------------------------------------- 15. 배치 유틸 */
.row  { display: flex; align-items: center; }
.col  { display: flex; flex-direction: column; }
.wrap { flex-wrap: wrap; }
.between { justify-content: space-between; }
.center  { justify-content: center; align-items: center; }
.grow  { flex: 1 1 auto; min-height: 0; min-width: 0; }
.g8  { gap: 8px;  }
.g12 { gap: 12px; }
.g16 { gap: 16px; }
.g24 { gap: 24px; }
.g36 { gap: 36px; }
.g48 { gap: 48px; }

/* 그리드는 min-height:0 이 없으면 자식이 넘쳐도 줄어들지 않는다 */
.cols-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; min-height: 0; }
.cols-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; min-height: 0; }
.cols-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; min-height: 0; }
.stack-tight { line-height: 1.25; }

.t-hero  { font-size: var(--t-hero);  font-weight: 700; letter-spacing: -.02em; }
.t-title { font-size: var(--t-title); font-weight: 700; }
.t-h2    { font-size: var(--t-h2);    font-weight: 600; }
.t-body  { font-size: var(--t-body);  }
.t-small { font-size: var(--t-small); color: var(--chalk-soft); }
.t-tag   { font-size: var(--t-tag);   color: var(--chalk-faint); }
.nowrap  { white-space: nowrap; }
.m0      { margin: 0; }

.hr {
  height: 2px;
  background: var(--line);
  border: 0;
  margin: 0;
}

/* -------------------------------------------------------- 16. 접근성 */
@media (prefers-reduced-motion: reduce) {
  .step, .btn, .draggable, .slot, .dots i, .posbar {
    transition-duration: .01ms !important;
  }
  .pop, .glow, .arrow.is-draw, .pcard.flip, .pcard-sm.flip {
    animation: none !important;
  }
  .arrow.is-draw { stroke-dashoffset: 0; }
  .posbar { opacity: 1; transform: none; }
}


/* ============================================================================
   11-08 전용 확장 스타일 (chalk-stage.css 위에 얹는 앱 전용 규칙)
============================================================================ */
:root {
  /* 이 앱은 4단 수형도가 세로 공간을 많이 요구하므로 카드/간격 토큰을 축소 */
  --pcard-w: 78px; --pcard-h: 104px; --pcard-fs: 40px;
  --sheet-gap: 12px;
}
.app-head { padding-bottom: 8px; }
.app-sub { font-size: 22px; }
.app-foot { padding-top: 8px; }

#treeArea { position: relative; flex: 1 1 auto; min-height: 0; }

.card-col { display: flex; flex-direction: column; align-items: center; gap: 5px; }
.card-badge { height: 20px; font-size: 18px; font-weight: 700; color: var(--teal); }
.card-taken { height: 30px; display: flex; align-items: center; }
.card-taken span {
  padding: 3px 12px; border-radius: 8px; font-size: 16px; font-weight: 700;
  background: rgba(10, 20, 32, .85); border: 2px solid currentColor; opacity: 0;
  transition: opacity .3s;
}
.card-taken span.on { opacity: 1; }
.pcard.is-drawn { opacity: .22; filter: grayscale(.7); transform: translateY(4px) rotate(-3deg); }

.statPanel { display: flex; align-items: center; gap: 22px; padding: 12px 26px; }
.statPanel .stat { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 88px; }
.statPanel .stat .lab { font-size: 18px; color: var(--chalk-soft); }
.statPanel .stat .val { font-family: var(--f-en); font-size: 36px; font-weight: 700; line-height: 1; }
.statPanel .divider { width: 2px; height: 46px; background: var(--line); }
.statPanel .stat .val.is-goal { font-family: var(--f-kr); font-size: 21px; font-weight: 700; color: var(--chalk); line-height: 1.2; }


.tline { stroke: var(--line-strong); stroke-width: 5; stroke-linecap: round; opacity: 0; transition: opacity .4s, stroke .4s, stroke-width .4s; }
.tline.on { opacity: 1; }
.tline.hi { stroke: var(--amber); stroke-width: 8; filter: drop-shadow(0 0 10px rgba(245,182,66,.55)); }
.tline.dim { opacity: .28; }

.node-head { position: absolute; text-align: center; opacity: 0; transform: translateY(12px); transition: opacity .45s ease, transform .45s ease; }
.node-head.on { opacity: 1; transform: none; }
.node-head .cnt { font-size: 15px; color: var(--teal); margin-bottom: 1px; white-space: nowrap; }
.node-head .who { font-size: 23px; font-weight: 700; white-space: nowrap; }
.node-head .who.m { color: var(--coral); }
.node-head .who.j { color: var(--teal); }

.branch-label { position: absolute; text-align: center; transform: translateY(-50%); opacity: 0; transition: opacity .45s ease; }
.branch-label.on { opacity: 1; }
.branch-label .lab-tag { font-size: 14px; font-weight: 600; color: var(--chalk-soft); margin-bottom: 1px; }
.branch-label.win .lab-tag { color: var(--amber); }
.branch-label.cont { cursor: pointer; }
.branch-label .frac { font-size: 26px; }
.branch-label.dim { opacity: .3 !important; }

.tmark { position: absolute; transform: translateY(-50%); font-size: 28px; font-weight: 700; opacity: 0; transition: opacity .4s; }
.tmark.on { opacity: 1; }
.tmark.star { color: var(--amber); text-shadow: 0 0 14px rgba(245,182,66,.5); }
.tmark.cross { color: var(--coral); }
.tmark.on.cross { opacity: .85; }
.tmark.dim { opacity: .3 !important; }

.tdots { position: absolute; transform: translateY(-50%); font-size: 24px; color: var(--line-strong); letter-spacing: 2px; opacity: 0; transition: opacity .4s; }
.tdots.on { opacity: 1; }

.formulaRow { display: flex; align-items: center; gap: 2px; opacity: 0; transform: translateY(10px); transition: opacity .45s, transform .45s; flex-wrap: nowrap; }
.formulaRow.on { opacity: 1; transform: none; }
#capLine { opacity: 0; transform: translateY(10px); transition: opacity .45s, transform .45s; color: var(--amber); }
#capLine.on { opacity: 1; transform: none; }

</style>
</head>
<body>

<div class="viewport">
  <div class="stage" id="stage">
    <div class="sheet">

      <!-- ===================== 머리말 ===================== -->
      <header class="app-head">
        <div>
          <h1 class="app-title"><span class="stamp">11-08</span>소수 카드로 승부 가르기</h1>
          <p class="app-sub">1~7 카드에서 민재 → 지유 순으로 1장씩 뽑기 · 먼저 소수가 적힌 카드를 뽑으면 승리 · 지유가 이길 확률은?</p>
        </div>
      </header>

      <!-- ===================== 본문 ===================== -->
      <div class="panelWrap grow" id="panelMain" style="min-height:0;">

        <div class="row between" style="align-items:flex-start;">
          <div class="pcardsRow" id="cards"></div>
          <div class="panel panel--raise statPanel">
            <div class="stat"><span class="lab">남은 카드</span><span class="val hl-amber" id="cTotal">7<span style="font-size:22px;font-family:var(--f-kr);">장</span></span></div>
            <div class="divider"></div>
            <div class="stat"><span class="lab">그중 소수</span><span class="val hl-teal" id="cPrime">4<span style="font-size:22px;font-family:var(--f-kr);">장</span></span></div>
            <div class="divider"></div>
            <div class="stat"><span class="lab">구하는 것</span><span class="val is-goal">지유의<br>승리 확률</span></div>
          </div>
        </div>

        <div id="treeArea">
          <svg id="lines" style="position:absolute;inset:0;overflow:visible;"></svg>
          <div id="nodes"></div>
        </div>

        <p class="m t-h2" id="capLine" style="margin:0;">지유가 이기는 두 가지 경로</p>

        <div class="row between" style="align-items:center;">
          <div class="formulaRow m" id="fRow"></div>
        </div>

      </div>

      <!-- ===================== 발판 ===================== -->
      <footer class="app-foot">
        <div class="dots" id="dots"></div>
        <div class="row g12">
          <button class="btn" id="resetBtn">처음</button>
          <button class="btn" id="prevBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            이전
          </button>
          <button class="btn btn--amber" id="nextBtn">
            다음
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
          </button>
          <button class="btn btn--teal" id="fsBtn">
            <svg id="fsIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/><path d="M8 21H5a2 2 0 0 1-2-2v-3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
            <span id="fsLabel">전체화면</span>
          </button>
        </div>
      </footer>

    </div>
  </div>
</div>

<script>
'use strict';

/* ---------------------------------------------------------------------------
   1) 16:9 스케일링
--------------------------------------------------------------------------- */
const STAGE_W = 1600, STAGE_H = 900;
const stage = document.getElementById('stage');

function fitStage() {
  const vv = window.visualViewport;
  const w = vv ? vv.width  : window.innerWidth;
  const h = vv ? vv.height : window.innerHeight;
  const s = Math.min(w / STAGE_W, h / STAGE_H);
  const x = Math.round((w - STAGE_W * s) / 2);
  const y = Math.round((h - STAGE_H * s) / 2);
  stage.style.transform = 'translate(' + x + 'px, ' + y + 'px) scale(' + s + ')';
}
function fitSoon() { [0, 60, 300, 700].forEach(function (t) { setTimeout(fitStage, t); }); }
fitSoon();
window.addEventListener('load', fitSoon);
window.addEventListener('resize', fitStage);
window.addEventListener('orientationchange', fitSoon);
if (window.visualViewport) {
  visualViewport.addEventListener('resize', fitStage);
  visualViewport.addEventListener('scroll', fitStage);
}
document.addEventListener('fullscreenchange', fitSoon);

/* ---------------------------------------------------------------------------
   2) 전체화면
--------------------------------------------------------------------------- */
const fsBtn = document.getElementById('fsBtn');
const fsLabel = document.getElementById('fsLabel');
const fsIcon = document.getElementById('fsIcon');
const ICON_ENTER = '<path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/><path d="M8 21H5a2 2 0 0 1-2-2v-3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>';
const ICON_EXIT  = '<path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M16 3v3a2 2 0 0 0 2 2h3"/><path d="M8 21v-3a2 2 0 0 0-2-2H3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/>';
function isFullscreen() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function syncFsButton() {
  const on = isFullscreen();
  fsLabel.textContent = on ? '창으로' : '전체화면';
  fsIcon.innerHTML = on ? ICON_EXIT : ICON_ENTER;
  fsBtn.title = on ? '전체화면 해제' : '전체화면으로 보기';
}
function toggleFullscreen() {
  if (!isFullscreen()) {
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req) { Promise.resolve(req.call(el)).catch(function () {}); }
  } else {
    const exit = document.exitFullscreen || document.webkitExitFullscreen;
    if (exit) { Promise.resolve(exit.call(document)).catch(function () {}); }
  }
  setTimeout(syncFsButton, 120);
}
fsBtn.addEventListener('click', toggleFullscreen);
document.addEventListener('fullscreenchange', syncFsButton);
document.addEventListener('webkitfullscreenchange', syncFsButton);
syncFsButton();

/* ---------------------------------------------------------------------------
   3) 카드 1~7
--------------------------------------------------------------------------- */
const PRIMES = [2, 3, 5, 7];
const cardsEl = document.getElementById('cards');
for (let n = 1; n <= 7; n++) {
  const p = PRIMES.includes(n);
  const col = document.createElement('div');
  col.className = 'card-col';
  col.innerHTML =
    '<div class="card-badge">' + (p ? '소수' : '') + '</div>' +
    '<div class="pcard' + (p ? ' suit-teal' : '') + '" data-n="' + n + '">' + n + '</div>' +
    '<div class="card-taken" data-taken="' + n + '"><span></span></div>';
  cardsEl.appendChild(col);
}
/* 뽑히는 순서: 1(민재) → 4(지유) → 6(민재) — 모두 소수가 아님 */
const DRAWN = [
  { n: 1, who: '민재', cls: 'hl-coral' },
  { n: 4, who: '지유', cls: 'hl-teal' },
  { n: 6, who: '민재', cls: 'hl-coral' }
];

/* ---------------------------------------------------------------------------
   4) 수형도
--------------------------------------------------------------------------- */
const S = [
  { i: 1, who: '민재', cls: 'm', nx: 200, ny: 92,  total: 7, prime: 4, win: [4, 7], cont: [3, 7], jiyu: false },
  { i: 2, who: '지유', cls: 'j', nx: 520, ny: 156, total: 6, prime: 4, win: [4, 6], cont: [2, 6], jiyu: true },
  { i: 3, who: '민재', cls: 'm', nx: 840, ny: 220, total: 5, prime: 4, win: [4, 5], cont: [1, 5], jiyu: false },
  { i: 4, who: '지유', cls: 'j', nx: 1160, ny: 284, total: 4, prime: 4, win: [4, 4], cont: null, jiyu: true }
];
const OFF = 34;
const svg = document.getElementById('lines'), nodes = document.getElementById('nodes');
const NS = 'http://www.w3.org/2000/svg';

function frac(a, b, cls) {
  return '<span class="frac ' + (cls || '') + '"><span class="num">' + a + '</span><span class="den">' + b + '</span></span>';
}
function mkline(id, x1, y1, x2, y2) {
  const l = document.createElementNS(NS, 'line');
  l.id = id; l.setAttribute('x1', x1); l.setAttribute('y1', y1);
  l.setAttribute('x2', x2); l.setAttribute('y2', y2);
  l.setAttribute('class', 'tline');
  svg.appendChild(l); return l;
}

S.forEach(function (s) {
  const single = !s.cont;
  const wy = single ? s.ny : s.ny - OFF;

  mkline('l' + s.i + 'w', s.nx, s.ny, s.nx + 96, wy);
  if (!single) mkline('l' + s.i + 'c', s.nx, s.ny, s.nx + 96, s.ny + OFF);

  const dot = document.createElementNS(NS, 'circle');
  dot.setAttribute('cx', s.nx); dot.setAttribute('cy', s.ny); dot.setAttribute('r', 7);
  dot.setAttribute('fill', 'var(--chalk)');
  dot.id = 'c' + s.i;
  dot.style.opacity = 0; dot.style.transition = 'opacity .4s';
  svg.appendChild(dot);

  const g = document.createElement('div');
  g.innerHTML =
    '<div class="node-head" id="g' + s.i + '" style="left:' + (s.nx - 70) + 'px;top:' + (s.ny - 78) + 'px;width:200px;">' +
      '<div class="cnt">전체 ' + s.total + ' · 소수 ' + s.prime + '</div>' +
      '<div class="who ' + s.cls + '">' + ['①', '②', '③', '④'][s.i - 1] + ' ' + s.who + '</div>' +
    '</div>' +
    '<div class="branch-label win" id="bw' + s.i + '" style="left:' + (s.nx + 140) + 'px;top:' + wy + 'px;width:80px;">' +
      '<div class="lab-tag">승리</div>' + frac(s.win[0], s.win[1], 'hl-amber') +
    '</div>' +
    '<div class="tmark ' + (s.jiyu ? 'star' : 'cross') + '" id="mk' + s.i + '" style="left:' + (s.nx + 230) + 'px;top:' + wy + 'px;">' +
      (s.jiyu ? '★' : '✕') + '</div>';
  if (!single) {
    g.innerHTML +=
      '<div class="branch-label cont" id="bc' + s.i + '" data-step="' + s.i + '" style="left:' + (s.nx + 140) + 'px;top:' + (s.ny + OFF) + 'px;width:80px;">' +
        '<div class="lab-tag">계속</div>' + frac(s.cont[0], s.cont[1]) +
      '</div>' +
      '<div class="tdots" id="dt' + s.i + '" style="left:' + (s.nx + 222) + 'px;top:' + (s.ny + OFF + 18) + 'px;">⋯</div>';
  }
  while (g.firstChild) nodes.appendChild(g.firstChild);
});

nodes.addEventListener('click', function (e) {
  const b = e.target.closest('.branch-label.cont');
  if (b && step === +b.dataset.step) go(step + 1);
});

/* ---------------------------------------------------------------------------
   5) 식
--------------------------------------------------------------------------- */
document.getElementById('fRow').innerHTML =
  frac(3, 7) + '<span class="op">×</span>' + frac(4, 6) +
  '<span class="op">+</span>' +
  frac(3, 7) + '<span class="op">×</span>' + frac(2, 6) + '<span class="op">×</span>' + frac(1, 5) + '<span class="op">×</span>1' +
  '<span class="op">=</span>' + frac('12×5+6', '7×6×5') +
  '<span class="op">=</span>' + frac(66, 210) +
  '<span class="op">=</span><span class="result" style="display:inline-flex;padding:6px 26px;border-width:3px;font-size:1em;margin-left:6px;">' + frac(11, 35, 'hl-amber') + '</span>';

/* ---------------------------------------------------------------------------
   6) 진행 제어
--------------------------------------------------------------------------- */
const MAX = 7;
let step = 0;
const dotsEl = document.getElementById('dots');
for (let i = 0; i <= MAX; i++) dotsEl.appendChild(document.createElement('i'));
const dots = Array.prototype.slice.call(dotsEl.children);

const HI = ['l1c', 'l2w', 'l2c', 'l3c', 'l4w'];
const HIL = ['bc1', 'bw2', 'bc2', 'bc3', 'bw4'];

function render() {
  DRAWN.forEach(function (d, k) {
    const on = step >= k + 2;
    document.querySelector('.pcard[data-n="' + d.n + '"]').classList.toggle('is-drawn', on);
    const t = document.querySelector('.card-taken[data-taken="' + d.n + '"] span');
    t.className = (on ? 'on ' : '') + d.cls;
    t.textContent = d.who;
  });

  const tot = step <= 1 ? 7 : step === 2 ? 6 : step === 3 ? 5 : 4;
  document.getElementById('cTotal').innerHTML = tot + '<span style="font-size:22px;font-family:var(--f-kr);">장</span>';
  document.getElementById('cPrime').innerHTML = 4 + '<span style="font-size:22px;font-family:var(--f-kr);">장</span>';

  S.forEach(function (s) {
    const on = step >= s.i;
    document.getElementById('g' + s.i).classList.toggle('on', on);
    document.getElementById('c' + s.i).style.opacity = on ? 1 : 0;
    const w = document.getElementById('l' + s.i + 'w'); if (w) w.classList.toggle('on', on);
    const c = document.getElementById('l' + s.i + 'c'); if (c) c.classList.toggle('on', on);
    const bw = document.getElementById('bw' + s.i); if (bw) bw.classList.toggle('on', on);
    const bc = document.getElementById('bc' + s.i); if (bc) bc.classList.toggle('on', on);
    const mk = document.getElementById('mk' + s.i); if (mk) mk.classList.toggle('on', on);
    const dt = document.getElementById('dt' + s.i); if (dt) dt.classList.toggle('on', on);
  });

  const focus = step >= 5;
  ['l1w', 'l1c', 'l2w', 'l2c', 'l3w', 'l3c', 'l4w'].forEach(function (id) {
    const e = document.getElementById(id); if (e) e.classList.toggle('dim', focus && HI.indexOf(id) === -1);
  });
  HI.forEach(function (id) { const e = document.getElementById(id); if (e) e.classList.toggle('hi', focus); });
  HIL.forEach(function (id) { const e = document.getElementById(id); if (e) e.classList.toggle('hi', focus); });
  ['bw1', 'bw3'].forEach(function (id) { const e = document.getElementById(id); if (e) e.classList.toggle('dim', focus); });
  document.querySelectorAll('.tmark.cross').forEach(function (e) { e.classList.toggle('dim', focus); });

  document.getElementById('capLine').classList.toggle('on', step === 5);
  document.getElementById('fRow').classList.toggle('on', step >= 6);

  dots.forEach(function (d, i) { d.classList.toggle('on', i <= step); });
  document.getElementById('prevBtn').disabled = (step === 0);
  document.getElementById('nextBtn').disabled = (step === MAX);
}
function go(n) { step = Math.max(0, Math.min(MAX, n)); render(); }
document.getElementById('nextBtn').addEventListener('click', function () { go(step + 1); });
document.getElementById('prevBtn').addEventListener('click', function () { go(step - 1); });
document.getElementById('resetBtn').addEventListener('click', function () { go(0); });
document.addEventListener('keydown', function (e) {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); go(step + 1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); go(step - 1); }
});
render();
</script>
</body>
</html>
