<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>표본평균의 분포</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400..700;1,400..700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg-deep:#0a1420; --bg:#0e1b2b; --panel:#16283e; --panel-2:#1d3350;
  --line:rgba(214,229,245,.16); --line-strong:rgba(214,229,245,.34);
  --chalk:#eaf1f8; --chalk-soft:#b9cadd; --chalk-faint:#7d94ad;
  --amber:#f5b642; --teal:#49d1c0; --violet:#9d8cf5; --coral:#ff7d6a; --sky:#8ec5ff;
  --f-en:'STIX Two Text'; --f-kr:'Noto Sans KR';
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg-deep);
  overscroll-behavior:none;touch-action:manipulation;-webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent}
body{color:var(--chalk);font-family:var(--f-en),var(--f-kr),serif}
button{font:inherit;color:inherit}
.viewport{position:fixed;inset:0}
.stage{position:absolute;top:0;left:0;width:1600px;height:900px;transform-origin:0 0;
  background:var(--bg);overflow:hidden}
.sheet{height:100%;display:flex;flex-direction:column;gap:12px;padding:12px 22px 18px}

/* ── 머리말 ── */
.head{flex:0 0 72px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line);padding-bottom:10px}
.title{font-family:var(--f-kr);font-size:36px;font-weight:700;color:var(--amber);white-space:nowrap}
.tabs{flex:1;display:flex;gap:10px;margin:0 6px}
.tab{flex:1 1 0;font-family:var(--f-en),var(--f-kr);font-size:28px;font-weight:700;color:var(--chalk-soft);
  background:transparent;border:2px solid var(--line-strong);border-radius:12px;padding:7px 8px;
  white-space:nowrap;cursor:pointer}
.tab.on{background:rgba(245,182,66,.12);border-color:var(--amber);color:var(--amber)}
.fbtn{font-family:var(--f-kr);font-size:24px;font-weight:700;cursor:pointer;background:var(--panel-2);
  border:1.5px solid var(--line-strong);border-radius:10px;padding:10px 18px;white-space:nowrap}
.v{font-style:italic}

/* ── 본문 ── */
.body{flex:1 1 auto;min-height:0;position:relative}
.pane{position:absolute;inset:0;display:none;flex-direction:column;gap:16px}
.pane.on{display:flex}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px}
.top{flex:1 1 auto;min-height:0;display:flex;gap:16px}
.gcard{position:relative;flex:1 1 auto;min-width:0;min-height:0}
.gcard svg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.glab{position:absolute;left:18px;top:8px;font-size:30px;line-height:1.8;pointer-events:none;white-space:nowrap}
.gsel{position:absolute;right:16px;top:8px;font-size:32px;color:var(--amber);font-weight:700;pointer-events:none;
  white-space:nowrap;background:rgba(14,27,43,.9);border:2px solid var(--amber);border-radius:10px;padding:0 14px}
.gsel:empty{display:none}
.gx{position:absolute;right:20px;bottom:14px;font-size:30px;pointer-events:none}

/* ── 수식 ── */
.m{font-family:var(--f-en),var(--f-kr),serif;font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.45}
.frac{display:inline-flex;flex-direction:column;align-items:stretch;text-align:center;
  vertical-align:middle;margin:0 .14em;transform:translateY(-.08em);
  line-height:1.06;font-size:.84em;white-space:nowrap}
.frac>.num{padding:0 .2em .07em;border-bottom:.058em solid currentColor}
.frac>.den{padding:.09em .2em 0}
.ex{font-size:.6em;display:inline-block;vertical-align:baseline;transform:translateY(-.72em);margin:0 .02em}
.ex .frac{font-size:.9em}
.bp{display:inline-block;transform:scaleY(1.5);margin:0 .03em;transform-origin:50% 55%}
/* 표본평균의 막대 : 이탤릭 기울기만큼 오른쪽으로 */
.xb{position:relative;display:inline-block;font-style:italic}
.xb::before{content:'';position:absolute;left:.2em;right:.02em;top:.02em;border-top:.065em solid currentColor}
.xb.lc::before{left:.12em;right:0;top:.2em}
.sb{font-size:.62em;vertical-align:-.28em;font-style:normal}
.rt{display:inline-flex;align-items:flex-start}
.rt>.rr{border-top:.06em solid currentColor;padding:0 .08em;margin-top:.12em;line-height:1.15}
.ans{display:inline-flex;align-items:center;vertical-align:middle;color:var(--amber);font-weight:700;
  padding:.02em .26em;border:2px solid var(--amber);border-radius:.18em;box-shadow:0 0 20px rgba(245,182,66,.2)}
.dim{color:var(--chalk-soft)}
.tl{color:var(--teal)}
.am{color:var(--amber)}

/* ── 격자 (모든 경우) ── */
.grid{flex:0 0 430px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px}
.gtop{height:56px;display:flex;align-items:center;gap:8px;font-size:30px;white-space:nowrap}
.gtop .kr{font-family:var(--f-kr);font-size:26px;color:var(--chalk-soft)}
.l3{width:50px;height:54px;border-radius:10px;border:2px solid var(--violet);background:rgba(157,140,245,.12);
  font-size:30px;font-weight:700;cursor:pointer;position:relative;padding:0}
.l3.on{border-color:var(--amber);background:rgba(245,182,66,.18);color:var(--amber)}
.l3 b{position:absolute;right:-9px;top:-13px;min-width:28px;height:28px;border-radius:14px;background:var(--amber);
  color:#14202f;font-size:21px;line-height:28px;font-weight:700;padding:0 5px;display:none}
.l3 b.on{display:block}
.gt{border-collapse:collapse;font-variant-numeric:tabular-nums}
.gt th,.gt td{width:58px;height:58px;text-align:center;border:1.5px solid var(--line-strong);font-size:27px;line-height:1;padding:0}
.gt th{background:var(--panel-2);color:var(--chalk-soft);font-weight:600;width:46px;height:46px}
.gt th.diag{position:relative;background:var(--panel-2) linear-gradient(to top right,transparent calc(50% - 1px),var(--line-strong) 50%,transparent calc(50% + 1px))}
.gt th.diag i{position:absolute;font-size:19px;font-weight:500}
.gt th.diag .dn{right:3px;top:2px} .gt th.diag .dx{left:3px;bottom:3px}
.gt td{cursor:pointer;color:var(--chalk-soft)}
.gt td .frac{font-size:.8em}
.gt td.hit{background:rgba(245,182,66,.85);color:#14202f;font-weight:700}

/* ── 계산 칸 ── */
/* ── ③ X₃마다 개수 세기 ── */
.cnt{flex:1 1 auto;min-width:0;padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px}
.ctop{height:56px;display:flex;align-items:center;gap:12px;white-space:nowrap}
.ctop .kr{font-family:var(--f-kr);font-size:28px;font-weight:700;color:var(--chalk-soft);margin-right:auto}
.ctop .tg,.back{flex:0 0 auto;padding:8px 20px}
.cntt{flex:1 1 auto;width:100%;border-collapse:collapse;table-layout:fixed;font-variant-numeric:tabular-nums}
.cntt th,.cntt td{border:1.5px solid var(--line-strong);text-align:center;padding:0;line-height:1;white-space:nowrap;font-size:30px}
.cntt th{background:var(--panel-2);color:var(--chalk-soft);font-weight:600;cursor:pointer}
.cntt th .frac{font-size:.78em;margin:0}
.cntt th.rk{font-size:28px;cursor:pointer;color:var(--violet);background:rgba(157,140,245,.1);outline:2.5px dashed var(--violet);outline-offset:-5px}
.cntt th.rk.fill{color:var(--chalk-soft);background:var(--panel-2);outline:none}
.cntt th.rk.cur{outline:3px solid var(--amber);outline-offset:-3px;color:var(--amber)}
.cntt td{cursor:pointer;color:var(--chalk)}
.cntt td.nz{background:rgba(73,209,192,.16)}
.cntt td.cur.nz{background:rgba(73,209,192,.34);font-weight:700}
.cntt tr.srow th{font-family:var(--f-kr);font-size:26px;cursor:pointer}
.cntt tr.srow th.rk{font-family:var(--f-kr)}
.cntt tr.srow td{color:var(--amber);font-weight:700;background:rgba(245,182,66,.08);border-top:3px solid var(--amber)}
.cntt .sel{background:rgba(245,182,66,.3)!important;color:var(--amber)}
.cntt th.sel{outline:3px solid var(--amber);outline-offset:-3px}
.pA .gcard,.pA .calc{display:none}
.pane:not(.pA) .cnt{display:none}
.back{position:absolute;left:8px;bottom:8px;font-family:var(--f-kr);font-size:24px;font-weight:700;border-radius:10px;
  border:2px solid var(--violet);background:rgba(157,140,245,.14);color:var(--chalk);cursor:pointer;padding:6px 12px}
.calc{flex:0 0 530px;padding:12px 18px 12px;display:flex;flex-direction:column;gap:2px}
.steps{display:flex;gap:10px;margin-bottom:8px}
.tg{flex:1 1 0;font-family:var(--f-en),var(--f-kr);font-size:26px;font-weight:700;padding:8px 0;border-radius:12px;
  border:2px dashed var(--violet);background:rgba(157,140,245,.12);color:var(--chalk);cursor:pointer;white-space:nowrap}
.tg.on{border-style:solid;border-color:var(--teal);color:var(--teal);background:rgba(73,209,192,.12)}
.tb:active,.tg:active,.tab:active,.fbtn:active,.l3:active{transform:scale(.97)}
.fl{min-height:58px;display:flex;align-items:center;font-size:36px}
.calc.big .fl{min-height:80px;font-size:42px}
.note{margin-top:auto;font-family:var(--f-kr);font-size:30px;line-height:1.5;color:var(--chalk-soft);word-break:keep-all;border-top:1.5px dashed var(--line-strong);padding-top:12px}
.fl.dimL{min-height:54px;font-size:32px}
.fl>span{white-space:nowrap;line-height:1.2}
.fl.hide{visibility:hidden}
.fl.cmp{color:var(--teal)}
.sep{border-top:1.5px dashed var(--line-strong);margin:4px 0}
.sep.hide{visibility:hidden}

/* ── 확률분포표 ── */
.dt{flex:0 0 264px;min-height:0;overflow:hidden;padding:8px 12px}
.dt table{width:100%;height:100%;border-collapse:collapse;table-layout:fixed;font-variant-numeric:tabular-nums}
.dt th,.dt td{border:1.5px solid var(--line-strong);text-align:center;padding:0 2px;line-height:1;white-space:nowrap}
.dt th{background:var(--panel-2);color:var(--chalk-soft);font-weight:600}
.dt th.rl{font-weight:600}
.dt th.rl.rlb{cursor:pointer;color:var(--violet);background:rgba(157,140,245,.12);outline:2.5px dashed var(--violet);outline-offset:-5px}
.dt tr{height:25%}
.dt td>span:not(.frac){display:inline-block;line-height:1}
.dt tr.off td>*{visibility:hidden}
.dt td{color:var(--chalk);cursor:pointer}
.dt .frac{margin:0 .04em}
.dt .frac>.num,.dt .frac>.den{padding-left:.1em;padding-right:.1em}
.dt td.sum{color:var(--amber);font-weight:700;cursor:default;background:rgba(245,182,66,.07)}
.dt .sel{background:rgba(245,182,66,.22)!important;color:var(--amber)}
.dt th.sel{outline:3px solid var(--amber);outline-offset:-3px}

/* ── ④ 정리 ── */
.law{flex:0 0 auto;padding:16px 30px 18px;border-left:8px solid var(--amber)}
.lawT{font-family:var(--f-kr);font-size:32px;font-weight:700;color:var(--amber);display:flex;justify-content:space-between;align-items:center}
.lawT .tg{flex:0 0 auto;padding:6px 22px;border-style:solid;border-color:var(--line-strong);background:transparent;color:var(--chalk-soft);font-size:26px}
.lawB{font-family:var(--f-kr);font-size:36px;line-height:1.5;margin-top:6px;word-break:keep-all}
.lawB .m{font-size:40px;line-height:1}
.lawF{margin-top:8px;display:flex;gap:56px;align-items:center}
.blank{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;min-width:92px;min-height:80px;
  margin:0 .12em;border:2.5px dashed var(--violet);border-radius:12px;background:rgba(157,140,245,.12);cursor:pointer;padding:0 12px}
.blank>span{visibility:hidden}
.blank.open{border-style:solid;border-color:var(--amber);background:rgba(245,182,66,.12);color:var(--amber)}
.blank.open>span{visibility:visible}
.bot{flex:1 1 auto;min-height:0;display:flex;gap:16px}
.ct{flex:0 0 690px;padding:14px 16px}
.ct table{width:100%;height:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.ct th,.ct td{border:1.5px solid var(--line-strong);text-align:center;padding:0 10px;font-size:34px;line-height:1;white-space:nowrap}
.ct th{background:var(--panel-2);color:var(--chalk-soft);font-weight:600}
.ct th.kr{font-family:var(--f-kr);font-size:28px}
.ct td.vv{text-align:left;padding-left:22px}
button:focus{outline:none}
button:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="viewport"><div class="stage" id="stage"><div class="sheet">

  <header class="head">
    <div class="title">표본평균의 분포</div>
    <nav class="tabs" id="tabs">
      <button class="tab on" data-t="0">① 모집단</button>
      <button class="tab" data-t="1">② 크기 2인 표본</button>
      <button class="tab" data-t="2">③ 크기 3인 표본</button>
      <button class="tab" data-t="3">④ 정리</button>
    </nav>
    <button class="fbtn" id="resetBtn">초기화</button>
    <button class="fbtn" id="fsBtn">전체화면</button>
  </header>

  <main class="body" id="main"></main>
</div></div></div>

<script>
'use strict';
/* ═══ 1. 스테이지 스케일링 ═══ */
const STAGE_W=1600, STAGE_H=900, stage=document.getElementById('stage');
function fitStage(){
  const vv=window.visualViewport;
  const w=vv?vv.width:innerWidth, h=vv?vv.height:innerHeight;
  const s=Math.min(w/STAGE_W,h/STAGE_H);
  stage.style.transform=`translate(${Math.round((w-STAGE_W*s)/2)}px,${Math.round((h-STAGE_H*s)/2)}px) scale(${s})`;
}
const fitSoon=()=>[0,60,300,700].forEach(t=>setTimeout(fitStage,t));
addEventListener('resize',fitStage); addEventListener('orientationchange',fitSoon);
if(window.visualViewport) visualViewport.addEventListener('resize',fitStage);
document.addEventListener('fullscreenchange',fitSoon);
fitSoon();

/* ═══ 2. 수식 조각 ═══ */
const F=(a,b)=>`<span class="frac"><span class="num">${a}</span><span class="den">${b}</span></span>`;
const V=s=>`<span class="v">${s}</span>`;
const EX=s=>`<span class="ex">${s}</span>`;
const SB=s=>`<span class="sb">${s}</span>`;
const ANS=s=>`<span class="ans">${s}</span>`;
const RT=s=>`<span class="rt">√<span class="rr">${s}</span></span>`;
const BP=s=>`<span class="bp">(</span>${s}<span class="bp">)</span>`;
const XB=`<span class="xb">X</span>`, xb=`<span class="xb lc">x</span>`;
const Xv=V('X'), xv=V('x'), mv=V('m'), sg=V('σ'), nv=V('n');
const gcd=(a,b)=>b?gcd(b,a%b):a;
function fr(num,den){ const g=gcd(Math.abs(num),den); num/=g; den/=g; return den===1?`${num}`:F(num,den); }
const frs=(num,den)=>{ const g=gcd(num,den); return den/g===1?`${num/g}`:`${num/g}/${den/g}`; };  /* SVG 용 */

/* ═══ 3. 확률분포 : 주사위 n개의 합 S, 표본평균 = S/n ═══ */
function makeDist(n){
  let c=[1,1,1,1,1,1]; /* c[k] : 합이 n+k 인 경우의 수 */
  for(let t=1;t<n;t++){ const d=new Array(c.length+5).fill(0); c.forEach((v,i)=>{ for(let f=0;f<6;f++) d[i+f]+=v; }); c=d; }
  const N=6**n, rows=c.map((cnt,k)=>({s:n+k,c:cnt}));
  const SX=rows.reduce((a,r)=>a+r.s*r.c,0), SX2=rows.reduce((a,r)=>a+r.s*r.s*r.c,0);
  return {n,N,rows,SX,SX2,maxc:Math.max(...c)};
}
const D={1:makeDist(1),2:makeDist(2),3:makeDist(3)};
/* 모집단 : m = 7/2, σ² = 35/12 */

/* ═══ 4. SVG 도구 ═══ */
const SER="'STIX Two Text','Noto Sans KR',serif", KR="'Noto Sans KR',sans-serif";
const CSS=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const COL={};
function txt(x,y,s,size,fill,o){
  o=o||{};
  return `<text x="${x}" y="${y}" text-anchor="${o.anchor||'middle'}" dominant-baseline="central"
    font-family="${o.kr?KR:SER}" font-size="${size}" font-weight="${o.w||500}" fill="${fill}"
    ${o.it?'font-style="italic"':''} pointer-events="none">${s}</text>`;
}
function sfrac(x,y,a,b,size,fill,o){
  o=o||{}; const w=Math.max(String(a).length,String(b).length)*size*.56+10;
  return txt(x,y-size*.58,a,size,fill,{it:o.ita,w:o.w||600})+txt(x,y+size*.62,b,size,fill,{it:o.itb,w:o.w||600})+
    `<line x1="${x-w/2}" y1="${y}" x2="${x+w/2}" y2="${y}" stroke="${fill}" stroke-width="2.2"/>`;
}
function fitSvg(svg,cb){
  const wrap=svg.parentElement;
  new ResizeObserver(()=>{
    const w=Math.round(wrap.clientWidth), h=Math.round(wrap.clientHeight);
    if(!w||!h||(w===svg._w&&h===svg._h)) return;
    svg._w=w; svg._h=h; svg.setAttribute('viewBox',`0 0 ${w} ${h}`); cb();
  }).observe(wrap);
}
function svgPt(svg,e){
  const p=svg.createSVGPoint(); p.x=e.clientX; p.y=e.clientY;
  return p.matrixTransform(svg.getScreenCTM().inverse());
}

/* ═══ 5. 탭 ①②③ 화면 만들기 ═══ */
const main=document.getElementById('main');
const T=[];  /* 탭 상태 */
const RV=n=>n===1?Xv:XB, rv=n=>n===1?xv:xb;     /* 확률변수 기호, 값 기호 */
function buildPane(n,idx){
  const sec=document.createElement('section');
  sec.className='pane'+(idx===0?' on':''); sec.id='p'+idx;
  sec.innerHTML=`
    <div class="top">
      ${n>1?`<div class="card grid"><div class="gtop"></div><table class="gt"></table></div>`:''}
      ${n===3?`<div class="card cnt"><div class="ctop"><span class="kr">${Xv}${SB(3)}마다 개수 세기</span>
        <button class="tg" data-a="sum">세로로 합하기</button><button class="tg" data-a="go">그래프 · 계산 ▶</button></div>
        <table class="cntt"></table></div>`:''}
      <div class="card gcard"><svg></svg>${n===3?'<button class="back" data-a="back">◀ 세기</button>':''}
        <div class="glab m">P${BP(`${RV(n)} = ${rv(n)}`)}</div><div class="gsel m"></div><div class="gx m">${rv(n)}</div></div>
      <div class="card calc${n===1?' big':''}"${n===1?' style="flex-basis:620px"':''}><div class="steps"></div><div class="flines"></div>${n===1?`<div class="note">모집단 : 주사위 한 개를 던져 나오는 눈 <span class="m">${Xv}</span><br>→ 크기가 2, 3인 표본을 복원추출</div>`:''}</div>
    </div>
    <div class="card dt"><table></table></div>`;
  main.appendChild(sec);
  const S={n,idx,sec,sel:null,layer:1,f:[false,false,false],phase:'A',rows:[0,0,0,0,0,0,0],sumOn:false,
    cn:sec.querySelector('.cntt'),
    svg:sec.querySelector('svg'),gsel:sec.querySelector('.gsel'),tb:sec.querySelector('.dt table'),
    steps:sec.querySelector('.steps'),fls:sec.querySelector('.flines'),
    gt:sec.querySelector('.gt'),gtop:sec.querySelector('.gtop')};
  T[idx]=S;
  /* 단계 버튼 */
  const lab=n===1?[`평균 ${mv}`,`분산 ${sg}${EX(2)}`]:[`평균`,`분산`,`모집단과 비교`];
  S.steps.innerHTML=lab.map((l,k)=>`<button class="tg" data-k="${k}"${k===2?' style="flex:1.4 1 0"':''}>${l}</button>`).join('');
  S.steps.onclick=e=>{ const b=e.target.closest('[data-k]'); if(b){ S.f[+b.dataset.k]=!S.f[+b.dataset.k]; paint(S); } };
  /* 계산 줄 */
  const d=D[n], R=RV(n);
  const E2=`E${BP(R+EX(2))}`, ER=`E(${R})`, VR=`V(${R})`;
  const Lines=[];
  if(n===1){
    Lines.push([0,`${mv} = E(${Xv}) = ${F(d.SX,d.N)} = ${ANS(F(7,2))}`]);
    Lines.push([1,`${sg}${EX(2)} = V(${Xv}) = E${BP(Xv+EX(2))} − {E(${Xv})}${EX(2)}`]);
    Lines.push([1,`= ${F(d.SX2,d.N)} − ${BP(F(7,2))}${EX(2)} = ${ANS(F(35,12))}`]);
  }else{
    const g=n*d.N, g2=n*n*d.N;
    Lines.push([0,`${ER} = ${F(d.SX,g)} = ${ANS(F(7,2))}`]);
    Lines.push([1,`${VR} = ${E2} − {${ER}}${EX(2)}`]);
    Lines.push([1,`= ${fr(d.SX2,g2)} − ${BP(F(7,2))}${EX(2)} = ${ANS(fr(35,12*n))}`]);
    Lines.push([2,'sep']);
    Lines.push([2,`<span class="dim">모집단 :&nbsp; ${mv} = ${F(7,2)},&nbsp; ${sg}${EX(2)} = ${F(35,12)}</span>`,'dimL']);
    Lines.push([2,`${ER} = ${F(7,2)} = ${mv}`,'cmp']);
    Lines.push([2,`${VR} = ${fr(35,12*n)} = ${F(35,12)} × ${F(1,n)} = ${F(sg+EX(2),n)}`,'cmp']);
  }
  S.fls.innerHTML=Lines.map(([k,s,c])=>s==='sep'?`<div class="sep" data-k="${k}"></div>`:
    `<div class="fl m ${c||''}" data-k="${k}"><span>${s}</span></div>`).join('');
  /* 그래프 */
  fitSvg(S.svg,()=>drawBars(S));
  let down=false;
  const pick=e=>{
    const p=svgPt(S.svg,e), g=S.geo; if(!g) return;
    if(p.x<g.L-10||p.x>g.L+g.pw+10) return;
    const x=g.x0+(p.x-g.L)/g.pw*(g.x1-g.x0);
    select(S,Math.max(n,Math.min(6*n,Math.round(x*n))));
  };
  S.svg.addEventListener('pointerdown',e=>{ down=true; S.svg.setPointerCapture(e.pointerId); pick(e); });
  S.svg.addEventListener('pointermove',e=>{ if(down) pick(e); });
  S.svg.addEventListener('pointerup',()=>down=false);
  S.svg.addEventListener('pointercancel',()=>down=false);
  /* 표 */
  S.tb.onclick=e=>{
    const rl=e.target.closest('th.rl[data-k]');
    if(rl){ if(rl.dataset.k==='p'){ if(S.n===3){ S.sumOn=!S.sumOn; paint(S); } return; } S.f[+rl.dataset.k]=!S.f[+rl.dataset.k]; paint(S); return; }
    const c=e.target.closest('[data-s]'); if(c) select(S,+c.dataset.s,true);
  };
  if(S.gt){
    S.gt.onclick=e=>{ const c=e.target.closest('td[data-s]'); if(c) select(S,+c.dataset.s,true); };
    if(n===3){
      S.gtop.onclick=e=>{ const b=e.target.closest('[data-l]'); if(b){ S.layer=+b.dataset.l; paint(S); } };
      sec.addEventListener('click',e=>{ const b=e.target.closest('[data-a]'); if(!b) return;
        const a=b.dataset.a;
        if(a==='sum') S.sumOn=!S.sumOn;
        else if(a==='go'){ S.phase='B'; S.sumOn=true; S.rows.fill(1); }
        else if(a==='back') S.phase='A';
        paint(S); });
      S.cn.onclick=e=>{
        const r=e.target.closest('th[data-k]');
        if(r){ const k=+r.dataset.k;
          if(k===0) S.sumOn=!S.sumOn;
          else if(S.layer===k) S.rows[k]=S.rows[k]?0:1; else { S.layer=k; S.rows[k]=1; }
          paint(S); return; }
        const c=e.target.closest('[data-s]'); if(c) select(S,+c.dataset.s,true);
      };
    }
  }
  return S;
}
function select(S,s,toggle){ S.sel=(toggle&&S.sel===s)?null:s; paint(S); }

/* 모든 경우 격자 */
function paintGrid(S){
  const n=S.n; if(n===1) return;
  const L=n===3?S.layer:0;
  if(n===2){
    const c=S.sel!=null?D[2].rows.find(r=>r.s===S.sel).c:0;
    S.gtop.innerHTML=`<span class="m">(${Xv}${SB(1)}, ${Xv}${SB(2)})</span><span class="kr">&nbsp;36가지</span>`+
      (S.sel!=null?`<span class="m am" style="margin-left:auto">${xb} = ${fr(S.sel,2)} :&nbsp;</span><span class="kr am" style="color:var(--amber)">${c}가지</span>`:'');
  }else{
    const cnt=k=>{ let t=0; for(let a=1;a<=6;a++){ const b=S.sel-k-a; if(b>=1&&b<=6) t++; } return t; };
    S.gtop.innerHTML=`<span class="m" style="margin-right:4px">${Xv}${SB(3)} =</span>`+
      [1,2,3,4,5,6].map(k=>`<button class="l3 m${k===L?' on':''}" data-l="${k}">${k}<b class="${S.sel!=null&&cnt(k)?'on':''}">${S.sel!=null?cnt(k):''}</b></button>`).join('');
  }
  let h=`<tr><th class="diag"><i class="dx">${Xv}${SB(1)}</i><i class="dn">${Xv}${SB(2)}</i></th>`+
    [1,2,3,4,5,6].map(b=>`<th>${b}</th>`).join('')+'</tr>';
  for(let a=1;a<=6;a++){
    h+=`<tr><th>${a}</th>`;
    for(let b=1;b<=6;b++){ const s=a+b+L; h+=`<td data-s="${s}" class="m${s===S.sel?' hit':''}">${fr(s,n)}</td>`; }
    h+='</tr>';
  }
  S.gt.innerHTML=h;
}

/* ③ X₃마다 개수 세기 : 각 줄 = ②의 경우의 수 1,2,3,4,5,6,5,4,3,2,1 을 한 칸씩 민 것 */
const C2=s=>(s>=2&&s<=12)?6-Math.abs(s-7):0;
function paintCount(S){
  const rows=D[3].rows, cs=s=>s===S.sel?' sel':'';
  S.sec.querySelector('[data-a="sum"]').classList.toggle('on',S.sumOn);
  let h=`<colgroup><col style="width:132px">${rows.map(()=>'<col>').join('')}</colgroup>`;
  h+=`<tr><th class="m" style="cursor:default">${xb}</th>`+rows.map(o=>`<th class="m${cs(o.s)}" data-s="${o.s}">${fr(o.s,3)}</th>`).join('')+'</tr>';
  for(let k=1;k<=6;k++){
    const on=S.rows[k], cur=k===S.layer;
    h+=`<tr><th class="m rk${on?' fill':''}${cur?' cur':''}" data-k="${k}">${Xv}${SB(3)} = ${k}</th>`+
      rows.map(o=>{ const c=C2(o.s-k); return `<td class="m${on&&c?' nz':''}${cur?' cur':''}${cs(o.s)}" data-s="${o.s}">${on&&c?c:''}</td>`; }).join('')+'</tr>';
  }
  h+=`<tr class="srow"><th class="${S.sumOn?'':'rk'}" data-k="0">경우의 수</th>`+
    rows.map(o=>`<td class="m${cs(o.s)}" data-s="${o.s}">${S.sumOn?o.c:''}</td>`).join('')+'</tr>';
  S.cn.innerHTML=h;
}

/* 확률분포표 + 계산 줄 */
function paintTable(S){
  const n=S.n, d=D[n], g=n*d.N, g2=n*n*d.N, R=RV(n), r=rv(n);
  const fs=n===1?34:n===2?29:27;
  const lw=n===1?200:n===2?176:160, sw=n===1?150:n===2?132:110;
  const cs=s=>s===S.sel?' sel':'';
  let h=`<colgroup><col style="width:${lw}px">${d.rows.map(()=>'<col>').join('')}<col style="width:${sw}px"></colgroup>`;
  h+=`<tr style="font-size:${fs}px"><th class="m">${R}</th>`+d.rows.map(o=>`<th class="m${cs(o.s)}" data-s="${o.s}">${fr(o.s,n)}</th>`).join('')+`<th style="font-family:var(--f-kr);font-size:${fs-3}px">합계</th></tr>`;
  const pOn=n<3||S.sumOn;
  h+=`<tr style="font-size:${fs}px" class="${pOn?'':'off'}"><th class="m rl${pOn?'':' rlb'}" data-k="p">P${BP(`${R} = ${r}`)}</th>`+d.rows.map(o=>`<td class="m${cs(o.s)}" data-s="${o.s}"><span>${F(o.c,d.N)}</span></td>`).join('')+`<td class="m sum"><span>1</span></td></tr>`;
  const row=(k,lab,f,sum)=>`<tr style="font-size:${fs}px" class="${S.f[k]?'':'off'}"><th class="m rl${S.f[k]?'':' rlb'}" data-k="${k}">${lab}</th>`+
    d.rows.map(o=>`<td class="m${cs(o.s)}" data-s="${o.s}"><span>${f(o)}</span></td>`).join('')+`<td class="m sum"><span>${sum}</span></td></tr>`;
  h+=row(0,`${r}P`,o=>n===1?F(o.s,d.N):F(o.s*o.c,g),fr(d.SX,g));
  h+=row(1,`${r}${EX(2)}P`,o=>n===1?F(o.s*o.s,d.N):F(o.s*o.s*o.c,g2),fr(d.SX2,g2));
  S.tb.innerHTML=h;
}
function paint(S){
  S.steps.querySelectorAll('.tg').forEach(b=>b.classList.toggle('on',S.f[+b.dataset.k]));
  S.fls.querySelectorAll('[data-k]').forEach(l=>l.classList.toggle('hide',!S.f[+l.dataset.k]));
  if(S.n===3){ S.sec.classList.toggle('pA',S.phase==='A'); paintCount(S); }
  paintGrid(S); paintTable(S); drawBars(S);
  const n=S.n, d=D[n];
  if(S.sel!=null){
    const o=d.rows.find(r=>r.s===S.sel);
    S.gsel.innerHTML=`P${BP(`${RV(n)} = ${fr(S.sel,n)}`)} = ${F(o.c,d.N)}`;
  }else S.gsel.innerHTML='';
}

/* ═══ 6. 막대그래프 ═══ */
const YT={1:[1],2:[2,4,6],3:[9,18,27]};
function drawBars(S){
  const svg=S.svg, W=svg._w, H=svg._h; if(!W) return;
  const n=S.n, d=D[n];
  const L=104,R=26,Tp=74,B=66,pw=W-L-R,ph=H-Tp-B,base=Tp+ph, x0=.5,x1=6.5;
  S.geo={L,pw,x0,x1};
  const px=v=>L+(v-x0)/(x1-x0)*pw, ymax=d.maxc/d.N*1.14, py=v=>base-v/ymax*ph;
  const AM=COL.am,TE=COL.te,FA=COL.fa,LS=COL.ls,LN=COL.ln,CH=COL.ch;
  const g=[];
  YT[n].forEach(c=>{ const y=py(c/d.N);
    g.push(`<line x1="${L}" y1="${y}" x2="${L+pw}" y2="${y}" stroke="${LN}" stroke-width="1.4" stroke-dasharray="6 6"/>`);
    g.push(sfrac(L-46,y,c,d.N,24,FA,{w:500}));
  });
  const bw=Math.min(pw/(x1-x0)/n*.72,90);
  d.rows.forEach(o=>{
    const x=px(o.s/n), y=py(o.c/d.N), on=o.s===S.sel;
    g.push(`<rect x="${x-bw/2}" y="${y}" width="${bw}" height="${base-y}" fill="${on?AM:TE}" fill-opacity="${on?1:.72}"/>`);
  });
  g.push(`<line x1="${L}" y1="${base}" x2="${L+pw}" y2="${base}" stroke="${LS}" stroke-width="2.5"/>`);
  g.push(`<line x1="${L}" y1="${Tp-10}" x2="${L}" y2="${base}" stroke="${LS}" stroke-width="2"/>`);
  for(let k=1;k<=6;k++){
    g.push(`<line x1="${px(k)}" y1="${base}" x2="${px(k)}" y2="${base+10}" stroke="${LS}" stroke-width="2"/>`);
    g.push(txt(px(k),base+34,k,30,CH));
  }
  if(n>1) d.rows.forEach(o=>{ if(o.s%n) g.push(`<line x1="${px(o.s/n)}" y1="${base}" x2="${px(o.s/n)}" y2="${base+7}" stroke="${LS}" stroke-width="1.5"/>`); });
  /* 평균 7/2 */
  g.push(`<line x1="${px(3.5)}" y1="${Tp-4}" x2="${px(3.5)}" y2="${base}" stroke="${AM}" stroke-width="3" stroke-dasharray="12 8"/>`);
  if(S.sel!=null&&S.sel%n){ g.push(`<line x1="${px(S.sel/n)}" y1="${base}" x2="${px(S.sel/n)}" y2="${base+12}" stroke="${AM}" stroke-width="4"/>`); }
  svg.innerHTML=g.join('')+sfrac(px(3.5),base+38,7,2,22,AM);
}

/* ═══ 7. ④ 정리 ═══ */
const p4=document.createElement('section'); p4.className='pane'; p4.id='p3';
p4.innerHTML=`
  <div class="card law">
    <div class="lawT">표본평균의 평균, 분산, 표준편차 <button class="tg" id="allBtn">모두 보기</button></div>
    <div class="lawB" id="lawB"></div>
  </div>
  <div class="bot">
    <div class="card gcard" id="gc3"><svg id="g3"></svg></div>
    <div class="card ct"><table id="ctab"></table></div>
  </div>`;
main.appendChild(p4);
const BL=[mv,F(sg+EX(2),nv),F(sg,RT(nv))];
const blank=i=>`<span class="blank m" data-b="${i}"><span>${BL[i]}</span></span>`;
const lawB=document.getElementById('lawB'), allBtn=document.getElementById('allBtn');
lawB.innerHTML=
  `<div>모평균이 ${mv}, 모분산이 ${sg}${EX(2)}인 모집단에서 크기가 ${nv}인 표본을 임의추출할 때,</div>`+
  `<div>표본평균 <span class="m">${XB}</span>에 대하여</div>`+
  `<div class="lawF"><span class="m">E(${XB}) = ${blank(0)}</span><span class="m">V(${XB}) = ${blank(1)}</span><span class="m">${sg}(${XB}) = ${blank(2)}</span></div>`;
function syncAll(){ const all=[...lawB.querySelectorAll('.blank')].every(b=>b.classList.contains('open'));
  allBtn.textContent=all?'가리기':'모두 보기'; }
lawB.onclick=e=>{ const b=e.target.closest('.blank'); if(b){ b.classList.toggle('open'); syncAll(); } };
allBtn.onclick=()=>{ const open=allBtn.textContent==='모두 보기';
  lawB.querySelectorAll('.blank').forEach(b=>b.classList.toggle('open',open)); syncAll(); };
document.getElementById('ctab').innerHTML=
  `<tr><th></th><th class="kr">평균</th><th class="kr">분산</th></tr>`+
  `<tr><th class="m" style="color:var(--sky)">${Xv} <span style="font-family:var(--f-kr);font-size:26px">(모집단)</span></th><td class="m">${mv} = ${F(7,2)}</td><td class="m vv">${sg}${EX(2)} = ${F(35,12)}</td></tr>`+
  `<tr><th class="m tl">${XB} &nbsp;(${nv} = 2)</th><td class="m">${F(7,2)}</td><td class="m vv">${F(35,24)} = ${F(sg+EX(2),2)}</td></tr>`+
  `<tr><th class="m" style="color:var(--violet)">${XB} &nbsp;(${nv} = 3)</th><td class="m">${F(7,2)}</td><td class="m vv">${F(35,36)} = ${F(sg+EX(2),3)}</td></tr>`;
const g3=document.getElementById('g3');
fitSvg(g3,()=>draw3());
function draw3(){
  const W=g3._w,H=g3._h; if(!W) return;
  const L=40,R=30,Tp=20,B=58,pw=W-L-R,x0=.5,x1=6.5,px=v=>L+(v-x0)/(x1-x0)*pw;
  const AM=COL.am,LS=COL.ls,CH=COL.ch,FA=COL.fa;
  const ph=(H-Tp-B)/3, cols=[COL.sk,COL.te,COL.vi], sig=Math.sqrt(35/12);
  const IS='<tspan font-style="italic">σ</tspan>';
  const sdl=[IS+' ≈ 1.71',IS+'/√2 ≈ 0.99'.replace('0.99','1.21'),IS+'/√3 ≈ 0.99'];
  const g=[];
  [1,2,3].forEach((n,i)=>{
    const d=D[n], top=Tp+i*ph, base=top+ph-6, ymax=d.maxc/d.N, h=ph-50, bw=Math.min(pw/6/n*.72,60);
    d.rows.forEach(o=>{ const x=px(o.s/n), y=base-o.c/d.N/ymax*h;
      g.push(`<rect x="${x-bw/2}" y="${y}" width="${bw}" height="${base-y}" fill="${cols[i]}" fill-opacity=".8"/>`); });
    g.push(`<line x1="${L}" y1="${base}" x2="${L+pw}" y2="${base}" stroke="${LS}" stroke-width="2"/>`);
    /* 표준편차 화살표 */
    const s=sig/Math.sqrt(n), ay=top+20, a=px(3.5-s), b=px(3.5+s);
    g.push(`<line x1="${a}" y1="${ay}" x2="${b}" y2="${ay}" stroke="${cols[i]}" stroke-width="3"/>`);
    [a,b].forEach(x=>g.push(`<line x1="${x}" y1="${ay-11}" x2="${x}" y2="${ay+11}" stroke="${cols[i]}" stroke-width="3"/>`));
    g.push(`<text x="${b+14}" y="${ay}" dominant-baseline="central" font-family="${SER}" font-size="28" font-weight="600" fill="${cols[i]}" pointer-events="none">${sdl[i]}</text>`);
    g.push(`<text x="${L+4}" y="${top+24}" dominant-baseline="central" font-family="${SER}" font-size="30" font-weight="700" fill="${cols[i]}" pointer-events="none">${n===1?'<tspan font-style="italic">X</tspan>':'<tspan font-style="italic">n</tspan> = '+n}</text>`);
  });
  for(let k=1;k<=6;k++) g.push(txt(px(k),H-B+30,k,28,CH));
  g.push(`<line x1="${px(3.5)}" y1="${Tp}" x2="${px(3.5)}" y2="${H-B}" stroke="${AM}" stroke-width="3" stroke-dasharray="12 8"/>`);
  g.push(sfrac(px(3.5),H-B+32,7,2,22,AM));
  g3.innerHTML=g.join('');
}

/* ═══ 8. 탭 · 키보드 · 전체화면 · 초기화 ═══ */
[1,2,3].forEach((n,i)=>buildPane(n,i));
main.appendChild(p4);
let tab=0;
const tabs=document.querySelectorAll('.tab'), panes=()=>document.querySelectorAll('.pane');
function setTab(t){
  tab=Math.max(0,Math.min(3,t));
  tabs.forEach((b,i)=>b.classList.toggle('on',i===tab));
  panes().forEach(p=>p.classList.toggle('on',p.id==='p'+tab));
}
document.getElementById('tabs').onclick=e=>{ const b=e.target.closest('[data-t]'); if(b) setTab(+b.dataset.t); };
function resetTab(){
  if(tab<3){ const S=T[tab]; S.sel=null; S.layer=1; S.f=[false,false,false]; S.phase='A'; S.rows.fill(0); S.sumOn=false; paint(S); }
  else { lawB.querySelectorAll('.blank').forEach(b=>b.classList.remove('open')); syncAll(); }
}
document.getElementById('resetBtn').onclick=resetTab;
const fsBtn=document.getElementById('fsBtn');
fsBtn.onclick=()=>{
  const d=document, el=d.documentElement;
  if(d.fullscreenElement||d.webkitFullscreenElement) (d.exitFullscreen||d.webkitExitFullscreen).call(d);
  else { const r=el.requestFullscreen||el.webkitRequestFullscreen; if(r) Promise.resolve(r.call(el)).catch(()=>{}); }
};
const syncFs=()=>fsBtn.textContent=(document.fullscreenElement||document.webkitFullscreenElement)?'창으로':'전체화면';
document.addEventListener('fullscreenchange',syncFs); document.addEventListener('webkitfullscreenchange',syncFs);
addEventListener('keydown',e=>{
  const k=e.key;
  if(k>='1'&&k<='4') setTab(+k-1);
  else if(k==='ArrowRight') setTab(tab+1);
  else if(k==='ArrowLeft') setTab(tab-1);
  else if(k==='f'||k==='F') fsBtn.click();
  else if(k==='r'||k==='R') resetTab();
  else if(k===' '){ e.preventDefault();
    if(tab<3){ const S=T[tab];
      if(S.n===3&&S.phase==='A'){
        const nx=[1,2,3,4,5,6].find(k=>!S.rows[k]);
        if(!S.rows[S.layer]) S.rows[S.layer]=1;
        else if(nx) S.layer=nx;
        else if(!S.sumOn) S.sumOn=true;
        else S.phase='B';
        paint(S); }
      else { const m=S.n===1?2:3, i=S.f.slice(0,m).indexOf(false); if(i>=0){ S.f[i]=true; paint(S); } } }
    else { const b=[...lawB.querySelectorAll('.blank:not(.open)')][0]; if(b){ b.classList.add('open'); syncAll(); } } }
  else if((k==='ArrowUp'||k==='ArrowDown')&&tab<3){
    e.preventDefault(); const S=T[tab], n=S.n;
    if(S.sel==null) S.sel=k==='ArrowUp'?n:6*n; else S.sel=Math.max(n,Math.min(6*n,S.sel+(k==='ArrowUp'?1:-1)));
    paint(S);
  }
});

/* ═══ 시작 ═══ */
Object.assign(COL,{am:CSS('--amber'),te:CSS('--teal'),vi:CSS('--violet'),co:CSS('--coral'),ch:CSS('--chalk'),sk:CSS('--sky'),
  fa:CSS('--chalk-faint'),ls:CSS('--line-strong'),ln:CSS('--line'),p2:CSS('--panel-2'),bg:CSS('--bg')});
T.forEach(paint);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ T.forEach(paint); draw3(); });
</script>
</body>
