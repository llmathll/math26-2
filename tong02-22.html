<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>사차함수 f(x)와 g(t)의 불연속</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400..700;1,400..700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============ 색 토큰 ============ */
:root{
  --bg-deep:#0a1420; --bg:#0e1b2b; --panel:#16283e; --panel-2:#1d3350;
  --line:rgba(214,229,245,.18); --line-strong:rgba(214,229,245,.38);
  --chalk:#eaf1f8; --chalk-soft:#b9cadd; --chalk-faint:#7d94ad;
  --amber:#f5b642; --coral:#ff7d6a; --teal:#49d1c0; --violet:#9d8cf5;
  --laser:#ff2d2d;
  /* STIX 로드 실패해도 항상 세리프로 떨어지도록 Times 를 체인에 포함 */
  --f-en:'STIX Two Text','Times New Roman',Georgia;
  --f-kr:'Noto Sans KR';
  --f-math:'STIX Two Text','Times New Roman',Georgia,'Noto Sans KR',sans-serif;
  --ls:31px; --ls-sm:25px; --ls-q:23px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg-deep)}
body{font-family:var(--f-math);color:var(--chalk);
  -webkit-user-select:none;user-select:none;touch-action:manipulation;word-break:keep-all}

.viewport{position:fixed;inset:0;overflow:hidden;
  background:radial-gradient(1300px 800px at 20% 4%, #17273c 0%, var(--bg) 60%)}
.stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0}
.sheet{width:100%;height:100%;padding:12px 26px 12px;display:flex;flex-direction:column;gap:10px}
.topline{flex:0 0 2px;background:linear-gradient(90deg,var(--amber),rgba(245,182,66,0) 62%);border-radius:2px}

/* ============ 조판 ============ */
.m{font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.15;display:inline-block}
.v{font-style:italic;font-family:var(--f-en),'Noto Sans KR',sans-serif;font-weight:inherit}
.v.fn{margin-right:.09em}
.frac{display:inline-flex;flex-direction:column;align-items:stretch;text-align:center;
  vertical-align:middle;margin:0 .22em;transform:translateY(-.10em);line-height:1.06;font-size:.86em}
.frac>.num{padding:0 .22em .07em;border-bottom:.058em solid currentColor}
.frac>.den{padding:.09em .22em 0}
.lim{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;
  line-height:1.02;margin:0 .12em;transform:translateY(.14em)}
.lim>.lb{font-size:.46em;color:var(--chalk-soft);margin-top:.05em;white-space:nowrap}
sup{font-size:.62em;vertical-align:super;line-height:0}

/* ============ 본문 2단 ============ */
#body2col{flex:1 1 auto;display:flex;gap:16px;min-height:0}
#leftCol{flex:1 1 auto;display:flex;flex-direction:column;gap:10px;min-width:0}
#rightCol{flex:0 0 760px;display:flex;flex-direction:column;gap:8px;min-height:0}

.panel{background:linear-gradient(180deg,var(--panel) 0%,#0f1e30 100%);
  border:1.5px solid var(--line);border-radius:15px;position:relative}
.panel>.tag{position:absolute;left:15px;top:9px;font-size:21px;font-weight:700;
  color:var(--chalk-faint);z-index:2;pointer-events:none}
.p-graph>.tag{left:auto;right:16px;top:7px;font-size:23px;color:var(--chalk-soft);
  background:rgba(10,20,32,.78);padding:3px 10px;border-radius:9px}

/* ---- 조건 고정 박스 (접기/펼치기) ---- */
.condbox{flex:0 0 auto;background:linear-gradient(180deg,#17293f,#101f31);
  border:2px solid var(--line-strong);border-radius:15px;padding:9px 16px 11px;
  display:flex;flex-direction:column;gap:6px;position:relative}
.foldbtn{position:absolute;right:10px;top:8px;font-family:var(--f-kr),sans-serif;font-size:19px;font-weight:700;
  color:var(--chalk-soft);background:var(--panel-2);border:1.5px solid var(--line);
  border-radius:9px;padding:3px 12px;cursor:pointer;z-index:3}
.foldbtn:hover{background:#27436f;color:var(--chalk)}
.qtext{font-size:var(--ls-q);line-height:1.42;color:var(--chalk-soft);font-family:var(--f-math)}
.qtext .ql{padding-right:118px}
.qtext .ql+.ql{padding-right:0;margin-top:2px}
.crow{display:flex;align-items:center;gap:13px;font-size:29px;line-height:1.2;font-family:var(--f-math)}
.ctag{flex:0 0 auto;font-size:25px;font-weight:700;color:var(--bg);background:var(--teal);
  border-radius:8px;padding:2px 11px;font-family:var(--f-kr),sans-serif}
.goal{margin-left:auto;font-size:25px;font-weight:700;color:var(--amber);white-space:nowrap;padding-right:0}
.condbox.fold .qtext{display:none}
.condbox.fold .goal{padding-right:124px}

/* ---- 단계 스크롤 ---- */
#steps{flex:1 1 auto;overflow-y:auto;position:relative;
  padding:2px 8px 400px 2px;scrollbar-width:none}
#steps::-webkit-scrollbar{width:0;height:0}
.stepCard{border:2px solid var(--line);border-radius:15px;background:#12233a;
  padding:11px 17px 13px;margin-bottom:12px;opacity:.15;filter:blur(3px);
  transition:opacity .35s,filter .35s,border-color .35s,box-shadow .35s}
.stepCard.on{opacity:1;filter:none}
.stepCard.live{opacity:1;filter:none;border-color:var(--amber);
  box-shadow:0 0 0 1px rgba(245,182,66,.35),0 8px 30px rgba(245,182,66,.14)}
.sc-h{display:flex;align-items:center;gap:12px;margin-bottom:7px}
.sc-n{flex:0 0 auto;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;
  font-size:23px;font-weight:700;background:var(--panel-2);color:var(--chalk-soft);border:2px solid var(--line)}
.stepCard.live .sc-n{background:var(--amber);color:#231a06;border-color:var(--amber)}
.sc-t{font-size:28px;font-weight:700;color:var(--amber);letter-spacing:-.3px;line-height:1.25;font-family:var(--f-math)}
.stepCard:not(.live) .sc-t{color:var(--chalk)}
.sc-b{font-size:var(--ls-sm);line-height:1.5;font-family:var(--f-math)}
.sc-b p{margin:0 0 6px}
/* 수식 줄은 반드시 블록 — .m 과 겹쳐도 인라인이 되지 않게 */
.eq{display:block;font-family:var(--f-math);font-size:var(--ls);margin:8px 0;line-height:1.4;
  white-space:nowrap;font-variant-numeric:tabular-nums}
.eq.ind{padding-left:1.5em}
.eq.sm{font-size:26px}
.dim{color:var(--chalk-soft)}
.bad{color:var(--coral);font-weight:700}
.ok{color:var(--teal);font-weight:700}
.am{color:var(--amber);font-weight:700}
.vio{color:var(--violet);font-weight:700}
.box{background:#0c1a2b;border:2px solid var(--teal);border-radius:12px;padding:7px 14px;margin:8px 0}
.box.amberb{border-color:var(--amber)}
.recall{background:#0b1727;border:1.5px dashed var(--chalk-faint);border-radius:11px;
  padding:4px 14px 6px;margin:0 0 8px;display:flex;align-items:baseline;gap:12px;white-space:nowrap}
.recall .rl{flex:0 0 auto;font-size:19px;color:var(--chalk-faint);font-weight:700;font-family:var(--f-kr),sans-serif}
.recall .eq{margin:0;font-size:26px;color:var(--chalk-soft)}
.result{background:linear-gradient(90deg,rgba(245,182,66,.22),rgba(245,182,66,.04));
  border-left:6px solid var(--amber);border-radius:9px;padding:7px 15px;margin:8px 0;
  font-size:30px;font-weight:700;font-family:var(--f-math)}
.hint{margin-top:7px;font-size:24px;color:var(--teal);font-weight:600;font-family:var(--f-math)}
.hint::before{content:"▸ "}
ul.tight{margin:5px 0 5px 2px;padding-left:24px}
ul.tight li{margin:4px 0}
.locked{opacity:0;transform:translateY(8px);transition:opacity .4s,transform .4s}
.locked.show{opacity:1;transform:none}

/* ---- 그래프 ---- */
.p-graph{flex:1 1 auto;min-height:0;display:flex;overflow:hidden}
.p-graph svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.p-graph svg:active{cursor:grabbing}
.botrow{flex:0 0 250px;display:flex;gap:8px;min-height:0}
.p-gt{flex:1 1 auto;display:flex;overflow:hidden;min-width:0}
.p-gt svg{width:100%;height:100%;display:block}

/* ---- t 조작 패널 ---- */
.p-ctrl{flex:0 0 292px;display:flex;flex-direction:column;justify-content:center;
  gap:11px;padding:12px 14px}
.tval{font-family:var(--f-math);font-size:36px;font-weight:700;color:var(--amber);
  font-variant-numeric:tabular-nums;text-align:center;line-height:1}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;border-radius:10px;
  background:linear-gradient(90deg,#22365a,#2e4a78);outline:none;border:1px solid var(--line);touch-action:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:44px;height:44px;border-radius:50%;
  background:var(--amber);border:5px solid #2a2110;box-shadow:0 3px 12px rgba(0,0,0,.55)}
input[type=range]::-moz-range-thumb{width:40px;height:40px;border-radius:50%;background:var(--amber);border:5px solid #2a2110}
.crow2{display:flex;align-items:center;gap:8px;justify-content:center}
.clab{font-family:var(--f-kr),sans-serif;font-size:19px;color:var(--chalk-faint);font-weight:700}
.chip{font-family:var(--f-math);font-size:23px;font-weight:700;color:var(--chalk);
  background:var(--panel-2);border:1.5px solid var(--line);border-radius:10px;padding:6px 13px;cursor:pointer}
.chip.k{font-family:var(--f-kr),sans-serif;font-size:20px}
.chip:hover{background:#27436f;border-color:var(--teal)}
.chip.on{background:var(--teal);color:#06251f;border-color:var(--teal)}

/* ---- 발판 ---- */
.app-foot{flex:0 0 60px;display:flex;align-items:center;gap:16px}
.ftitle{display:flex;align-items:center;gap:12px;min-width:0}
.fno{font-family:var(--f-math);font-size:24px;font-weight:700;color:var(--bg);background:var(--amber);border-radius:9px;padding:2px 12px}
.fttl{font-family:var(--f-kr),sans-serif;font-size:25px;font-weight:700;letter-spacing:-.3px;white-space:nowrap}
.dots{display:flex;gap:9px;margin:0 auto}
.dots i{width:14px;height:14px;border-radius:50%;background:#2b4468;display:block;cursor:pointer;transition:all .25s}
.dots i.on{background:var(--amber);width:38px;border-radius:7px}
.btn{font-family:var(--f-kr),sans-serif;font-size:24px;font-weight:700;color:var(--chalk);
  background:var(--panel-2);border:1.5px solid var(--line);border-radius:11px;padding:9px 19px;cursor:pointer}
.btn:hover{background:#27436f}
.btn.primary{background:var(--amber);color:#231a06;border-color:var(--amber)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.3;cursor:default}
.btn.mini{padding:9px 13px;font-size:22px}
.btn.mini.on{background:var(--laser);border-color:var(--laser);color:#fff}

/* ---- 레이저 ---- */
#laser{position:fixed;inset:0;pointer-events:none;z-index:9999;display:none}
body.laser-on #laser{display:block}
body.laser-on.has-mouse{cursor:none}
body.laser-on.has-mouse *{cursor:none !important}
.ldot{position:absolute;left:0;top:0;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;
  background:radial-gradient(circle,#fff 0%,var(--laser) 42%,rgba(255,45,45,0) 72%);
  box-shadow:0 0 22px 8px rgba(255,45,45,.55)}
.ltail{position:absolute;left:0;top:0;border-radius:50%;background:var(--laser)}
.lring{position:absolute;left:0;top:0;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;border:3px solid var(--laser)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
</style>
</head>
<body class="laser-on">

<div class="viewport">
<div class="stage" id="stage">
 <div class="sheet">
  <div class="topline"></div>

  <div id="body2col">

   <!-- ============ 좌 ============ -->
   <div id="leftCol">
     <div class="condbox" id="condbox">
       <button class="foldbtn" id="foldBtn">문제 ▲</button>
       <div class="qtext"><div class="ql"><span class="v">x</span> ≥ −1에서 정의된 사차함수 <span class="v fn">f</span>(<span class="v">x</span>)에 대하여, 방정식 <span class="v fn">f</span>(<span class="v">x</span>) = <span class="v">tx</span> + <span class="v">t</span> 가 실근을 가질 <span class="v">t</span>의 최댓값이 5.</div><div class="ql"><span class="v">t</span> ≤ 5인 <span class="v">t</span>에 대하여 <span class="v fn">g</span>(<span class="v">t</span>)는 방정식을 만족시키는 <span class="v">x</span>의 최솟값.</div></div>
       <div class="crow">
         <span class="ctag">가</span>
         <span class="m"><span class="v fn">g</span>(1) = 0,&nbsp; <span class="v fn">g</span>(5) = 2</span>
         <span class="goal">구하는 값 &nbsp;|<span class="v fn">f</span>(3)|</span>
       </div>
       <div class="crow">
         <span class="ctag">나</span>
         <span class="m"><span class="lim">lim<span class="lb"><span class="v">t</span>→1+</span></span><span class="v fn">g</span>(<span class="v">t</span>) − <span class="lim">lim<span class="lb"><span class="v">t</span>→1−</span></span><span class="v fn">g</span>(<span class="v">t</span>) = 1</span>
       </div>
     </div>
     <div id="steps"></div>
   </div>

   <!-- ============ 우 ============ -->
   <div id="rightCol">
     <div class="panel p-graph"><span class="tag"><span class="v">y</span> = <span class="v fn">f</span>(<span class="v">x</span>) 와 직선 <span class="v">y</span> = <span class="v">tx</span> + <span class="v">t</span></span>
       <svg id="gv" viewBox="0 0 760 536" preserveAspectRatio="xMidYMid meet"></svg>
     </div>
     <div class="botrow">
       <div class="panel p-gt"><span class="tag"><span class="v">y</span> = <span class="v fn">g</span>(<span class="v">t</span>)</span>
         <svg id="gt" viewBox="0 0 460 250" preserveAspectRatio="xMidYMid meet"></svg>
       </div>
       <div class="panel p-ctrl">
         <div class="tval"><span class="v">t</span> = <span id="tv">1.00</span></div>
         <input type="range" id="sl" min="-4" max="6.4" step="0.005" value="-2">
         <div class="crow2">
           <button class="chip" data-t="1"><span class="v">t</span>=1</button>
           <button class="chip" data-t="5"><span class="v">t</span>=5</button>
           <button class="chip k" id="auto">▶ 회전</button>
         </div>
         <div class="crow2">
           <span class="clab">미세</span>
           <button class="chip" id="tm">−</button>
           <button class="chip" id="tp">+</button>
           <button class="chip k" id="jump">점프 재생</button>
         </div>
       </div>
     </div>
   </div>

  </div>

  <!-- ============ 발판 ============ -->
  <div class="app-foot">
    <div class="ftitle">
      <span class="fno">22</span>
      <span class="fttl">사차함수 <span class="v fn">f</span>(<span class="v">x</span>)와 <span class="v fn">g</span>(<span class="v">t</span>)의 불연속</span>
    </div>
    <div class="dots" id="dots"></div>
    <button class="btn mini on" id="laserBtn" title="레이저 (L)">레이저</button>
    <button class="btn mini" id="fsBtn" title="전체화면 (F)">⛶</button>
    <button class="btn mini" id="rsBtn" title="처음부터 (R)">↺</button>
    <button class="btn" id="prev">← 이전</button>
    <button class="btn primary" id="next">다음 →</button>
  </div>

 </div>
</div>
</div>

<div id="laser">
  <div class="ltail" id="lt0"></div><div class="ltail" id="lt1"></div><div class="ltail" id="lt2"></div>
  <div class="ltail" id="lt3"></div><div class="ltail" id="lt4"></div>
  <div class="ldot" id="ldot"></div>
</div>

<script>
/* ================= 스케일링 ================= */
const STAGE_W=1600, STAGE_H=900, stage=document.getElementById('stage');
function fitStage(){
  const vv=window.visualViewport;
  const w=vv?vv.width:innerWidth, h=vv?vv.height:innerHeight;
  const s=Math.min(w/STAGE_W,h/STAGE_H);
  stage.style.transform=`translate(${Math.round((w-STAGE_W*s)/2)}px,${Math.round((h-STAGE_H*s)/2)}px) scale(${s})`;
}
['resize','orientationchange','pageshow'].forEach(e=>addEventListener(e,fitStage));
if(window.visualViewport){visualViewport.addEventListener('resize',fitStage);visualViewport.addEventListener('scroll',fitStage);}
fitStage();[0,60,300,700,1500].forEach(t=>setTimeout(fitStage,t));

/* ================= 수학 ================= */
const fmt=v=>v.toFixed(2).replace('-','\u2212');
const F=x=>((((-5*x+18)*x-13)*x+1)*x+1);
const H=x=>F(x)/(x+1);
const XM=(2*Math.sqrt(61)-7)/15, XR=3.8, EPS=1e-9;
const ALPHA=13/5;
const BR=[[-1+EPS,0],[0,XM],[XM,2],[2,XR]];
function solveBranch(b,t){
  let a=b[0],c=b[1],ha=H(a)-t,hc=H(c)-t;
  if(ha===0)return a; if(hc===0)return c; if(ha*hc>0)return null;
  for(let i=0;i<70;i++){const m=(a+c)/2,hm=H(m)-t; if(ha*hm<=0){c=m;hc=hm;}else{a=m;ha=hm;}}
  return (a+c)/2;
}
function allRoots(t){
  const r=[];
  for(const b of BR){const x=solveBranch(b,t); if(x!==null&&!r.some(u=>Math.abs(u-x)<1e-6))r.push(x);}
  return r.sort((p,q)=>p-q);
}
function gmin(t){ if(t>5+1e-9)return null; return t<=1?solveBranch(BR[0],t):solveBranch(BR[2],t); }

/* ================= 상태 ================= */
let t=-2, step=0, zoomT=0, autoId=null, jumpId=null;
const visited=new Array(240).fill(false);
let sweepDone=false;
const TMIN=-4,TMAX=6.4;
const WIDE={x0:-1.12,x1:2.95,y0:-11.5,y1:19.5};
const ZOOM={x0:-1.10,x1:2.92,y0:-5.5,y1:16.5};   // ⑤ : x=α 까지 보이는 완만한 확대
let win=Object.assign({},WIDE);

/* ================= f(x) 그래프 ================= */
const GL=64,GR=740,GT=28,GB=470;
const px=x=>GL+(x-win.x0)/(win.x1-win.x0)*(GR-GL);
const py=y=>GB-(y-win.y0)/(win.y1-win.y0)*(GB-GT);
function clipPoly(pts){
  const out=[];let cur=[];
  const inY=p=>p[1]>=win.y0&&p[1]<=win.y1;
  const cross=(a,b,yb)=>{const s=(yb-a[1])/(b[1]-a[1]);return [a[0]+s*(b[0]-a[0]),yb];};
  for(let i=0;i<pts.length;i++){
    const p=pts[i], ins=inY(p);
    if(ins){ if(i>0&&!inY(pts[i-1])){const q=pts[i-1];cur.push(cross(q,p,q[1]<win.y0?win.y0:win.y1));} cur.push(p); }
    else { if(i>0&&inY(pts[i-1])){const q=pts[i-1];cur.push(cross(q,p,p[1]<win.y0?win.y0:win.y1));} if(cur.length>1)out.push(cur); cur=[]; }
  }
  if(cur.length>1)out.push(cur);
  return out;
}
const toPath=segs=>segs.map(s=>'M'+s.map(p=>px(p[0]).toFixed(1)+' '+py(p[1]).toFixed(1)).join(' L ')).join(' ');
const gv=document.getElementById('gv');
function drawGraph(){
  let s='';
  for(let gx=Math.ceil(win.x0);gx<=win.x1;gx++)
    s+=`<line x1="${px(gx)}" y1="${GT}" x2="${px(gx)}" y2="${GB}" stroke="#1e3350" stroke-width="1.2"/>`;
  const dy=(win.y1-win.y0)>10?5:2;
  for(let gy=Math.ceil(win.y0/dy)*dy;gy<=win.y1;gy+=dy)
    s+=`<line x1="${GL}" y1="${py(gy)}" x2="${GR}" y2="${py(gy)}" stroke="#1e3350" stroke-width="1.2"/>`;
  if(win.y0<0&&win.y1>0)s+=`<line x1="${GL}" y1="${py(0)}" x2="${GR}" y2="${py(0)}" stroke="#7d94ad" stroke-width="2.4"/>`;
  if(win.x0<0&&win.x1>0)s+=`<line x1="${px(0)}" y1="${GT}" x2="${px(0)}" y2="${GB}" stroke="#7d94ad" stroke-width="2.4"/>`;
  for(let gx=Math.ceil(win.x0);gx<=win.x1;gx++){ if(gx===0||gx===-1)continue;
    s+=`<text x="${px(gx)}" y="${Math.min(GB-6,py(0)+30)}" fill="#9db0cf" font-size="24" text-anchor="middle" font-style="italic" font-family="STIX Two Text, Times New Roman, serif">${String(gx).replace('-','\u2212')}</text>`;}

  s+=`<line x1="${px(-1)}" y1="${GT}" x2="${px(-1)}" y2="${GB}" stroke="#ff7d6a" stroke-width="2.4" stroke-dasharray="8 7" opacity=".75"/>`;
  s+=`<text x="${px(-1)+9}" y="${GT+24}" fill="#ff7d6a" font-size="23" font-weight="700"><tspan font-style="italic">x</tspan> ≥ −1</text>`;

  if(step===0){
    for(const k of [-3,-1.5,0,1.5,3,4.5,6]){
      const pts=[];for(let i=0;i<=60;i++){const x=win.x0+(win.x1-win.x0)*i/60;pts.push([x,k*(x+1)]);}
      s+=`<path d="${toPath(clipPoly(pts))}" fill="none" stroke="#49d1c0" stroke-width="2.2" opacity=".30"/>`;
    }
  }
  const pinned=[];
  if(step>=3)pinned.push([5,'#ff7d6a']);
  if(step>=4)pinned.push([1,'#49d1c0']);
  for(const [k,c] of pinned){
    const pts=[];for(let i=0;i<=80;i++){const x=win.x0+(win.x1-win.x0)*i/80;pts.push([x,k*(x+1)]);}
    s+=`<path d="${toPath(clipPoly(pts))}" fill="none" stroke="${c}" stroke-width="3.2" opacity=".55" stroke-dasharray="11 8"/>`;
  }
  const cp=[];for(let i=0;i<=1000;i++){const x=-1+(Math.min(win.x1,XR)+1)*i/1000;cp.push([x,F(x)]);}
  s+=`<path d="${toPath(clipPoly(cp))}" fill="none" stroke="#eaf1f8" stroke-width="5" stroke-linecap="round"/>`;

  const lp=[];for(let i=0;i<=80;i++){const x=-1+(win.x1+1)*i/80;lp.push([x,t*(x+1)]);}
  s+=`<path d="${toPath(clipPoly(lp))}" fill="none" stroke="#f5b642" stroke-width="4"/>`;

  s+=`<circle cx="${px(-1)}" cy="${py(0)}" r="11" fill="#0e1b2b" stroke="#49d1c0" stroke-width="4.5"/>`;
  s+=`<text x="${px(-1)+14}" y="${py(0)-16}" fill="#49d1c0" font-size="25" font-weight="700">(−1, 0)</text>`;

  const rts=allRoots(t), gm=gmin(t);
  rts.forEach(x=>{ const Y=F(x); if(Y<win.y0||Y>win.y1)return;
    const isMin=(gm!==null&&Math.abs(x-gm)<1e-6);
    const merge=(step===4&&!isMin&&x<XM+1e-6&&t<=1.0001);
    s+=`<circle cx="${px(x)}" cy="${py(Y)}" r="${isMin?13:8}" fill="${isMin?'#f5b642':(merge?'#ff7d6a':'#b9cadd')}" stroke="#0e1b2b" stroke-width="${isMin?3:2.2}"/>`;
  });

  /* ⑤ 이후 : x = α 교점 강조 */
  if(step>=4 && Math.abs(t-1)<0.02){
    const Ya=F(ALPHA);
    if(Ya>=win.y0&&Ya<=win.y1){
      s+=`<circle cx="${px(ALPHA)}" cy="${py(Ya)}" r="13" fill="none" stroke="#9d8cf5" stroke-width="4.5"/>`;
      const lb = (step>=5) ? '<tspan font-style="italic">α</tspan> = 13/5' : '<tspan font-style="italic">x</tspan> = <tspan font-style="italic">α</tspan>';
      s+=`<text x="${px(ALPHA)+17}" y="${py(Ya)+9}" fill="#9d8cf5" font-size="26" font-weight="700">${lb}</text>`;
    }
  }

  /* 하단 상태 라벨 — 그래프를 가리지 않도록 항상 플롯 밖 아래쪽에 */
  const cx=(GL+GR)/2;
  if(gm!==null){
    if(F(gm)>=win.y0&&F(gm)<=win.y1){
      s+=`<line x1="${px(gm)}" y1="${py(F(gm))}" x2="${px(gm)}" y2="${GB}" stroke="#f5b642" stroke-width="2.2" stroke-dasharray="6 6" opacity=".8"/>`;
    }
    const lx=Math.max(GL+100,Math.min(GR-100,px(gm)));
    s+=`<text x="${lx}" y="${GB+48}" fill="#f5b642" font-size="33" font-weight="700" text-anchor="middle"><tspan font-style="italic">g</tspan>(<tspan font-style="italic">t</tspan>) = ${fmt(gm)}</text>`;
  }else{
    s+=`<text x="${cx}" y="${GB+48}" fill="#ff7d6a" font-size="31" font-weight="700" text-anchor="middle">교점 없음 — 실근이 존재하지 않는다</text>`;
  }

  if(step===1){
    s+=`<path d="M ${px(-1)} ${py(0)} L ${px(-1)} ${GB-8}" stroke="#ff7d6a" stroke-width="3.4"/>`;
    s+=`<text x="${px(-1)+16}" y="${GB-14}" fill="#ff7d6a" font-size="26" font-weight="700"><tspan font-style="italic">f</tspan>(−1) &lt; 0</text>`;
  }
  if(step>=3){ const X=2,Y=15; if(Y<=win.y1&&Y>=win.y0){
    s+=`<circle cx="${px(X)}" cy="${py(Y)}" r="14" fill="none" stroke="#ff7d6a" stroke-width="4.5"/>`;
    s+=`<text x="${px(X)-18}" y="${py(Y)-16}" fill="#ff7d6a" font-size="25" font-weight="700" text-anchor="end">접점 (2, 15)</text>`;
    s+=`<text x="${px(X)-18}" y="${py(Y)+12}" fill="#ff7d6a" font-size="25" font-weight="700" text-anchor="end">기울기 5</text>`;}}
  if(step>=4){ [[0,1,'접점 (0, 1)'],[1,2,'(1, 2)']].forEach(([X,Y,lb])=>{
    if(Y<=win.y1&&Y>=win.y0){
      s+=`<circle cx="${px(X)}" cy="${py(Y)}" r="13" fill="none" stroke="#49d1c0" stroke-width="4.5"/>`;
      s+=`<text x="${px(X)+16}" y="${py(Y)-18}" fill="#49d1c0" font-size="25" font-weight="700">${lb}</text>`;}});}
  gv.innerHTML=s;
}

/* ================= g(t) 그래프 ================= */
const gtsvg=document.getElementById('gt');
const HL=50,HR=440,HT=52,HB=206;
const GY0=-1.0, GY1=2.75;
const qx=v=>HL+(v-TMIN)/(TMAX-TMIN)*(HR-HL);
const qy=v=>HB-(v-GY0)/(GY1-GY0)*(HB-HT);
const BK=visited.length;
const bkOf=v=>Math.max(0,Math.min(BK-1,Math.floor((v-TMIN)/(TMAX-TMIN)*BK)));
function drawGT(){
  let s='';
  const y0=qy(0);
  s+=`<line x1="${HL}" y1="${y0}" x2="${HR}" y2="${y0}" stroke="#7d94ad" stroke-width="2.2"/>`;
  s+=`<line x1="${qx(0)}" y1="${HT}" x2="${qx(0)}" y2="${HB}" stroke="#7d94ad" stroke-width="2.2"/>`;
  /* 눈금 숫자를 축 '위'에 두어 곡선과 겹치지 않게 */
  for(const k of [-4,-2,2,4,6]){
    s+=`<line x1="${qx(k)}" y1="${y0-5}" x2="${qx(k)}" y2="${y0+5}" stroke="#7d94ad" stroke-width="2"/>`;
    s+=`<text x="${qx(k)}" y="${y0-11}" fill="#9db0cf" font-size="20" text-anchor="middle">${String(k).replace('-','\u2212')}</text>`;
  }
  for(const k of [1,2]) s+=`<text x="${qx(0)-11}" y="${qy(k)+7}" fill="#9db0cf" font-size="20" text-anchor="end">${k}</text>`;
  s+=`<text x="${HR-2}" y="${y0+26}" fill="#9db0cf" font-size="23" text-anchor="end" font-style="italic">t</text>`;
  s+=`<line x1="${qx(5)}" y1="${HT}" x2="${qx(5)}" y2="${HB}" stroke="#ff7d6a" stroke-width="2.2" stroke-dasharray="7 7" opacity=".6"/>`;
  s+=`<text x="${qx(5)+6}" y="${HT+16}" fill="#ff7d6a" font-size="20" font-weight="700"><tspan font-style="italic">t</tspan>=5</text>`;

  const showAll=(step>=3)||sweepDone;
  const pts=[];
  for(let i=0;i<BK;i++){
    const tv=TMIN+(TMAX-TMIN)*(i+.5)/BK;
    if(tv>5.0001){pts.push(null);continue;}
    if(!showAll&&!visited[i]){pts.push(null);continue;}
    pts.push([tv,gmin(tv),tv>1]);
  }
  let cur=[],side=null;
  const flush=()=>{ if(cur.length>1)s+=`<path d="M${cur.map(p=>qx(p[0]).toFixed(1)+' '+qy(p[1]).toFixed(1)).join(' L ')}" fill="none" stroke="#f5b642" stroke-width="4.4" stroke-linecap="round"/>`; cur=[];};
  for(const p of pts){
    if(!p||p[1]===null){flush();side=null;continue;}
    if(side!==null&&p[2]!==side)flush();
    side=p[2];cur.push(p);
  }
  flush();
  if(showAll){
    s+=`<circle cx="${qx(1)}" cy="${qy(0)}" r="8" fill="#f5b642"/>`;
    s+=`<circle cx="${qx(1)}" cy="${qy(1)}" r="8" fill="#0e1b2b" stroke="#f5b642" stroke-width="3.2"/>`;
    s+=`<circle cx="${qx(5)}" cy="${qy(2)}" r="8" fill="#f5b642"/>`;
    s+=`<line x1="${qx(1)}" y1="${qy(0)}" x2="${qx(1)}" y2="${qy(1)}" stroke="#49d1c0" stroke-width="3.2" stroke-dasharray="5 5"/>`;
    s+=`<text x="${qx(1)-13}" y="${(qy(0)+qy(1))/2+8}" fill="#49d1c0" font-size="22" font-weight="700" text-anchor="end">점프 1</text>`;
    s+=`<text x="${qx(5)-8}" y="${qy(2)-14}" fill="#f5b642" font-size="21" font-weight="700" text-anchor="end"><tspan font-style="italic">g</tspan>(5)=2</text>`;
  }
  const gm=gmin(t);
  s+=`<line x1="${qx(t)}" y1="${HT}" x2="${qx(t)}" y2="${HB}" stroke="#f5b642" stroke-width="2.2" opacity=".45"/>`;
  if(gm!==null)s+=`<circle cx="${qx(t)}" cy="${qy(gm)}" r="10" fill="#fff" stroke="#f5b642" stroke-width="4"/>`;
  gtsvg.innerHTML=s;
}

 b:`<p>정점 (−1, 0)을 중심으로 직선을 회전시키며 <span class="am">가장 왼쪽 교점</span>을 추적한다.</p>
    <div class="hint">슬라이더를 왼쪽 끝에서 오른쪽 끝까지 한 번 쓸어 보세요.</div>

    <div class="eq sm ind">${FN}′(2) − 1 = ${V('a')}[ 2·2·1·(2−${AL}) + 2<sup>2</sup>(2−${AL}) + 2<sup>2</sup>·1 ]</div>

 b:`${RECALL}

    <div class="eq">${FN}(3) − 4 = (−5) · 3<sup>2</sup>(3 − 1)(3 − ${f135})</div>

const stepsBox=document.getElementById('steps');
STEPS.forEach((S,i)=>{
  const d=document.createElement('div');
  d.className='stepCard'; d.id='card'+i;
  d.innerHTML=`<div class="sc-h"><span class="sc-n">${S.n}</span><span class="sc-t">${S.t}</span></div><div class="sc-b">${S.b}</div>`;
  d.addEventListener('click',()=>go(i));
  stepsBox.appendChild(d);
});
const dotsBox=document.getElementById('dots');
STEPS.forEach((_,i)=>{const d=document.createElement('i');d.addEventListener('click',()=>go(i));dotsBox.appendChild(d);});

function scrollToCard(){
  const card=document.getElementById('card'+step);
  stepsBox.scrollTo({top:Math.max(0,card.offsetTop-4),behavior:'smooth'});
}
function go(i){
  step=Math.max(0,Math.min(STEPS.length-1,i));
  STEPS.forEach((_,k)=>{
    const c=document.getElementById('card'+k);
    c.classList.toggle('on',k<step);
    c.classList.toggle('live',k===step);
  });
  document.querySelectorAll('#dots i').forEach((d,k)=>d.classList.toggle('on',k===step));
  document.getElementById('prev').disabled=(step===0);
  document.getElementById('next').disabled=(step===STEPS.length-1);
  if(step===2&&sweepDone){const e=document.getElementById('lk3');if(e)e.classList.add('show');}
  requestAnimationFrame(scrollToCard);
  zoomT=(step===4)?1:0;
  if(step===3)setT(5); else if(step>=4)setT(1);
  animate();
}

/* ================= 애니메이션 ================= */
let raf=null;
function animate(){
  if(raf)return;
  const tick=()=>{
    const tgt=zoomT?ZOOM:WIDE; let moving=false;
    for(const k of ['x0','x1','y0','y1']){
      const d=tgt[k]-win[k];
      if(Math.abs(d)>1e-4){win[k]+=d*0.16;moving=true;}else win[k]=tgt[k];
    }
    drawGraph();drawGT();
    raf=moving?requestAnimationFrame(tick):null;
  };
  raf=requestAnimationFrame(tick);
}
const sl=document.getElementById('sl'), tv=document.getElementById('tv');
let tRaf=null;
function setT(v,mark){
  t=Math.max(TMIN,Math.min(TMAX,v)); sl.value=t; tv.textContent=fmt(t);
  if(mark!==false){
    visited[bkOf(t)]=true;
    if(!sweepDone && visited.filter(Boolean).length>=BK*0.88){
      sweepDone=true; const e=document.getElementById('lk3'); if(e)e.classList.add('show');
    }
  }
  if(!tRaf) tRaf=requestAnimationFrame(()=>{tRaf=null;drawGraph();drawGT();});
}
sl.addEventListener('input',()=>setT(parseFloat(sl.value)));
document.querySelectorAll('.chip[data-t]').forEach(b=>b.addEventListener('click',()=>setT(parseFloat(b.dataset.t))));
document.getElementById('tm').addEventListener('click',()=>setT(t-0.01));
document.getElementById('tp').addEventListener('click',()=>setT(t+0.01));

/* 점프 재생 : t = 0.85 → 1.15 를 천천히 */
const jumpBtn=document.getElementById('jump');
jumpBtn.addEventListener('click',()=>{
  if(jumpId){clearInterval(jumpId);jumpId=null;jumpBtn.classList.remove('on');jumpBtn.textContent='점프 재생';return;}
  jumpBtn.classList.add('on');jumpBtn.textContent='정지';
  setT(0.85);
  jumpId=setInterval(()=>{
    setT(t+0.0035);
    if(t>=1.15){clearInterval(jumpId);jumpId=null;jumpBtn.classList.remove('on');jumpBtn.textContent='점프 재생';setT(1);}
  },16);
});

/* 그래프 드래그 */
let gdrag=false;
function svgPt(ev){
  const m=gv.getScreenCTM(); if(!m)return null;
  const p=gv.createSVGPoint(); p.x=ev.clientX; p.y=ev.clientY;
  return p.matrixTransform(m.inverse());
}
function dragT(ev){
  const p=svgPt(ev); if(!p)return;
  const xm=win.x0+(p.x-GL)/(GR-GL)*(win.x1-win.x0);
  const ym=win.y0+(GB-p.y)/(GB-GT)*(win.y1-win.y0);
  if(xm+1<0.15)return;
  setT(ym/(xm+1));
}
gv.addEventListener('pointerdown',e=>{gdrag=true;try{gv.setPointerCapture(e.pointerId);}catch(_){ } dragT(e);e.preventDefault();});
gv.addEventListener('pointermove',e=>{if(gdrag){dragT(e);e.preventDefault();}});
['pointerup','pointercancel','pointerleave'].forEach(n=>gv.addEventListener(n,()=>{gdrag=false;}));

const autoBtn=document.getElementById('auto');
autoBtn.addEventListener('click',()=>{
  if(autoId){clearInterval(autoId);autoId=null;autoBtn.classList.remove('on');autoBtn.textContent='▶ 회전';return;}
  autoBtn.classList.add('on');autoBtn.textContent='❚❚ 정지';
  if(t>=TMAX-0.05)setT(TMIN);
  autoId=setInterval(()=>{setT(t+0.035); if(t>=TMAX-0.001){clearInterval(autoId);autoId=null;autoBtn.classList.remove('on');autoBtn.textContent='▶ 회전';}},16);
});

/* 문제 접기 */
const condbox=document.getElementById('condbox'), foldBtn=document.getElementById('foldBtn');
function toggleFold(){
  const f=condbox.classList.toggle('fold');
  foldBtn.textContent=f?'문제 ▼':'문제 ▲';
  requestAnimationFrame(scrollToCard);
}
foldBtn.addEventListener('click',e=>{e.stopPropagation();toggleFold();});

/* 버튼 */
document.getElementById('next').addEventListener('click',()=>go(step+1));
document.getElementById('prev').addEventListener('click',()=>go(step-1));
document.getElementById('fsBtn').addEventListener('click',toggleFS);
document.getElementById('rsBtn').addEventListener('click',reset);
function toggleFS(){ document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen(); }
function reset(){ visited.fill(false); sweepDone=false; const e=document.getElementById('lk3'); if(e)e.classList.remove('show'); setT(-2,false); go(0); }

addEventListener('keydown',e=>{
  if(e.key===' '||e.key==='ArrowRight'||e.key==='PageDown'){go(step+1);e.preventDefault();}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){go(step-1);e.preventDefault();}
  else if(e.key==='ArrowUp'){setT(t+0.05);e.preventDefault();}
  else if(e.key==='ArrowDown'){setT(t-0.05);e.preventDefault();}
  else if(e.key>='1'&&e.key<='7'){go(parseInt(e.key)-1);}
  else if(e.key==='r'||e.key==='R'){reset();}
  else if(e.key==='f'||e.key==='F'){toggleFS();}
  else if(e.key==='l'||e.key==='L'){toggleLaser();}
  else if(e.key==='q'||e.key==='Q'){toggleFold();}
});

/* ================= 레이저 ================= */
const laserBtn=document.getElementById('laserBtn'), ldot=document.getElementById('ldot');
const tails=[0,1,2,3,4].map(i=>document.getElementById('lt'+i));
let LX=-300,LY=-300; const TX=[],TY=[];
tails.forEach((el,i)=>{TX[i]=-300;TY[i]=-300;el.style.opacity=(0.55-i*0.09).toFixed(2);
  const sz=12-i*1.7; el.style.width=sz+'px'; el.style.height=sz+'px'; el.style.margin=(-sz/2)+'px 0 0 '+(-sz/2)+'px';});
addEventListener('pointermove',e=>{
  if(e.pointerType!=='mouse')return;
  document.body.classList.add('has-mouse'); LX=e.clientX; LY=e.clientY;
},{passive:true});
addEventListener('pointerdown',e=>{
  if(e.pointerType!=='mouse'||!document.body.classList.contains('laser-on'))return;
  const r=document.createElement('div'); r.className='lring';
  document.getElementById('laser').appendChild(r);
  r.animate([{transform:`translate(${e.clientX}px,${e.clientY}px) scale(.3)`,opacity:.95},
             {transform:`translate(${e.clientX}px,${e.clientY}px) scale(3.4)`,opacity:0}],
            {duration:550,easing:'ease-out'});
  setTimeout(()=>r.remove(),580);
},{passive:true});
(function lloop(){
  ldot.style.transform=`translate(${LX}px,${LY}px)`;
  let ax=LX,ay=LY;
  tails.forEach((el,i)=>{
    TX[i]+=(ax-TX[i])*0.34; TY[i]+=(ay-TY[i])*0.34;
    el.style.transform=`translate(${TX[i]}px,${TY[i]}px)`;
    ax=TX[i]; ay=TY[i];
  });
  requestAnimationFrame(lloop);
})();
function toggleLaser(){ laserBtn.classList.toggle('on',document.body.classList.toggle('laser-on')); }
laserBtn.addEventListener('click',toggleLaser);

/* ================= 시작 ================= */
setT(-2,false); go(0); drawGraph(); drawGT();
</script>
