<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>사차함수와 g(t)의 불연속</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1220; --bg2:#0e1729;
  --ink:#f2f6ff; --dim:#9db0cf; --faint:#5d739a;
  --amber:#f5b642; --coral:#ff7d6a; --teal:#49d1c0;
  --panel:#12203a; --panel2:#16274a; --line:#2b4168;
  --fs:1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg)}
body{font-family:'Noto Sans KR','Space Grotesk',system-ui,sans-serif;color:var(--ink);
  -webkit-user-select:none;user-select:none;touch-action:manipulation}
.viewport{position:fixed;inset:0;overflow:hidden;background:
  radial-gradient(1200px 800px at 22% 8%, #16233d 0%, var(--bg) 62%)}
.stage{position:absolute;left:0;top:0;width:1600px;height:1100px;transform-origin:0 0}
.sheet{width:100%;height:100%;padding:16px 20px 14px;display:flex;flex-direction:column;gap:12px}

/* ===== 본문 ===== */
.body{flex:1 1 auto;display:flex;gap:16px;min-height:0}
.col-l{flex:0 0 872px;display:flex;flex-direction:column;gap:10px;min-height:0}
.col-r{flex:1 1 auto;display:flex;flex-direction:column;gap:12px;min-height:0}

.panel{background:linear-gradient(180deg,var(--panel) 0%,var(--bg2) 100%);
  border:1.5px solid var(--line);border-radius:16px;position:relative;overflow:hidden}
.panel .tag{position:absolute;left:16px;top:12px;font-size:21px;font-weight:700;color:var(--dim);
  letter-spacing:.2px;z-index:2}
.p-graph{flex:1 1 auto;min-height:0;display:flex}
.p-graph svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.p-graph svg:active{cursor:grabbing}

/* ===== 슬라이더 바 ===== */
.ctrl{flex:0 0 auto;display:flex;align-items:center;gap:14px;background:var(--panel);
  border:1.5px solid var(--line);border-radius:14px;padding:10px 18px}
.tval{font-family:'Space Grotesk',sans-serif;font-size:38px;font-weight:700;color:var(--amber);
  min-width:186px;letter-spacing:.5px}
.tval i{font-family:'Times New Roman',serif;font-style:italic}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1 1 auto;height:20px;border-radius:11px;
  background:linear-gradient(90deg,#22365a,#2e4a78);outline:none;border:1px solid var(--line);
  touch-action:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:52px;height:52px;border-radius:50%;
  background:var(--amber);border:5px solid #2a2110;cursor:pointer;box-shadow:0 3px 12px rgba(0,0,0,.55)}
input[type=range]::-moz-range-thumb{width:46px;height:46px;border-radius:50%;background:var(--amber);
  border:5px solid #2a2110;cursor:pointer}
.chip{font-family:'Space Grotesk',sans-serif;font-size:25px;font-weight:700;color:var(--ink);
  background:#1d3157;border:1.5px solid var(--line);border-radius:11px;padding:9px 17px;cursor:pointer}
.chip:hover{background:#27436f;border-color:var(--teal)}
.chip.on{background:var(--teal);color:#06251f;border-color:var(--teal)}

/* ===== g(t) 패널 ===== */
.p-gt{flex:0 0 320px;transition:flex-basis .45s cubic-bezier(.4,0,.2,1),opacity .3s;overflow:hidden}
.p-gt.hide{flex-basis:0px;opacity:0;border-width:0}

/* ===== 단계 설명 ===== */
.p-step{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding:16px 22px 18px}
.p-step h2{margin:0 0 12px;font-size:calc(30px*var(--fs));font-weight:700;color:var(--amber);
  line-height:1.25;letter-spacing:-.3px}
.stepbody{flex:1 1 auto;min-height:0;overflow:hidden;font-size:calc(25px*var(--fs));line-height:1.52;color:var(--ink)}
.stepbody p{margin:0 0 10px}
.stepbody .dimline{color:var(--dim)}
.eq{font-family:'Space Grotesk',sans-serif;font-size:calc(28px*var(--fs));font-weight:600;
  margin:9px 0;line-height:1.45}
sup{font-size:.6em;vertical-align:super;line-height:0}
.v{font-family:'Times New Roman',serif;font-style:italic;font-size:1.06em}
.box{background:#0c1a31;border:1.5px solid var(--teal);border-radius:12px;padding:10px 15px;margin:11px 0}
.box.amberb{border-color:var(--amber)}
.result{background:linear-gradient(90deg,rgba(245,182,66,.22),rgba(245,182,66,.05));
  border-left:6px solid var(--amber);border-radius:9px;padding:10px 15px;margin:10px 0;
  font-size:calc(27px*var(--fs));font-weight:700}
.bad{color:var(--coral);font-weight:700}
.ok{color:var(--teal);font-weight:700}
.am{color:var(--amber);font-weight:700}
.locked{opacity:0;transform:translateY(10px);transition:opacity .45s,transform .45s;pointer-events:none}
.locked.show{opacity:1;transform:none;pointer-events:auto}
.hint{margin-top:9px;font-size:calc(23px*var(--fs));color:var(--teal);font-weight:600}
.hint::before{content:"▸ ";}
ul.tight{margin:7px 0 7px 2px;padding-left:22px}
ul.tight li{margin:5px 0}

.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;
  margin:0 4px;font-size:.82em;line-height:1.05;position:relative;top:-.08em}
.frac .num{padding:0 5px 1px}
.frac .den{padding:1px 5px 0;border-top:2px solid currentColor}

/* ===== 하단 : 제목(좌) + 조작(우) ===== */
.app-foot{flex:0 0 96px;display:flex;align-items:center;gap:24px}
.titlewrap{display:flex;flex-direction:column;justify-content:center;gap:3px;min-width:0}
.t1{display:flex;align-items:center;gap:14px}
.no{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:31px;color:var(--bg);
  background:var(--amber);border-radius:11px;padding:3px 15px}
.ttl{font-size:35px;font-weight:700;letter-spacing:-.4px;white-space:nowrap}
.t2{font-size:27px;color:var(--dim);font-weight:500;white-space:nowrap}
.t2 b{color:var(--teal);font-weight:700}
.navwrap{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:7px}
.navrow{display:flex;align-items:center;gap:16px}
.btn{font-family:'Noto Sans KR',sans-serif;font-size:26px;font-weight:700;color:var(--ink);
  background:#1d3157;border:1.5px solid var(--line);border-radius:13px;padding:11px 26px;cursor:pointer}
.btn:hover{background:#27436f}
.btn.primary{background:var(--amber);color:#231a06;border-color:var(--amber)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.3;cursor:default}
.btn.mini{font-size:24px;padding:10px 16px}
.dots{display:flex;gap:11px}
.dots i{width:16px;height:16px;border-radius:50%;background:#284066;display:block;cursor:pointer;
  transition:all .25s}
.dots i.on{background:var(--amber);width:42px;border-radius:8px}
.keys{font-size:16px;color:var(--faint)}
</style>
</head>
<body>
<div class="viewport">
<div class="stage" id="stage">
 <div class="sheet">

  <div class="body">
    <div class="col-l">
      <div class="panel p-graph"><span class="tag">y = f(x) 와 직선 ℓ<sub>t</sub></span>
        <svg id="gv" viewBox="0 0 872 880" preserveAspectRatio="xMidYMid meet"></svg>
      </div>
      <div class="ctrl">
        <div class="tval"><i>t</i> = <span id="tv">1.00</span></div>
        <input type="range" id="sl" min="-4" max="6.4" step="0.005" value="-2">
        <button class="chip" data-t="1"><i class="v">t</i>=1</button>
        <button class="chip" data-t="5"><i class="v">t</i>=5</button>
        <button class="chip" id="auto">▶ 자동 회전</button>
      </div>
    </div>

    <div class="col-r">
      <div class="panel p-gt" id="gtp"><span class="tag">y = g(t)</span>
        <svg id="gt" viewBox="0 0 672 320" preserveAspectRatio="xMidYMid meet"></svg>
      </div>
      <div class="panel p-step">
        <h2 id="sttitle"></h2>
        <div class="stepbody" id="stbody"></div>
      </div>
    </div>
  </div>

  <div class="app-foot">
    <div class="titlewrap">
      <div class="t1">
        <span class="no">22</span>
        <span class="ttl">사차함수 <span class="v">f</span>(<span class="v">x</span>)와 <span class="v">g</span>(<span class="v">t</span>)의 불연속</span>
      </div>
      <div class="t2"><span class="v">f</span>(<span class="v">x</span>) = <span class="v">tx</span> + <span class="v">t</span>&nbsp; (<span class="v">x</span> ≥ −1)&nbsp; /&nbsp; 구하는 값 <b>|<span class="v">f</span>(3)|</b></div>
    </div>
    <div class="navwrap">
      <div class="navrow">
        <button class="btn mini" id="fs">⛶</button>
        <button class="btn" id="prev">← 이전</button>
        <div class="dots" id="dots"></div>
        <button class="btn primary" id="next">다음 →</button>
      </div>
      <span class="keys">그래프를 손가락으로 끌면 직선이 회전 · Space/→ 다음 · ← 이전 · 1~7 단계 · R 초기화</span>
    </div>
  </div>

 </div>
</div>
</div>

<script>
/* ================= 스케일링 (16:11, 여백 0) ================= */
const SW=1600, SH=1100;
const stage=document.getElementById('stage');
function fit(){
  const vw=(window.visualViewport&&window.visualViewport.width)||window.innerWidth;
  const vh=(window.visualViewport&&window.visualViewport.height)||window.innerHeight;
  let sx=vw/SW, sy=vh/SH;
  const r=sx/sy;
  // 화면 비율이 16:11에서 크게 벗어나면(±14%) 왜곡 대신 비율 유지
  if(r>1.14||r<0.877){ const s=Math.min(sx,sy); sx=s; sy=s; }
  stage.style.transform='translate('+((vw-SW*sx)/2)+'px,'+((vh-SH*sy)/2)+'px) scale('+sx+','+sy+')';
}
['resize','orientationchange','pageshow'].forEach(e=>addEventListener(e,fit));
if(window.visualViewport){visualViewport.addEventListener('resize',fit);visualViewport.addEventListener('scroll',fit);}
fit();[60,300,700,1500].forEach(d=>setTimeout(fit,d));

/* ================= 수학 ================= */
const fmt=v=>v.toFixed(2).replace('-','\u2212');
const F=x=>((((-5*x+18)*x-13)*x+1)*x+1);      // f(x) = -5x^4+18x^3-13x^2+x+1
const H=x=>F(x)/(x+1);                         // 정점 (-1,0)에서의 기울기
const XM=(2*Math.sqrt(61)-7)/15;               // h의 극소점 ≈ 0.5747
const XR=3.8, EPS=1e-9;
const BR=[[-1+EPS,0],[0,XM],[XM,2],[2,XR]];    // h의 단조구간 4개
function solveBranch(b,t){
  let a=b[0],c=b[1],ha=H(a)-t,hc=H(c)-t;
  if(ha===0)return a; if(hc===0)return c;
  if(ha*hc>0)return null;
  for(let i=0;i<70;i++){const m=(a+c)/2,hm=H(m)-t; if(ha*hm<=0){c=m;hc=hm;}else{a=m;ha=hm;}}
  return (a+c)/2;
}
function allRoots(t){
  const r=[];
  for(const b of BR){const x=solveBranch(b,t); if(x!==null&&!r.some(u=>Math.abs(u-x)<1e-6))r.push(x);}
  return r.sort((p,q)=>p-q);
}
function gmin(t){                               // 최소 교점
  if(t>5+1e-9)return null;
  if(t<=1)return solveBranch(BR[0],t);
  return solveBranch(BR[2],t);
}

/* ================= 상태 ================= */
let t=-2, step=0, zoomT=0, autoId=null;
const visited=new Array(240).fill(false);
let sweepDone=false;
const TMIN=-4,TMAX=6.4;
const WIDE={x0:-1.12,x1:2.92,y0:-11.5,y1:19.5};
const ZOOM={x0:-0.45,x1:1.58,y0:-0.9,y1:4.2};
let win=Object.assign({},WIDE);

/* ================= 좌측 그래프 좌표 ================= */
const GL=70,GR=846,GT=34,GB=806;
const px=x=>GL+(x-win.x0)/(win.x1-win.x0)*(GR-GL);
const py=y=>GB-(y-win.y0)/(win.y1-win.y0)*(GB-GT);
function clipPoly(pts){
  const out=[];let cur=[];
  const inY=p=>p[1]>=win.y0&&p[1]<=win.y1;
  const cross=(a,b,yb)=>{const s=(yb-a[1])/(b[1]-a[1]);return [a[0]+s*(b[0]-a[0]),yb];};
  for(let i=0;i<pts.length;i++){
    const p=pts[i], ins=inY(p);
    if(ins){ if(i>0&&!inY(pts[i-1])){const q=pts[i-1];const yb=q[1]<win.y0?win.y0:win.y1;cur.push(cross(q,p,yb));} cur.push(p); }
    else { if(i>0&&inY(pts[i-1])){const q=pts[i-1];const yb=p[1]<win.y0?win.y0:win.y1;cur.push(cross(q,p,yb));} if(cur.length>1)out.push(cur); cur=[]; }
  }
  if(cur.length>1)out.push(cur);
  return out;
}
const toPath=segs=>segs.map(s=>'M'+s.map(p=>px(p[0]).toFixed(1)+' '+py(p[1]).toFixed(1)).join(' L ')).join(' ');

/* ================= 좌측 그래프 ================= */
const gv=document.getElementById('gv');
function drawGraph(){
  let s='';
  for(let gx=Math.ceil(win.x0);gx<=win.x1;gx++){
    s+=`<line x1="${px(gx)}" y1="${GT}" x2="${px(gx)}" y2="${GB}" stroke="#1d2f4e" stroke-width="1.2"/>`;
  }
  const dy=(win.y1-win.y0)>10?5:1;
  for(let gy=Math.ceil(win.y0/dy)*dy;gy<=win.y1;gy+=dy){
    s+=`<line x1="${GL}" y1="${py(gy)}" x2="${GR}" y2="${py(gy)}" stroke="#1d2f4e" stroke-width="1.2"/>`;
  }
  if(win.y0<0&&win.y1>0)s+=`<line x1="${GL}" y1="${py(0)}" x2="${GR}" y2="${py(0)}" stroke="#5d739a" stroke-width="2.5"/>`;
  if(win.x0<0&&win.x1>0)s+=`<line x1="${px(0)}" y1="${GT}" x2="${px(0)}" y2="${GB}" stroke="#5d739a" stroke-width="2.5"/>`;
  for(let gx=Math.ceil(win.x0);gx<=win.x1;gx++){ if(gx===0||gx===-1)continue;
    s+=`<text x="${px(gx)}" y="${Math.min(GB-6,py(0)+34)}" fill="#8fa4c6" font-size="26" text-anchor="middle" font-family="Times New Roman" font-style="italic">${String(gx).replace('-','\u2212')}</text>`;}

  s+=`<text x="${GR}" y="${GT-6}" fill="#5d739a" font-size="21" text-anchor="end">손가락으로 끌어 직선 회전</text>`;

  // 정의역 경계 x=-1
  s+=`<line x1="${px(-1)}" y1="${GT}" x2="${px(-1)}" y2="${GB}" stroke="#ff7d6a" stroke-width="2.5" stroke-dasharray="8 7" opacity=".75"/>`;
  s+=`<text x="${px(-1)+10}" y="${GT+26}" fill="#ff7d6a" font-size="25" font-weight="700">x ≥ −1</text>`;

  // step1 : 직선다발
  if(step===0){
    for(const k of [-3,-1.5,0,1.5,3,4.5,6]){
      const pts=[];for(let i=0;i<=60;i++){const x=win.x0+(win.x1-win.x0)*i/60;pts.push([x,k*(x+1)]);}
      s+=`<path d="${toPath(clipPoly(pts))}" fill="none" stroke="#49d1c0" stroke-width="2.4" opacity=".3"/>`;
    }
  }
  // 고정된 두 직선
  const pinned=[];
  if(step>=3)pinned.push([5,'#ff7d6a']);
  if(step>=4)pinned.push([1,'#49d1c0']);
  for(const [k,c] of pinned){
    const pts=[];for(let i=0;i<=80;i++){const x=win.x0+(win.x1-win.x0)*i/80;pts.push([x,k*(x+1)]);}
    s+=`<path d="${toPath(clipPoly(pts))}" fill="none" stroke="${c}" stroke-width="3.5" opacity=".55" stroke-dasharray="11 8"/>`;
  }
  // 곡선 f
  const cp=[];for(let i=0;i<=900;i++){const x=-1+(Math.min(win.x1,XR)+1)*i/900;cp.push([x,F(x)]);}
  s+=`<path d="${toPath(clipPoly(cp))}" fill="none" stroke="#f2f6ff" stroke-width="5.5" stroke-linecap="round"/>`;

  // 현재 직선
  const lp=[];for(let i=0;i<=80;i++){const x=-1+(win.x1+1)*i/80;lp.push([x,t*(x+1)]);}
  s+=`<path d="${toPath(clipPoly(lp))}" fill="none" stroke="#f5b642" stroke-width="4.5"/>`;

  // 정점
  s+=`<circle cx="${px(-1)}" cy="${py(0)}" r="12" fill="#0b1220" stroke="#49d1c0" stroke-width="5"/>`;
  s+=`<text x="${px(-1)+16}" y="${py(0)-18}" fill="#49d1c0" font-size="27" font-weight="700">(−1, 0)</text>`;

  // 교점
  const rts=allRoots(t), gm=gmin(t);
  rts.forEach(x=>{ const Y=F(x); if(Y<win.y0||Y>win.y1)return;
    const isMin=(gm!==null&&Math.abs(x-gm)<1e-6);
    const merge=(step===4&&!isMin&&x<XM+1e-6&&t<=1);
    s+=`<circle cx="${px(x)}" cy="${py(Y)}" r="${isMin?15:9}" fill="${isMin?'#f5b642':(merge?'#ff7d6a':'#9db0cf')}" stroke="#0b1220" stroke-width="${isMin?3.5:2.5}"/>`;
  });
  if(gm!==null&&F(gm)>=win.y0&&F(gm)<=win.y1){
    s+=`<line x1="${px(gm)}" y1="${py(F(gm))}" x2="${px(gm)}" y2="${GB}" stroke="#f5b642" stroke-width="2.5" stroke-dasharray="6 6" opacity=".8"/>`;
    const lx=Math.max(GL+110,Math.min(GR-110,px(gm)));
    s+=`<text x="${lx}" y="${GB+52}" fill="#f5b642" font-size="36" font-weight="700" text-anchor="middle">g(t) = ${fmt(gm)}</text>`;
  }else if(gm===null){
    const cx=(GL+GR)/2;
    s+=`<rect x="${cx-310}" y="${GT+14}" width="620" height="62" rx="16" fill="#0b1220" stroke="#ff7d6a" stroke-width="3" opacity=".96"/>`;
    s+=`<text x="${cx}" y="${GT+55}" fill="#ff7d6a" font-size="33" font-weight="700" text-anchor="middle">교점 없음 — 실근이 존재하지 않는다</text>`;
  }

  // 단계별 주석
  if(step===1){
    s+=`<path d="M ${px(-1)} ${py(0)} L ${px(-1)} ${GB-8}" stroke="#ff7d6a" stroke-width="4"/>`;
    s+=`<text x="${px(-1)+18}" y="${GB-16}" fill="#ff7d6a" font-size="30" font-weight="700">f(−1) &lt; 0 (아래로 내려감)</text>`;
  }
  if(step>=3){ const X=2,Y=15; if(Y<=win.y1&&Y>=win.y0){
    s+=`<circle cx="${px(X)}" cy="${py(Y)}" r="16" fill="none" stroke="#ff7d6a" stroke-width="5"/>`;
    s+=`<text x="${px(X)+22}" y="${py(Y)-12}" fill="#ff7d6a" font-size="29" font-weight="700">접점 (2, 15)</text>`;}}
  if(step>=4){ [[0,1,'접점 (0, 1)'],[1,2,'(1, 2)']].forEach(([X,Y,lb])=>{
    if(Y<=win.y1&&Y>=win.y0){
      s+=`<circle cx="${px(X)}" cy="${py(Y)}" r="15" fill="none" stroke="#49d1c0" stroke-width="5"/>`;
      s+=`<text x="${px(X)+20}" y="${py(Y)-20}" fill="#49d1c0" font-size="29" font-weight="700">${lb}</text>`;}});}
  gv.innerHTML=s;
}

/* ================= g(t) 그래프 ================= */
const gtsvg=document.getElementById('gt');
const HL=60,HR=648,HT=46,HB=286;
const qx=v=>HL+(v-TMIN)/(TMAX-TMIN)*(HR-HL);
const qy=v=>HB-(v-(-1.35))/(2.65-(-1.35))*(HB-HT);
const BK=visited.length;
const bkOf=v=>Math.max(0,Math.min(BK-1,Math.floor((v-TMIN)/(TMAX-TMIN)*BK)));
function drawGT(){
  let s='';
  s+=`<line x1="${HL}" y1="${qy(0)}" x2="${HR}" y2="${qy(0)}" stroke="#5d739a" stroke-width="2.5"/>`;
  s+=`<line x1="${qx(0)}" y1="${HT}" x2="${qx(0)}" y2="${HB}" stroke="#5d739a" stroke-width="2.5"/>`;
  for(const k of [-4,-2,2,4,6]) s+=`<text x="${qx(k)}" y="${qy(0)+27}" fill="#8fa4c6" font-size="21" text-anchor="middle">${k}</text>`;
  for(const k of [1,2]) s+=`<text x="${qx(0)-14}" y="${qy(k)+8}" fill="#8fa4c6" font-size="21" text-anchor="end">${k}</text>`;
  s+=`<text x="${HR-2}" y="${qy(0)-12}" fill="#8fa4c6" font-size="24" text-anchor="end" font-family="Times New Roman" font-style="italic">t</text>`;
  s+=`<line x1="${qx(5)}" y1="${HT}" x2="${qx(5)}" y2="${HB}" stroke="#ff7d6a" stroke-width="2.5" stroke-dasharray="7 7" opacity=".6"/>`;
  s+=`<text x="${qx(5)+8}" y="${HT+20}" fill="#ff7d6a" font-size="22" font-weight="700">t = 5</text>`;

  const showAll=(step>=3)||sweepDone;
  const pts=[];
  for(let i=0;i<BK;i++){
    const tv=TMIN+(TMAX-TMIN)*(i+.5)/BK;
    if(tv>5.0001){pts.push(null);continue;}
    if(!showAll&&!visited[i]){pts.push(null);continue;}
    pts.push([tv,gmin(tv),tv>1]);
  }
  let cur=[],side=null;
  const flush=()=>{ if(cur.length>1)s+=`<path d="M${cur.map(p=>qx(p[0]).toFixed(1)+' '+qy(p[1]).toFixed(1)).join(' L ')}" fill="none" stroke="#f5b642" stroke-width="5" stroke-linecap="round"/>`; cur=[];};
  for(const p of pts){
    if(!p||p[1]===null){flush();side=null;continue;}
    if(side!==null&&p[2]!==side)flush();
    side=p[2];cur.push(p);
  }
  flush();
  if(showAll){
    s+=`<circle cx="${qx(1)}" cy="${qy(0)}" r="9" fill="#f5b642"/>`;
    s+=`<circle cx="${qx(1)}" cy="${qy(1)}" r="9" fill="#0e1729" stroke="#f5b642" stroke-width="3.5"/>`;
    s+=`<circle cx="${qx(5)}" cy="${qy(2)}" r="9" fill="#f5b642"/>`;
    s+=`<line x1="${qx(1)}" y1="${qy(0)}" x2="${qx(1)}" y2="${qy(1)}" stroke="#49d1c0" stroke-width="3.5" stroke-dasharray="5 5"/>`;
    s+=`<text x="${qx(1)+14}" y="${qy(.5)+8}" fill="#49d1c0" font-size="24" font-weight="700">점프 = 1</text>`;
  }
  const gm=gmin(t);
  s+=`<line x1="${qx(t)}" y1="${HT}" x2="${qx(t)}" y2="${HB}" stroke="#f5b642" stroke-width="2.5" opacity=".45"/>`;
  if(gm!==null)s+=`<circle cx="${qx(t)}" cy="${qy(gm)}" r="11" fill="#fff" stroke="#f5b642" stroke-width="4.5"/>`;
  gtsvg.innerHTML=s;
}

/* ================= 단계 내용 ================= */
const f135='<span class="frac"><span class="num">13</span><span class="den">5</span></span>';
const STEPS=[
{t:'① 식 변형 — 모든 직선은 (−1, 0)을 지난다',
 b:`<div class="eq"><span class="v">tx</span> + <span class="v">t</span> = <span class="v">t</span>(<span class="v">x</span> + 1)</div>
    <p>⇒ 직선 <span class="am">y = t(x+1)</span> 은 <b class="ok">기울기 t</b>, <b class="ok">항상 점 (−1, 0)</b>을 지난다.</p>
    <p class="dimline">정점이 정의역의 끝 <span class="v">x</span> = −1 과 같다는 것이 이 문제의 장치.</p>
    <div class="result"><span class="v">g</span>(<span class="v">t</span>) = 교점의 <span class="v">x</span>좌표 중 <span class="am">최솟값</span></div>
    <div class="hint">슬라이더 또는 그래프를 끌어 직선을 회전시켜 보세요.</div>`},
{t:'② 그래프의 모양이 먼저 결정된다',
 b:`<p class="dimline"><span class="v">t</span>의 최댓값이 존재하려면?</p>
    <ul class="tight">
      <li><span class="v">f</span>(−1) = 0 ⇒ <span class="v">x</span> = −1이 <b>모든</b> <span class="v">t</span>의 근 <span class="bad">✗</span></li>
      <li><span class="v">f</span>(−1) &gt; 0 ⇒ 아무리 세워도 −1 곁에서 만남 <span class="bad">✗</span></li>
      <li>최고차항 계수 &gt; 0 ⇒ 오른쪽에서 반드시 만남 <span class="bad">✗</span></li>
    </ul>
    <div class="result"><span class="v">f</span>(−1) &lt; 0 이고 최고차항 계수 <span class="v">a</span> &lt; 0</div>`},
{t:'③ 직선을 돌려 g(t)를 그려보자',
 b:`<p>정점 (−1, 0)을 중심으로 직선을 회전시키며 <span class="am">가장 왼쪽 교점</span>을 추적한다.</p>
    <div class="hint">슬라이더를 왼쪽 끝에서 오른쪽 끝까지 움직여 보세요.</div>
    <div class="locked" id="lk3">
      <div class="box"><p style="margin:0"><span class="am">관찰 1.</span> <span class="v">t</span> &gt; 5 에서는 교점이 없다 → 최댓값 5</p>
      <p style="margin:7px 0 0"><span class="am">관찰 2.</span> <span class="v">t</span> = 1 에서 <span class="v">g</span>가 <b class="ok">뚝 뛴다</b> (불연속)</p></div>
    </div>`},
{t:'④ t의 최댓값 5 ⇒ ℓ₅는 접선',
 b:`<p><span class="v">t</span> = 5가 한계 ⇒ 이 직선이 곡선에 <span class="bad">접한다</span>. 접점은 <span class="v">g</span>(5) = 2.</p>
    <div class="eq"><span class="v">f</span>(2) = 5 · (2+1) = <span class="am">15</span></div>
    <div class="box amberb"><div class="eq" style="margin:2px 0"><span class="v">f</span>(<span class="v">x</span>) − 5(<span class="v">x</span>+1) = <span class="v">a</span>(<span class="v">x</span>−2)<sup>2</sup>(<span class="v">x</span><sup>2</sup>+<span class="v">px</span>+<span class="v">q</span>)</div>
    <p class="dimline" style="margin:5px 0 0;font-size:.85em">(뒤 이차식은 실근 없음)</p></div>`},
{t:'⑤ 불연속 = 왼쪽 두 교점의 소멸',
 b:`<p><span class="v">t</span>를 키우면 왼쪽 <span class="bad">두 교점</span>이 합쳐져 접점이 되고 곧 사라진다.</p>
    <p>그 순간이 <span class="am">t = 1</span>, 접점은 <span class="v">g</span>(1) = <span class="am">0</span>.</p>
    <p>점프 후 = 같은 직선의 <b class="ok">다음 교점</b> = 0 + 1 = <span class="am">1</span></p>
    <div class="eq"><span class="v">f</span>(0) = 1, &nbsp; <span class="v">f</span>(1) = 2</div>
    <div class="box"><div class="eq" style="margin:2px 0"><span class="v">f</span>(<span class="v">x</span>) − (<span class="v">x</span>+1) = <span class="v">a</span><span class="v">x</span><sup>2</sup>(<span class="v">x</span>−1)(<span class="v">x</span>−<span class="v">r</span>)</div></div>`},
{t:'⑥ 두 식을 연립',
 b:`<div class="eq"><span class="v">P</span>(<span class="v">x</span>) = <span class="v">a</span><span class="v">x</span><sup>2</sup>(<span class="v">x</span>−1)(<span class="v">x</span>−<span class="v">r</span>) − 4(<span class="v">x</span>+1)</div>
    <p class="dimline">가 <span class="v">x</span> = 2에서 <b class="ok">중근</b>을 가져야 한다.</p>
    <div class="eq"><span class="v">P</span>(2) = 0 : &nbsp; 4<span class="v">a</span>(2−<span class="v">r</span>) = 12</div>
    <div class="eq"><span class="v">P</span>′(2) = 0 : &nbsp; <span class="v">a</span>(20 − 8<span class="v">r</span>) = 4</div>
    <div class="result"><span class="v">r</span> = ${f135}, &nbsp; <span class="v">a</span> = −5</div>`},
{t:'⑦ 답',
 b:`<div class="eq" style="font-size:calc(31px*var(--fs))"><span class="v">f</span>(<span class="v">x</span>) = −5<span class="v">x</span><sup>4</sup> + 18<span class="v">x</span><sup>3</sup> − 13<span class="v">x</span><sup>2</sup> + <span class="v">x</span> + 1</div>
    <p class="dimline" style="font-size:.9em">검산 : <span class="v">f</span>−5(<span class="v">x</span>+1) = −(<span class="v">x</span>−2)<sup>2</sup>(5<span class="v">x</span><sup>2</sup>+2<span class="v">x</span>+1) ✓ &nbsp; <span class="v">f</span>(−1) = −36 &lt; 0 ✓</p>
    <div class="eq"><span class="v">f</span>(3) = −405 + 486 − 117 + 3 + 1 = −32</div>
    <div class="result" style="font-size:calc(38px*var(--fs))">|<span class="v">f</span>(3)| = 32</div>`}
];

const stT=document.getElementById('sttitle'), stB=document.getElementById('stbody'), gtp=document.getElementById('gtp');
function fitCard(){
  let s=1.38; document.documentElement.style.setProperty('--fs',s);
  for(let i=0;i<30;i++){ if(stB.scrollHeight<=stB.clientHeight+1)break; s-=0.03; document.documentElement.style.setProperty('--fs',s.toFixed(3)); }
}
function renderStep(){
  stT.innerHTML=STEPS[step].t; stB.innerHTML=STEPS[step].b;
  gtp.classList.toggle('hide',step>=5);
  document.querySelectorAll('#dots i').forEach((d,i)=>d.classList.toggle('on',i===step));
  document.getElementById('prev').disabled=(step===0);
  document.getElementById('next').disabled=(step===STEPS.length-1);
  if(step===2&&sweepDone){const e=document.getElementById('lk3');if(e)e.classList.add('show');}
  zoomT=(step===4)?1:0;
  requestAnimationFrame(()=>{fitCard();requestAnimationFrame(fitCard);});
  if(step===3)setT(5); if(step===4)setT(0.9); if(step===5||step===6)setT(1);
  animate();
}
function goto(i){ step=Math.max(0,Math.min(STEPS.length-1,i)); renderStep(); }

/* ================= 애니메이션 / 입력 ================= */
let raf=null;
function animate(){
  if(raf)return;
  const tick=()=>{
    const tgt=zoomT?ZOOM:WIDE; let moving=false;
    for(const k of ['x0','x1','y0','y1']){
      const d=tgt[k]-win[k];
      if(Math.abs(d)>1e-4){win[k]+=d*0.16;moving=true;}else win[k]=tgt[k];
    }
    drawGraph();drawGT();
    raf=moving?requestAnimationFrame(tick):null;
  };
  raf=requestAnimationFrame(tick);
}
const sl=document.getElementById('sl'), tv=document.getElementById('tv');
function setT(v,mark){
  t=Math.max(TMIN,Math.min(TMAX,v)); sl.value=t; tv.textContent=fmt(t);
  if(mark!==false){
    visited[bkOf(t)]=true;
    if(!sweepDone){
      const n=visited.filter(Boolean).length;
      if(n>=BK*0.88){sweepDone=true;const e=document.getElementById('lk3');if(e){e.classList.add('show');requestAnimationFrame(fitCard);}}
    }
  }
  drawGraph();drawGT();
}
sl.addEventListener('input',()=>setT(parseFloat(sl.value)));
document.querySelectorAll('.chip[data-t]').forEach(b=>b.addEventListener('click',()=>setT(parseFloat(b.dataset.t))));

/* --- 그래프 직접 드래그로 직선 회전 --- */
let gdrag=false;
function svgPt(ev){
  const m=gv.getScreenCTM(); if(!m)return null;
  const p=gv.createSVGPoint(); p.x=ev.clientX; p.y=ev.clientY;
  return p.matrixTransform(m.inverse());
}
function dragT(ev){
  const p=svgPt(ev); if(!p)return;
  const xm=win.x0+(p.x-GL)/(GR-GL)*(win.x1-win.x0);
  const ym=win.y0+(GB-p.y)/(GB-GT)*(win.y1-win.y0);
  if(xm+1<0.15)return;
  setT(ym/(xm+1));
}
gv.addEventListener('pointerdown',e=>{gdrag=true;try{gv.setPointerCapture(e.pointerId);}catch(_){} dragT(e);e.preventDefault();});
gv.addEventListener('pointermove',e=>{if(gdrag){dragT(e);e.preventDefault();}});
['pointerup','pointercancel','pointerleave'].forEach(t=>gv.addEventListener(t,()=>{gdrag=false;}));

const autoBtn=document.getElementById('auto');
autoBtn.addEventListener('click',()=>{
  if(autoId){clearInterval(autoId);autoId=null;autoBtn.classList.remove('on');autoBtn.textContent='▶ 자동 회전';return;}
  autoBtn.classList.add('on');autoBtn.textContent='❚❚ 정지';
  if(t>=TMAX-0.05)setT(TMIN);
  autoId=setInterval(()=>{ setT(t+0.035); if(t>=TMAX-0.001){clearInterval(autoId);autoId=null;autoBtn.classList.remove('on');autoBtn.textContent='▶ 자동 회전';} },16);
});
document.getElementById('next').addEventListener('click',()=>goto(step+1));
document.getElementById('prev').addEventListener('click',()=>goto(step-1));
document.getElementById('fs').addEventListener('click',()=>{
  document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
});
addEventListener('keydown',e=>{
  if(e.key===' '||e.key==='ArrowRight'||e.key==='PageDown'){goto(step+1);e.preventDefault();}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){goto(step-1);e.preventDefault();}
  else if(e.key==='ArrowUp'){setT(t+0.05);e.preventDefault();}
  else if(e.key==='ArrowDown'){setT(t-0.05);e.preventDefault();}
  else if(e.key>='1'&&e.key<='7'){goto(parseInt(e.key)-1);}
  else if(e.key==='r'||e.key==='R'){visited.fill(false);sweepDone=false;setT(-2);goto(0);}
  else if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}
});

const dots=document.getElementById('dots');
STEPS.forEach((_,i)=>{const d=document.createElement('i');d.addEventListener('click',()=>goto(i));dots.appendChild(d);});

setT(-2,false); renderStep(); drawGraph(); drawGT();
</script>
