<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>이차함수의 계수</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400..700;1,400..700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg-deep:#0a1420; --bg:#0e1b2b; --panel:#16283e; --panel-2:#1d3350;
  --line:rgba(214,229,245,.16); --line-strong:rgba(214,229,245,.34);
  --chalk:#eaf1f8; --chalk-soft:#b9cadd; --chalk-faint:#7d94ad;
  --amber:#f5b642; --teal:#49d1c0; --violet:#9d8cf5; --coral:#ff7d6a;
  --f-en:'STIX Two Text'; --f-kr:'Noto Sans KR';
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg-deep);
  overscroll-behavior:none;touch-action:manipulation;-webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent}
body{color:var(--chalk);font-family:var(--f-en),var(--f-kr),serif}
button,input{font:inherit;color:inherit}
.viewport{position:fixed;inset:0}
.stage{position:absolute;top:0;left:0;width:1600px;height:900px;transform-origin:0 0;
  background:var(--bg);overflow:hidden}
.sheet{height:100%;display:flex;flex-direction:column;gap:12px;padding:12px 22px 18px}

/* ── 머리말 ── */
.head{flex:0 0 72px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line);padding-bottom:10px}
.title{font-family:var(--f-kr);font-size:36px;font-weight:700;color:var(--amber);white-space:nowrap;margin-right:6px}
.modes{flex:1;display:flex;gap:10px}
.mode{flex:1 1 0;font-family:var(--f-en),var(--f-kr);font-size:32px;font-weight:600;color:var(--chalk-soft);
  background:transparent;border:2px solid var(--line-strong);border-radius:12px;padding:3px 8px;
  white-space:nowrap;cursor:pointer}
.mode.on{background:rgba(245,182,66,.12);border-color:var(--amber);color:var(--chalk)}
.mode .k{font-weight:700}
.fbtn{font-family:var(--f-kr);font-size:24px;font-weight:700;cursor:pointer;background:var(--panel-2);
  border:1.5px solid var(--line-strong);border-radius:10px;padding:10px 18px;white-space:nowrap}
.v{font-style:italic}

/* ── 본문 ── */
.body{flex:1 1 auto;min-height:0;display:flex;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px}
.gcard{position:relative;flex:1 1 auto;min-width:0;background:#fff;overflow:hidden}
.side{flex:0 0 620px;display:flex;flex-direction:column;gap:12px;min-height:0}

/* 계수 색 */
.ka{color:var(--amber)} .kb,.kp{color:var(--teal)} .kc,.kq{color:var(--violet)}
.co{color:var(--coral)}
.dim{color:var(--chalk-faint)}

/* ── 수식 ── */
.m{font-family:var(--f-en),var(--f-kr),serif;font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.45}
.frac{display:inline-flex;flex-direction:column;align-items:stretch;text-align:center;
  vertical-align:middle;margin:0 .1em;transform:translateY(-.08em);
  line-height:1.06;font-size:.8em;white-space:nowrap}
.frac>.num{padding:0 .16em .07em;border-bottom:.058em solid currentColor}
.frac>.den{padding:.09em .16em 0}

/* 식 카드 */
.eqc{flex:0 0 194px;padding:8px 22px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.eq{font-size:54px;min-height:84px;display:flex;align-items:center;overflow:hidden}
.eq>span{white-space:nowrap}
.vinfo{font-size:36px;min-height:56px;display:flex;align-items:center;gap:26px;border-top:1px solid var(--line);padding-top:6px}
.vinfo .kl{font-family:var(--f-kr);font-size:28px;color:var(--chalk-faint);margin-right:8px}
.vinfo .warn{font-family:var(--f-kr);font-size:32px;font-weight:700;color:var(--coral)}

/* 계수 줄 */
.crow{flex:1 1 0;min-height:0;padding:10px 18px 0;display:flex;flex-direction:column;border:2px solid var(--line);cursor:pointer}
.crow.sel{border-color:var(--cc);background:color-mix(in srgb,var(--cc) 7%,var(--panel))}
.ctop{display:flex;align-items:center;gap:12px;height:62px}
.clab{font-size:50px;width:96px;flex:0 0 auto;color:var(--cc);line-height:1}
.clab i{font-style:italic;font-weight:600}
.cin{width:200px;height:58px;flex:0 0 auto;font-family:var(--f-en),serif;font-size:44px;font-weight:700;text-align:center;
  color:var(--cc);background:var(--bg);border:2px solid var(--line-strong);border-radius:12px;outline:none}
.cin:focus{border-color:var(--cc);box-shadow:0 0 0 4px color-mix(in srgb,var(--cc) 25%,transparent)}
.cin.bad{border-color:var(--coral);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.sb{flex:0 0 auto;width:72px;height:58px;font-family:var(--f-en),serif;font-size:42px;font-weight:700;line-height:1;
  border-radius:12px;border:2px solid var(--violet);background:rgba(157,140,245,.14);cursor:pointer}
.sb.play{font-family:var(--f-kr),sans-serif;font-size:30px;margin-left:auto;border-color:var(--line-strong);background:transparent;color:var(--chalk-soft)}
.sb.play.on{border-color:var(--cc);color:var(--cc);background:color-mix(in srgb,var(--cc) 14%,transparent)}
.slider{position:relative;flex:1 1 auto;min-height:66px;touch-action:none;cursor:pointer}
.sin{position:absolute;left:26px;right:26px;top:0;bottom:0}
.strack{position:absolute;left:0;right:0;top:20px;height:10px;border-radius:5px;background:rgba(214,229,245,.16)}
.sfill{position:absolute;top:20px;height:10px;border-radius:5px;background:var(--cc);opacity:.75}
.tick{position:absolute;top:14px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;pointer-events:none}
.tick i{width:3px;height:22px;background:rgba(214,229,245,.35);border-radius:2px}
.tick span{font-size:26px;color:var(--chalk-faint);margin-top:4px;line-height:1}
.tick.z i{background:rgba(214,229,245,.7);width:4px}
.tick.z span{color:var(--chalk-soft)}
.sthumb{position:absolute;top:25px;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;
  background:var(--cc);box-shadow:0 0 0 7px color-mix(in srgb,var(--cc) 28%,transparent);pointer-events:none}

/* 도구 */
.tools{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tg{font-family:var(--f-kr);font-size:28px;font-weight:700;height:60px;border-radius:12px;
  border:2px solid var(--line-strong);background:transparent;color:var(--chalk-soft);cursor:pointer;white-space:nowrap}
.tg.on{border-color:var(--teal);color:var(--teal);background:rgba(73,209,192,.12)}
.tg.act{border-color:var(--violet);color:var(--chalk);background:rgba(157,140,245,.16)}
.tg:disabled{opacity:.3;cursor:default}
.tg:active,.sb:active,.mode:active,.fbtn:active{transform:scale(.97)}
button:focus{outline:none}
button:focus-visible{outline:3px solid var(--amber);outline-offset:3px}

/* ── Desmos 자리 (배율 변환 밖에 둔다 → 끌기·추적 좌표가 어긋나지 않음) ── */
#calcHost{position:fixed;left:0;top:0;width:10px;height:10px;overflow:hidden;border-radius:16px;background:#fff;z-index:5}
#calc{position:absolute;inset:0}
#legend{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none;z-index:10;
  display:flex;flex-direction:column;gap:4px;padding:10px 14px}
#legend:empty{display:none}
.lg{display:flex;align-items:center;gap:12px;font-size:34px;color:#1b2a3a;background:rgba(255,255,255,.86);
  border-radius:10px;padding:0 12px;width:max-content}
.lg svg{width:54px;height:14px;flex:0 0 auto}
#noCalc{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;
  font-family:var(--f-kr);color:#1b2a3a;text-align:center;transform-origin:50% 50%}
#noCalc b{font-size:34px} #noCalc span{font-size:24px;color:#5a6b7d}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="viewport"><div class="stage" id="stage"><div class="sheet">

  <header class="head">
    <div class="title">이차함수의 계수</div>
    <nav class="modes" id="modes">
      <button class="mode on m" data-m="0"><i class="v">y</i> = <i class="v k ka">a</i><i class="v">x</i>² + <i class="v k kb">b</i><i class="v">x</i> + <i class="v k kc">c</i></button>
      <button class="mode m" data-m="1"><i class="v">y</i> = <i class="v k ka">a</i>(<i class="v">x</i> − <i class="v k kp">p</i>)² + <i class="v k kq">q</i></button>
    </nav>
    <button class="fbtn" id="resetBtn">초기화</button>
    <button class="fbtn" id="fsBtn">전체화면</button>
  </header>

  <main class="body">
    <div class="card gcard" id="gcard"></div>
    <aside class="side">
      <div class="card eqc">
        <div class="eq m" id="eq"></div>
        <div class="vinfo m" id="vinfo"></div>
      </div>
      <div class="card crow" id="row0"></div>
      <div class="card crow" id="row1"></div>
      <div class="card crow" id="row2"></div>
      <div class="tools">
        <button class="tg on" id="vxBtn">꼭짓점 · 대칭축</button>
        <button class="tg" id="trBtn">꼭짓점 자취</button>
        <button class="tg act" id="keepBtn">잔상 남기기</button>
        <button class="tg" id="clrBtn">잔상 지우기</button>
      </div>
    </aside>
  </main>
</div></div></div>

<div id="calcHost">
  <div id="calc"></div>
  <div id="legend"></div>
  <div id="noCalc"><b>그래프(Desmos)를 불러오지 못했습니다</b><span>인터넷 연결을 확인한 뒤 새로고침 하세요</span></div>
</div>

<script>
'use strict';
/* ═══ 1. 스테이지 스케일링 + Desmos 자리 맞추기 ═══ */
const STAGE_W=1600, STAGE_H=900, stage=document.getElementById('stage');
const host=document.getElementById('calcHost'), gcard=document.getElementById('gcard');
let SCALE=1;
function fitStage(){
  const vv=window.visualViewport;
  const w=vv?vv.width:innerWidth, h=vv?vv.height:innerHeight;
  const s=Math.min(w/STAGE_W,h/STAGE_H); SCALE=s;
  stage.style.transform=`translate(${Math.round((w-STAGE_W*s)/2)}px,${Math.round((h-STAGE_H*s)/2)}px) scale(${s})`;
  placeHost();
}
function placeHost(){
  const r=gcard.getBoundingClientRect();
  Object.assign(host.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px',borderRadius:16*SCALE+'px'});
  document.getElementById('legend').style.transform=`scale(${SCALE})`;
  document.getElementById('noCalc').style.transform=`scale(${SCALE})`;
  if(calc){ calc.updateSettings({fontSize:Math.round(DESMOS_FONT*SCALE)}); calc.resize&&calc.resize(); }
}
const fitSoon=()=>[0,60,300,700].forEach(t=>setTimeout(fitStage,t));
addEventListener('resize',fitStage); addEventListener('orientationchange',fitSoon);
if(window.visualViewport) visualViewport.addEventListener('resize',fitStage);
document.addEventListener('fullscreenchange',fitSoon);

/* ═══ 2. 수식 조각 ═══ */
const F=(a,b)=>`<span class="frac"><span class="num">${a}</span><span class="den">${b}</span></span>`;
const V=s=>`<i class="v">${s}</i>`;
const K=(k,s)=>`<span class="k${k}">${s}</span>`;
const MINUS='−';
const clean=v=>{ const r=Math.round(v*1e12)/1e12; return Object.is(r,-0)?0:r; };
/* 소수 둘째 자리로 끝나면 소수, 아니면 분모 60 이하 분수 */
function asFrac(v){
  if(Math.abs(v*100-Math.round(v*100))<1e-6) return null;
  for(let d=2;d<=60;d++){ const n=Math.round(v*d); if(Math.abs(v*d-n)<1e-6) return [n,d]; }
  return null;
}
function decStr(a){ return String(Math.round(a*1000)/1000); }
/* 절댓값 표시 (HTML / 입력칸 글자) */
function absHTML(v){ const a=Math.abs(v), f=asFrac(a); return f?F(f[0],f[1]):decStr(a); }
function absTXT(v){ const a=Math.abs(v), f=asFrac(a); return f?`${f[0]}/${f[1]}`:decStr(a); }
const sHTML=v=>(v<0?MINUS:'')+absHTML(v);
const sTXT=v=>(clean(v)<0?MINUS:'')+absTXT(v);
const isZ=v=>Math.abs(v)<1e-9, isOne=v=>Math.abs(Math.abs(v)-1)<1e-9;

/* ═══ 3. 상태 ═══ */
const RANGE={a:[-4,4,0.1,1], b:[-8,8,0.5,2], c:[-8,8,0.5,2], p:[-8,8,0.5,2], q:[-8,8,0.5,2]};  /* min,max,step,눈금글자간격 */
const CVAR={a:'--amber',b:'--teal',c:'--violet',p:'--teal',q:'--violet'};
const KEYS=[['a','b','c'],['a','p','q']];
const DEF={a:1,b:0,c:0,p:0,q:0};
const S={mode:0, v:{...DEF}, sel:0, vx:true, tr:false, ghosts:[], play:null};

/* 형태 전환 : 같은 그래프를 유지하도록 계수를 바꾼다 */
function toStandard(){ const {a,b,c}=S.v;
  if(isZ(a)){ S.v.p=0; S.v.q=c; return; }
  S.v.p=clean(-b/(2*a)); S.v.q=clean(c-b*b/(4*a)); }
function toGeneral(){ const {a,p,q}=S.v;
  S.v.b=clean(-2*a*p); S.v.c=clean(a*p*p+q); }
function vertex(){
  const v=S.v;
  if(S.mode===1) return [v.p,v.q];
  if(isZ(v.a)) return null;
  return [clean(-v.b/(2*v.a)), clean(v.c-v.b*v.b/(4*v.a))];
}

/* ═══ 4. 식 표시 ═══ */
const X=V('x'), Y=V('y');
/* 첫 항 계수 (a) : 1 → 생략, −1 → − */
function leadHTML(k,v){ if(isOne(v)) return v<0?K(k,MINUS):''; return K(k,sHTML(v)); }
/* 뒤 항은 ± |v| 를 부호까지 계수 색으로 */
function eqHTML(vals,mode){
  const {a}=vals;
  let s=`${Y} = `;
  if(mode===0){
    const {b,c}=vals; let body='';
    if(!isZ(a)) body+=leadHTML('a',a)+X+'²';
    if(!isZ(b)) body+= body? ` ${K('b',(b<0?MINUS:'+')+' '+(isOne(b)?'':absHTML(b)))}${X}` : K('b',isOne(b)?(b<0?MINUS:''):sHTML(b))+X;
    if(!isZ(c)) body+= body? ` ${K('c',(c<0?MINUS:'+')+' '+absHTML(c))}` : K('c',sHTML(c));
    return s+(body||'0');
  }
  const {p,q}=vals; let body='';
  if(!isZ(a)){
    const sq=isZ(p)?`${X}²`:`(${X} ${p>0?MINUS:'+'} ${K('p',absHTML(p))})²`;
    body+=leadHTML('a',a)+sq;
  }
  if(!isZ(q)) body+= body? ` ${K('q',(q<0?MINUS:'+')+' '+absHTML(q))}` : K('q',sHTML(q));
  return s+(body||'0');
}
const eqEl=document.getElementById('eq'), vinfoEl=document.getElementById('vinfo');
function paintEq(){
  eqEl.innerHTML=`<span>${eqHTML(S.v,S.mode)}</span>`;
  let fs=54; eqEl.style.fontSize=fs+'px';
  while(eqEl.scrollWidth>eqEl.clientWidth+1&&fs>38){ fs-=2; eqEl.style.fontSize=fs+'px'; }
  if(isZ(S.v.a)){
    vinfoEl.innerHTML=`<span class="warn">${V('a')} = 0 이면 이차함수가 아닙니다</span>`; vinfoEl.style.visibility='visible'; return;
  }
  const [h,k]=vertex();
  vinfoEl.innerHTML=`<span><span class="kl">꼭짓점</span>(${sHTML(h)}, ${sHTML(k)})</span>`+
    `<span><span class="kl">대칭축</span>${X} = ${sHTML(h)}</span>`;
  vinfoEl.style.visibility=S.vx?'visible':'hidden';
}

/* ═══ 5. 계수 줄 (슬라이더 + 입력 + ± + 움직이기) ═══ */
const rows=[0,1,2].map(i=>document.getElementById('row'+i));
function snap(v,st){ return clean(Math.round(v/st)*st); }
function parseVal(s){
  s=String(s).replace(/[−–—]/g,'-').replace(/\s+/g,'');
  let v;
  const m=s.match(/^(-?)(\d*\.?\d+)\/(\d*\.?\d+)$/);
  if(m) v=(m[1]?-1:1)*(+m[2])/(+m[3]); else if(/^-?(\d+\.?\d*|\.\d+)$/.test(s)) v=+s; else return null;
  if(!isFinite(v)||Math.abs(v)>100) return null;
  return clean(v);
}
function buildRows(){
  KEYS[S.mode].forEach((k,i)=>{
    const [mn,mx,,lab]=RANGE[k], el=rows[i];
    el.dataset.k=k; el.style.setProperty('--cc',`var(${CVAR[k]})`);
    let ticks='';
    for(let t=mn;t<=mx+1e-9;t+=1){
      const pc=(t-mn)/(mx-mn)*100, show=Math.abs(t%lab)<1e-9;
      ticks+=`<div class="tick${t===0?' z':''}" style="left:${pc}%"><i style="${show?'':'height:12px;opacity:.6'}"></i>${show?`<span>${t<0?MINUS+(-t):t}</span>`:''}</div>`;
    }
    el.innerHTML=`<div class="ctop">
        <span class="clab m"><i>${k}</i> =</span>
        <input class="cin" inputmode="decimal" autocomplete="off" spellcheck="false">
        <button class="sb" data-d="-1">${MINUS}</button><button class="sb" data-d="1">+</button>
        <button class="sb play" title="움직이기">▶</button>
      </div>
      <div class="slider"><div class="sin"><div class="strack"></div><div class="sfill"></div>${ticks}<div class="sthumb"></div></div></div>`;
    const inp=el.querySelector('.cin'), sl=el.querySelector('.slider'), sin=sl.firstChild;
    el.querySelectorAll('.sb[data-d]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); select(i); stopPlay();
      const st=RANGE[k][2]; setVal(k,snap(S.v[k]+st*(+b.dataset.d),st)); });
    el.querySelector('.play').onclick=e=>{ e.stopPropagation(); select(i); togglePlay(k); };
    inp.onfocus=()=>{ select(i); stopPlay(); setTimeout(()=>inp.select(),0); };
    inp.onkeydown=e=>{ if(e.key==='Enter'){ inp.blur(); } if(e.key==='Escape'){ inp.value=sTXT(S.v[k]); inp.blur(); } e.stopPropagation(); };
    inp.onchange=()=>{ const v=parseVal(inp.value);
      if(v===null){ inp.classList.remove('bad'); void inp.offsetWidth; inp.classList.add('bad'); inp.value=sTXT(S.v[k]); return; }
      inp.classList.remove('bad'); setVal(k,v); };
    let down=false;
    const pick=e=>{ const r=sin.getBoundingClientRect(), f=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
      setVal(k,snap(mn+f*(mx-mn),RANGE[k][2])); };
    sl.addEventListener('pointerdown',e=>{ down=true; sl.setPointerCapture(e.pointerId); select(i); stopPlay(); pick(e); });
    sl.addEventListener('pointermove',e=>{ if(down) pick(e); });
    sl.addEventListener('pointerup',()=>down=false);
    sl.addEventListener('pointercancel',()=>down=false);
    el.onclick=()=>select(i);
  });
}
function paintRows(){
  KEYS[S.mode].forEach((k,i)=>{
    const el=rows[i], [mn,mx]=RANGE[k], v=S.v[k];
    el.classList.toggle('sel',i===S.sel);
    const inp=el.querySelector('.cin'); if(document.activeElement!==inp) inp.value=sTXT(v);
    const pc=(Math.max(mn,Math.min(mx,v))-mn)/(mx-mn)*100, z=(0-mn)/(mx-mn)*100;
    el.querySelector('.sthumb').style.left=pc+'%';
    const fl=el.querySelector('.sfill'); fl.style.left=Math.min(pc,z)+'%'; fl.style.width=Math.abs(pc-z)+'%';
    el.querySelector('.play').classList.toggle('on',S.play&&S.play.k===k);
    el.querySelector('.play').textContent=S.play&&S.play.k===k?'■':'▶';
  });
}
function select(i){ if(S.sel!==i){ S.sel=i; paintRows(); } }
function setVal(k,v){ S.v[k]=clean(v); update(); }

/* 움직이기 : 누른 계수만 범위 안에서 왕복 (다시 누르면 멈춤) */
let raf=0;
function togglePlay(k){
  if(S.play&&S.play.k===k){ stopPlay(); paintRows(); return; }
  const [mn,mx]=RANGE[k], v=Math.max(mn,Math.min(mx,S.v[k]));
  S.play={k,acc:v,dir:v>=mx-1e-9?-1:1,last:performance.now()};
  if(!raf) raf=requestAnimationFrame(tick);
  paintRows();
}
function stopPlay(){ S.play=null; if(raf){ cancelAnimationFrame(raf); raf=0; } }
function tick(now){
  const P=S.play; if(!P){ raf=0; return; }
  const [mn,mx]=RANGE[P.k], dt=Math.min(.05,(now-P.last)/1000); P.last=now;
  P.acc+=P.dir*(mx-mn)/5*dt;                 /* 범위 전체를 5초에 */
  if(P.acc>=mx){ P.acc=mx; P.dir=-1; } if(P.acc<=mn){ P.acc=mn; P.dir=1; }
  const nv=snap(P.acc,0.1);
  if(nv!==S.v[P.k]){ S.v[P.k]=nv; update(); }
  raf=requestAnimationFrame(tick);
}

/* ═══ 6. Desmos ═══ */
const DESMOS_KEY='dcb31709b452b1cf9dc26972add0fda6';     /* Desmos 공개 데모 키 — 개인 키로 바꿔 써도 됨 */
const DESMOS_FONT=28;
const COLOR={curve:'#2d70b3', vx:'#c74440', tr:'#6042a6'};
const GHOSTC=['#6b7785','#c08a1e','#2f9e6b'];
let calc=null;
const num=v=>String(clean(v));
function initCalc(){
  if(!window.Desmos){ document.getElementById('noCalc').style.display='flex'; return; }
  calc=Desmos.GraphingCalculator(document.getElementById('calc'),{
    expressions:false, keypad:false, settingsMenu:false, zoomButtons:true, border:false,
    projectorMode:false, fontSize:Math.round(DESMOS_FONT*SCALE), lockViewport:false,
    showResetButtonOnGraphpaper:false
  });
  resetView();
  update();
}
function resetView(){
  if(!calc) return;
  const r=host.getBoundingClientRect(), asp=r.height/r.width||.84;
  calc.setMathBounds({left:-8,right:8,bottom:-6,top:-6+16*asp});
}
function syncDesmos(){
  if(!calc) return;
  const v=S.v, std=S.mode===1;
  ['a','b','c','p','q'].forEach(k=>calc.setExpression({id:'v'+k,latex:`${k}=${num(v[k])}`,secret:true}));
  calc.setExpression({id:'f',latex:std?'y=a\\left(x-p\\right)^{2}+q':'y=ax^{2}+bx+c',color:COLOR.curve,lineWidth:3.5});
  const vxOn=S.vx&&!isZ(v.a);
  calc.setExpression({id:'vx',latex:std?'\\left(p,q\\right)':'\\left(\\frac{-b}{2a},c-\\frac{b^{2}}{4a}\\right)',
    color:COLOR.vx,pointSize:14,showLabel:true,label:'',labelSize:'1.3',hidden:!vxOn});
  calc.setExpression({id:'ax',latex:std?'x=p':'x=\\frac{-b}{2a}',color:COLOR.vx,lineStyle:Desmos.Styles.DASHED,lineWidth:2,hidden:!vxOn});
  calc.setExpression({id:'tr',latex:'y=-ax^{2}+c',color:COLOR.tr,lineStyle:Desmos.Styles.DASHED,lineWidth:2.5,hidden:!(S.tr&&!std&&!isZ(v.a))});
}
function ghostLatex(vals,mode){
  return mode===1?`y=(${num(vals.a)})\\left(x-(${num(vals.p)})\\right)^{2}+(${num(vals.q)})`
                 :`y=(${num(vals.a)})x^{2}+(${num(vals.b)})x+(${num(vals.c)})`;
}
function syncGhosts(){
  const lg=document.getElementById('legend');
  lg.innerHTML=S.ghosts.map((g,i)=>`<div class="lg m"><svg viewBox="0 0 54 14"><line x1="2" y1="7" x2="52" y2="7" stroke="${GHOSTC[i]}" stroke-width="3.5" stroke-dasharray="11 6" stroke-linecap="round"/></svg><span>${eqHTML(g.vals,g.mode).replace(/class="k[a-z]"/g,'')}</span></div>`).join('');
  if(!calc) return;
  calc.removeExpressions([0,1,2].map(i=>({id:'g'+i})));
  S.ghosts.forEach((g,i)=>calc.setExpression({id:'g'+i,latex:ghostLatex(g.vals,g.mode),color:GHOSTC[i],lineStyle:Desmos.Styles.DASHED,lineWidth:2.5}));
}
function loadDesmos(){
  const sc=document.createElement('script');
  sc.src=`https://www.desmos.com/api/v1.11/calculator.js?apiKey=${DESMOS_KEY}`;
  sc.onload=initCalc;
  sc.onerror=()=>{ document.getElementById('noCalc').style.display='flex'; };
  document.head.appendChild(sc);
}

/* ═══ 7. 갱신 · 버튼 ═══ */
function update(){ paintEq(); paintRows(); syncDesmos(); }
const vxBtn=document.getElementById('vxBtn'), trBtn=document.getElementById('trBtn');
function paintTools(){
  vxBtn.classList.toggle('on',S.vx);
  trBtn.disabled=S.mode===1; trBtn.classList.toggle('on',S.tr&&S.mode===0);
}
vxBtn.onclick=()=>{ S.vx=!S.vx; paintTools(); update(); };
trBtn.onclick=()=>{ if(S.mode===1) return; S.tr=!S.tr; paintTools(); update(); };
document.getElementById('keepBtn').onclick=()=>{
  S.ghosts.push({vals:{...S.v},mode:S.mode}); if(S.ghosts.length>3) S.ghosts.shift(); syncGhosts(); };
document.getElementById('clrBtn').onclick=()=>{ S.ghosts=[]; syncGhosts(); };

function setMode(m){
  if(m===S.mode) return;
  stopPlay();
  if(m===1) toStandard(); else toGeneral();
  S.mode=m;
  document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('on',+b.dataset.m===m));
  buildRows(); paintTools(); update();
}
document.getElementById('modes').onclick=e=>{ const b=e.target.closest('[data-m]'); if(b) setMode(+b.dataset.m); };

/* 초기화 : 계수 처음 값, 잔상 지움, 보기 처음대로 (형태는 그대로) */
function resetAll(){
  stopPlay();
  if(document.activeElement&&document.activeElement.blur) document.activeElement.blur();
  S.v={...DEF}; S.sel=0; S.vx=true; S.tr=false; S.ghosts=[];
  paintTools(); syncGhosts(); update(); resetView();
}
document.getElementById('resetBtn').onclick=resetAll;

const fsBtn=document.getElementById('fsBtn');
fsBtn.onclick=()=>{
  const d=document, el=d.documentElement;
  if(d.fullscreenElement||d.webkitFullscreenElement) (d.exitFullscreen||d.webkitExitFullscreen).call(d);
  else { const r=el.requestFullscreen||el.webkitRequestFullscreen; if(r) Promise.resolve(r.call(el)).catch(()=>{}); }
};
const syncFs=()=>fsBtn.textContent=(document.fullscreenElement||document.webkitFullscreenElement)?'창으로':'전체화면';
document.addEventListener('fullscreenchange',syncFs); document.addEventListener('webkitfullscreenchange',syncFs);

/* 키보드(리모컨) : 1·2 형태, ↑↓ 계수 고르기, ←→ 값 바꾸기, Space 움직이기, Enter 잔상, R 초기화, F 전체화면 */
addEventListener('keydown',e=>{
  if(e.target.closest&&(e.target.closest('#calcHost')||e.target.tagName==='INPUT')) return;
  const k=e.key, key=KEYS[S.mode][S.sel];
  if(k==='1'||k==='2') setMode(+k-1);
  else if(k==='ArrowUp'||k==='ArrowDown'){ e.preventDefault(); S.sel=(S.sel+(k==='ArrowUp'?2:1))%3; paintRows(); }
  else if(k==='ArrowLeft'||k==='ArrowRight'){ e.preventDefault(); stopPlay();
    const st=RANGE[key][2]; setVal(key,snap(S.v[key]+(k==='ArrowRight'?st:-st),st)); }
  else if(k===' '){ e.preventDefault(); togglePlay(key); }
  else if(k==='Enter'){ e.preventDefault(); document.getElementById('keepBtn').click(); }
  else if(k==='r'||k==='R') resetAll();
  else if(k==='f'||k==='F') fsBtn.click();
});

/* ═══ 시작 ═══ */
buildRows(); paintTools(); update();
fitSoon();
loadDesmos();
new ResizeObserver(placeHost).observe(gcard);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ paintEq(); placeHost(); });
</script>
