<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>14. 절댓값 점화식과 부분합</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400..700;1,400..700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============ 2. 색 토큰 (칠판 팔레트) ============ */
:root{
  --bg-deep:#0a1420;  --bg:#0e1b2b;  --panel:#16283e;  --panel-2:#1d3350;
  --line:rgba(214,229,245,.18);  --line-strong:rgba(214,229,245,.38);
  --chalk:#eaf1f8;  --chalk-soft:#b9cadd;  --chalk-faint:#7d94ad;
  --amber:#f5b642;
  --coral:#ff7d6a;
  --teal:#49d1c0;
  --violet:#9d8cf5;
  --laser:#ff2d2d;

  --f-en:'STIX Two Text';  --f-kr:'Noto Sans KR';

  /* 4. 글자 크기 — 스테이지 1600×900 좌표 */
  --ls:42px;      /* 좌측 본문 수식 */
  --ls-sm:33px;   /* 보조 설명 */
  --ls-q:35px;    /* 문제 원문 */
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg-deep)}
body{font-family:var(--f-en),var(--f-kr),system-ui,sans-serif;color:var(--chalk);
     -webkit-user-select:none;user-select:none;touch-action:manipulation}

.viewport{position:fixed;inset:0;overflow:hidden}
.stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;
       background:radial-gradient(1200px 760px at 74% 6%, #15263c 0%, var(--bg) 58%, var(--bg-deep) 100%)}
.sheet{width:100%;height:100%;padding:14px 34px 16px;display:flex;flex-direction:column;gap:12px}
.topline{flex:0 0 2px;background:linear-gradient(90deg,var(--amber),rgba(245,182,66,0) 62%);border-radius:2px}

#body2col{flex:1 1 auto;min-height:0;display:flex;gap:16px}
#leftCol{flex:1 1 auto;min-width:0;overflow-y:auto;padding-right:10px;
         display:flex;flex-direction:column;gap:12px}
#leftCol::-webkit-scrollbar{width:9px}
#leftCol::-webkit-scrollbar-thumb{background:#33486b;border-radius:5px}
#leftCol::-webkit-scrollbar-track{background:transparent}
#rightCol{flex:0 0 720px;display:flex;flex-direction:column;gap:7px}

/* ============ 3. 조판 ============ */
.m{font-family:var(--f-en),var(--f-kr),serif;font-variant-numeric:tabular-nums;
   white-space:nowrap;line-height:1.15;display:inline-block}
i,.v,.var{font-style:italic;font-family:var(--f-en),serif}
i.fn{margin-right:.09em}
sub{font-size:.60em;vertical-align:-.27em;font-style:normal;font-family:var(--f-en),serif}
sub i{font-size:1em}
.ind{display:block;padding-left:1.5em}

.frac{display:inline-flex;flex-direction:column;align-items:stretch;text-align:center;
      vertical-align:middle;margin:0 .22em;transform:translateY(-.08em);
      line-height:1.06;font-size:.86em}
.frac>.num{padding:0 .22em .07em;border-bottom:.058em solid currentColor}
.frac>.den{padding:.09em .22em 0}

.sig{position:relative;display:inline-block;font-size:1.35em;line-height:.92;
     vertical-align:-.20em;padding:0 .42em;font-style:normal;font-weight:600}
.sig .hi,.sig .lo{position:absolute;left:50%;transform:translateX(-50%);font-size:.40em;
     font-style:italic;font-weight:500;white-space:nowrap}
.sig .hi{top:-.46em} .sig .lo{bottom:-.42em}

/* ============ 좌측 : 문제 + 단계 ============ */
.qcard{flex:none;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--amber);
       border-radius:14px;padding:14px 22px;font-size:var(--ls-q);line-height:1.62;
       color:var(--chalk-soft);word-break:keep-all}
.qcard .qlab{display:block;font-size:24px;color:var(--amber);font-weight:700;
             font-family:var(--f-kr);margin-bottom:5px}
.qcard .key{color:var(--chalk);font-weight:600}

#steps{flex:none;display:flex;flex-direction:column;gap:12px}
.stepCard{background:var(--panel);border:1px solid var(--line);border-radius:14px;
          padding:14px 22px 16px;font-size:var(--ls);line-height:1.42;color:var(--chalk);
          opacity:.16;filter:blur(3px);transition:.3s;flex:none;word-break:keep-all}
.stepCard.on{opacity:1;filter:none}
.stepCard.live{border-color:var(--amber);box-shadow:0 0 0 2px rgba(245,182,66,.28),0 0 26px rgba(245,182,66,.16)}
.stepCard .hd{display:flex;align-items:center;gap:13px;margin-bottom:8px}
.stepCard .no{flex:0 0 50px;width:50px;height:50px;border-radius:50%;display:flex;
              align-items:center;justify-content:center;font-size:25px;font-weight:700;
              font-family:var(--f-kr);background:rgba(214,229,245,.10);color:var(--chalk-faint)}
.stepCard.on .no{background:rgba(73,209,192,.16);color:var(--teal)}
.stepCard.live .no{background:var(--amber);color:#0a1420}
.stepCard .ti{font-size:30px;font-weight:700;font-family:var(--f-kr);color:var(--chalk-soft)}
.stepCard.live .ti{color:var(--amber)}
.stepCard b{color:var(--amber);font-weight:600}
.stepCard .sm{display:block;font-size:var(--ls-sm);color:var(--chalk-soft);margin-top:6px}

/* 표 — 글자 확대 */
#tbl{border:1px solid var(--line);border-radius:13px;overflow:hidden;background:var(--panel-2);margin-top:12px}
#tbl .row{display:grid;grid-template-columns:90px 1fr 1fr 1.65fr 132px;align-items:center;height:70px;
          font-size:32px;border-top:1px solid rgba(214,229,245,.09);text-align:center}
#tbl .row.h{height:48px;font-size:23px;color:var(--chalk-faint);border-top:none;
            background:rgba(214,229,245,.06);font-family:var(--f-kr)}
#tbl .row .c1{font-weight:700;color:var(--amber);font-size:34px}
#tbl .row.wait{opacity:.32}
#tbl .row.done{background:rgba(73,209,192,.11)}
#tbl .row.bad{background:rgba(255,125,106,.11)}
#tbl .row .mm{font-weight:700;font-size:38px;font-variant-numeric:tabular-nums}
#tbl .row.done .mm{color:var(--teal)} #tbl .row.bad .mm{color:var(--coral)}
#tbl .row .need{font-size:27px}
#tbl .foot{height:72px;display:flex;align-items:center;justify-content:center;gap:14px;
           border-top:1px solid var(--line);background:rgba(245,182,66,.10);
           font-size:32px;font-weight:700;color:var(--chalk-faint);font-family:var(--f-kr)}
#tbl .foot .val{color:var(--amber);font-size:40px;font-family:var(--f-en);min-width:266px;text-align:center}
#note14{opacity:0;transition:.4s;font-size:28px;color:var(--coral);margin-top:9px;font-family:var(--f-kr)}

/* ============ 우측 ============ */
/* 상시 고정 : 점화식 */
#recur{flex:0 0 76px;background:linear-gradient(90deg,rgba(157,140,245,.16),rgba(157,140,245,.05));
       border:1px solid rgba(157,140,245,.42);border-radius:14px;
       display:flex;align-items:center;gap:14px;padding:0 16px;overflow:hidden}
#recur .rl{flex:none;font-family:var(--f-kr);font-size:22px;font-weight:700;color:var(--violet);
           border:1px solid rgba(157,140,245,.45);border-radius:9px;padding:3px 11px}
#recur .rf{flex:none;font-size:40px;color:var(--chalk);font-weight:600}
#recur .rn{flex:1 1 auto;min-width:0;font-family:var(--f-kr);font-size:22px;color:var(--chalk-faint);
           line-height:1.3;text-align:right;word-break:keep-all}
#recur .rn b{color:var(--violet)}

.sec{background:var(--panel);border:1px solid var(--line);border-radius:14px;
     padding:12px 15px;position:relative;flex:none;overflow:hidden;
     opacity:.13;filter:blur(2.5px);pointer-events:none;transition:opacity .32s,filter .32s}
.sec.live{opacity:1;filter:none;pointer-events:auto}

#ctl{flex:0 0 74px;display:flex;align-items:center;gap:11px}
#strip{flex:0 0 220px;display:flex;align-items:center}
#osc{flex:0 0 242px}
#read{flex:0 0 148px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px}

.btn{white-space:nowrap;background:rgba(214,229,245,.09);border:1px solid var(--line);border-radius:11px;
     color:var(--chalk);font-family:var(--f-kr);font-size:25px;padding:8px 17px;cursor:pointer;transition:.15s}
.btn:hover{background:rgba(214,229,245,.18)}
.btn:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.btn.pri{background:var(--teal);color:#0a1420;border-color:var(--teal);font-weight:700}
.btn.sm{padding:6px 14px;font-size:22px}
.btn.rd{width:48px;height:48px;padding:0;font-size:30px;line-height:1;display:flex;
        align-items:center;justify-content:center;font-family:var(--f-en);flex:none}
.btn.on{background:var(--coral);color:#0a1420;border-color:var(--coral);font-weight:700}

.a1lab{font-size:30px;white-space:nowrap;color:var(--chalk-soft)}
.a1val{font-size:42px;font-weight:700;color:var(--amber);min-width:76px;text-align:center;
       font-variant-numeric:tabular-nums}
.presets{display:flex;gap:7px;margin-left:auto}
.pre{background:rgba(214,229,245,.08);border:1px solid var(--line);border-radius:10px;padding:7px 15px;
     font-size:25px;cursor:pointer;color:var(--chalk-faint);font-variant-numeric:tabular-nums}
.pre.on{background:var(--amber);color:#0a1420;border-color:var(--amber);font-weight:700}

/* 감소 구간 카드 */
#cards{display:grid;gap:7px;grid-auto-rows:88px;width:100%}
.card{border-radius:11px;background:rgba(214,229,245,.06);border:1px solid var(--line);
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      cursor:pointer;transition:.18s;min-width:0;overflow:hidden;padding:0 2px}
.card .n{font-size:24px;line-height:1.1;color:var(--chalk-faint)}
.card .v{font-size:34px;line-height:1.08;font-weight:700;font-variant-numeric:tabular-nums}
.card .s{font-size:22px;line-height:1.1;color:var(--teal);font-variant-numeric:tabular-nums}
.card.zero .v{color:var(--violet)}
.card.neg .v{color:var(--coral)}
.card.sel{border-color:var(--amber);background:rgba(245,182,66,.17);box-shadow:0 0 0 2px rgba(245,182,66,.32)}
.card.ghost{border-style:dashed;border-color:#3a4f72;background:transparent;cursor:default}
.card.ghost .n{color:#55708f}
.card.next{border-style:dashed;border-color:var(--teal);background:rgba(73,209,192,.11);
           animation:pulse 1.3s infinite}
.card.next .v{color:var(--teal);font-size:34px}
.card.next .n{color:var(--teal)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(73,209,192,.42)}50%{box-shadow:0 0 0 10px rgba(73,209,192,0)}}

/* 진동 구간 */
#chips{display:flex;align-items:center;gap:7px;margin-top:2px;height:64px}
.chip{width:70px;height:60px;border-radius:11px;display:flex;flex-direction:column;align-items:center;
      justify-content:center;background:rgba(214,229,245,.06);border:1px solid var(--line);
      flex:none;overflow:hidden}
.chip .cv{font-size:32px;line-height:1.08;font-weight:700;font-variant-numeric:tabular-nums}
.chip .cn{font-size:21px;line-height:1.1;color:var(--chalk-faint);white-space:nowrap}
.chip.neg{border-color:rgba(255,125,106,.5);background:rgba(255,125,106,.14)}
.chip.neg .cv{color:var(--coral)}
.chip.zero .cv{color:var(--violet)}
.chip.cur{border-color:var(--amber);background:rgba(245,182,66,.18);width:214px;height:64px}
.chip.cur .cv{color:var(--amber)}
.dots3{color:var(--chalk-faint);font-size:32px;padding:0 3px}
.oscnote{font-size:24px;color:var(--chalk-faint);margin-top:5px;line-height:1.32;
         font-family:var(--f-kr);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oscnote b{color:var(--coral);font-family:var(--f-en)}

#trackwrap{margin-top:7px;display:flex;align-items:center;gap:11px}
#track{position:relative;flex:1 1 auto;min-width:0;height:46px;border-radius:13px;
       background:rgba(214,229,245,.06);border:1px solid var(--line);cursor:pointer;touch-action:none}
#fill{position:absolute;left:0;top:0;bottom:0;border-radius:12px;
      background:linear-gradient(90deg,rgba(73,209,192,.16),rgba(73,209,192,.42))}
#handle{position:absolute;top:-9px;width:76px;height:62px;border-radius:12px;background:var(--teal);
        border:2px solid #0a1420;transform:translateX(-38px);display:flex;align-items:center;
        justify-content:center;color:#0a1420;font-weight:700;font-size:30px;cursor:grab;
        box-shadow:0 3px 13px rgba(0,0,0,.5);font-variant-numeric:tabular-nums}
#handle.hitt{background:var(--amber)}
.trkend{font-size:25px;color:var(--chalk-faint);white-space:nowrap;flex:none;
        min-width:108px;text-align:center}
.krow{display:flex;align-items:center;gap:10px;margin-top:7px;font-size:26px;color:var(--chalk-faint)}
.krow .kv{background:rgba(214,229,245,.06);border:1px solid var(--line);border-radius:10px;padding:3px 14px}
.krow .kv b{color:var(--chalk);font-size:33px;font-variant-numeric:tabular-nums;
            min-width:56px;display:inline-block;text-align:center}

/* 판정 */
#eq{font-size:40px;display:flex;align-items:center;gap:11px;white-space:nowrap;
    font-variant-numeric:tabular-nums}
#eq .op{color:var(--chalk-faint);font-size:32px}
#eq .res{font-weight:700;font-size:52px;min-width:118px;text-align:center}
#verdict{font-size:27px;line-height:1.32;color:var(--chalk-faint);text-align:center;
         font-family:var(--f-kr);min-height:36px;white-space:nowrap}
#read.good{background:rgba(73,209,192,.13);border-color:rgba(73,209,192,.5)}
#read.good #eq .res{color:var(--teal)}
#read.bad #eq .res{color:var(--coral)}
#read.warn{background:rgba(245,182,66,.12);border-color:rgba(245,182,66,.5)}
#read.warn #eq .res{color:var(--amber)}
#read .hint{font-size:27px;color:var(--chalk-faint);font-family:var(--f-kr)}

/* ============ 발판 ============ */
.app-foot{flex:0 0 54px;display:flex;align-items:center;gap:13px}
.app-foot .no{font-weight:700;font-size:26px;color:#0a1420;background:var(--amber);
              border-radius:10px;padding:3px 15px;font-family:var(--f-kr)}
.app-foot .ttl{font-size:24px;font-family:var(--f-kr);color:var(--chalk-soft);letter-spacing:-.2px}
#ansBadge{font-size:26px;font-weight:700;color:#0a1420;background:var(--teal);border-radius:12px;
          padding:4px 22px;font-family:var(--f-kr);opacity:0;transform:translateY(6px);transition:.4s}
#ansBadge.on{opacity:1;transform:none}
.stepdots{display:flex;gap:8px;margin-left:auto;margin-right:6px}
.sd{width:12px;height:12px;border-radius:50%;background:#33486b}
.sd.on{background:var(--teal)}
.sd.live{background:var(--amber);transform:scale(1.25)}

.toast{position:absolute;left:50%;top:772px;transform:translate(-50%,-14px);background:var(--teal);
       color:#0a1420;font-weight:700;font-size:30px;padding:13px 34px;border-radius:14px;opacity:0;
       transition:.35s;pointer-events:none;z-index:20;font-family:var(--f-kr);
       box-shadow:0 6px 26px rgba(0,0,0,.55)}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ============ 7. 레이저 포인터 ============ */
#laser{position:fixed;inset:0;pointer-events:none;z-index:9999;display:none}
body.laser-on #laser{display:block}
body.laser-on.has-mouse{cursor:none}
body.laser-on.has-mouse *{cursor:none !important}
.ldot{position:absolute;border-radius:50%;background:var(--laser);transform:translate(-50%,-50%)}
.ldot.head{width:20px;height:20px;box-shadow:0 0 14px 6px rgba(255,45,45,.62),0 0 34px 16px rgba(255,45,45,.28)}
.lring{position:absolute;border:3px solid var(--laser);border-radius:50%;transform:translate(-50%,-50%);
       width:0;height:0;opacity:.9}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001s !important;transition-duration:.06s !important}
}
</style>
</head>
<body>

<div class="viewport">
<div class="stage" id="stage">
  <div class="sheet">
    <div class="topline"></div>

    <div id="body2col">

      <!-- ── 좌측 : 문제 + 단계 풀이 ── -->
      <div id="leftCol">
        <div class="qcard">
          <span class="qlab">문제</span>
          첫째항이 자연수인 수열 <span class="m"><i>a</i><sub>n</sub></span> 이
          <span class="m"><i>a</i><sub>n+1</sub> = |<i>a</i><sub>n</sub>| − 1</span> 을 만족시킬 때,
          <span class="m">10 ≤ <i>m</i> ≤ 100</span> 인 자연수 <span class="m"><i>m</i></span> 에 대하여
          <span class="key m"><i>a</i><sub>m</sub> ×
          <span class="sig">Σ<span class="hi">m</span><span class="lo">k=1</span></span>
          <i>a</i><sub>k</sub> = −55</span> 가 되도록 하는 모든 <span class="m"><i>m</i></span> 의 값의 합은?
        </div>
        <div id="steps"></div>
      </div>

      <!-- ── 우측 : 조작 패널 ── -->
      <div id="rightCol">

        <div id="recur">
          <span class="rl">점화식</span>
          <span class="rf m"><i>a</i><sub>n+1</sub> = |<i>a</i><sub>n</sub>| − 1</span>
          <span class="rn">절댓값을 씌우면 <b>0 이상</b><br>거기서 1 을 뺀다</span>
        </div>

        <div class="sec" id="ctl">
          <span class="a1lab m"><i>a</i><sub>1</sub> =</span>
          <button class="btn rd" id="minus" aria-label="첫째항 1 줄이기">−</button>
          <span class="a1val" id="a1val">5</span>
          <button class="btn rd" id="plus" aria-label="첫째항 1 늘리기">+</button>
          <div class="presets" id="presets"></div>
          <button class="btn sm" id="genall">끝까지 ▶</button>
        </div>

        <div class="sec" id="strip">
          <div id="cards"></div>
        </div>

        <div class="sec" id="osc">
          <div id="chips"></div>
          <div class="oscnote">핸들을 끌어 −1 인 항 이동 · 곱은 <b>1씩 커진다</b></div>
          <div id="trackwrap">
            <span class="trkend m" id="trkA"><i>m</i></span>
            <div id="track"><div id="fill"></div><div id="handle">–</div></div>
            <span class="trkend m" id="trkB"><i>m</i></span>
            <button class="btn rd" id="km" aria-label="이전 −1 항">−</button>
            <button class="btn rd" id="kp" aria-label="다음 −1 항">+</button>
          </div>
          <div class="krow">
            <span class="kv m"><i>m</i> = <b id="kvm">–</b></span>
            <span class="kv m"><i>S</i><sub>m</sub> = <b id="kvs">–</b></span>
            <span class="kv m" style="border-color:rgba(245,182,66,.55)">목표 <i>S</i><sub>m</sub> = <b style="color:var(--amber)">55</b></span>
          </div>
        </div>

        <div class="sec" id="read">
          <div id="eq"><span class="hint">카드를 터치하거나 핸들을 움직여 보세요</span></div>
          <div id="verdict"></div>
        </div>

      </div>
    </div>

    <!-- ── 발판 ── -->
    <div class="app-foot">
      <span class="no">14</span>
      <span class="ttl">절댓값이 있는 점화식과 부분합</span>
      <span id="ansBadge">답 : 176</span>
      <div class="stepdots" id="dots"></div>
      <button class="btn sm" id="prevb">◀ 이전</button>
      <button class="btn pri sm" id="nextb">다음 단계 ▶</button>
      <button class="btn sm" id="laserb">● 레이저</button>
      <button class="btn sm" id="fsb">⛶ 전체화면</button>
    </div>

    <div class="toast" id="toast"></div>
  </div>
</div>
</div>

<div id="laser"></div>

<script>
/* ===== 1. 스테이지 스케일링 ===== */
const STAGE_W=1600, STAGE_H=900, stage=document.getElementById('stage');
function fitStage(){
  const vv=window.visualViewport;
  const w=vv?vv.width:innerWidth, h=vv?vv.height:innerHeight;
  const s=Math.min(w/STAGE_W,h/STAGE_H);
  stage.style.transform=`translate(${Math.round((w-STAGE_W*s)/2)}px,${Math.round((h-STAGE_H*s)/2)}px) scale(${s})`;
}
addEventListener('resize',fitStage);
addEventListener('orientationchange',()=>{fitStage();setTimeout(fitStage,300);});
if(window.visualViewport){visualViewport.addEventListener('resize',fitStage);visualViewport.addEventListener('scroll',fitStage);}
fitStage(); [0,60,300,700].forEach(t=>setTimeout(fitStage,t));

/* ===== 수학 ===== */
const peak   = N => N*(N+1)/2;
const aVal   = (N,n) => n<=N+1 ? N-n+1 : (((n-N-1)%2===1)?-1:0);
const sumVal = (N,n) => n<=N+1 ? n*N-n*(n-1)/2 : peak(N)-Math.floor((n-N)/2);
const kmaxOf = N => Math.max(peak(N)-40,8);
const mf     = x => String(x).replace('-','\u2212');

/* S.k = 지나온 −1 의 번호(내부용). 화면에는 m 만 보인다. */
const S={N:5,gen:1,k:0,sel:null,touched:false,step:1,found:{11:null,12:null,13:null,14:null},done:false};

/* ===== 6. 단계 ===== */
const F='<span class="frac"><span class="num"><i>N</i>(<i>N</i>+1)</span><span class="den">2</span></span>';
const STEPS=[
 {t:'수열의 규칙',
  h:'첫째항 <span class="m"><i>a</i><sub>1</sub> = <i>N</i></span> 부터 1씩 줄어<span class="ind m">'
    +'<i>a</i><sub><i>N</i>+1</sub> = 0</span>'
    +'<span class="sm">그 뒤로는 <b>0, −1, 0, −1, …</b> 이 끝없이 반복된다</span>'},

 {t:'<span class="m"><i>a</i><sub>m</sub></span> 의 값',
  h:'곱이 음수 <span class="m">⟹ <i>a</i><sub>m</sub> &lt; 0</span>'
    +'<span class="sm">그런데 음수인 항은 <b>−1</b> 뿐이다</span>'
    +'<span class="ind m">⟹ <b><i>a</i><sub>m</sub> = −1</b></span>'},

 {t:'부분합 확정',
  h:'<span class="m">(−1) × <i>S</i><sub>m</sub> = −55</span>'
    +'<span class="ind m">⟹ <b><i>S</i><sub>m</sub> = 55</b></span>'},

 {t:'첫 −1 은 어디에?',
  h:'<span class="m"><i>a</i><sub><i>N</i>+1</sub> = 0</span> 바로 다음이 첫 −1'
    +'<span class="ind m">⟹ <b><i>a</i><sub><i>N</i>+2</sub></b></span>'
    +'<span class="sm">그때 <span class="m"><i>S</i> = '+F+' − 1</span>,'
    +' 곱 <span class="m">= −( '+F+' − 1 )</span></span>'},

 {t:'뒤로 갈수록 곱이 커진다',
  h:'−1 은 <b>두 칸마다</b> 나온다'
    +'<span class="sm">한 번 지날 때마다 합이 1 줄어 <b>곱은 1씩 커진다</b>'
    +'<span class="m"> (−65 → −64 → −63 → ⋯)</span></span>'},

 {t:'첫째항의 조건',
  h:'첫 곱이 −55 <b>이하</b>여야 −55 에 닿을 수 있다'
    +'<span class="ind m">⟹ '+F+' − 1 ≥ 55</span>'
    +'<span class="ind m">⟹ '+F+' ≥ 56</span>'
    +'<span class="ind m">⟹ <b><i>N</i> ≥ 11</b></span>'},

 {t:'첫째항마다 세어 보기',
  h:'첫 곱에서 −55 까지 <b>커져야 하는 만큼</b> 세고,'
    +'<span class="sm">그 수의 <b>2배</b>만큼 뒤로 간 자리가 <span class="m"><i>m</i></span></span>',
  tbl:true}
];

const stepsEl=document.getElementById('steps');
STEPS.forEach((s,i)=>{
  const d=document.createElement('div');d.className='stepCard';
  d.innerHTML=`<div class="hd"><span class="no">${i+1}</span><span class="ti">${s.t}</span></div>${s.h}`;
  if(s.tbl){
    d.innerHTML+=`<div id="tbl">
      <div class="row h"><span class="m"><i>a</i><sub>1</sub></span><span>첫 −1 항</span><span>그때 곱</span><span>−55 까지</span><span class="m"><i>m</i></span></div>
      ${[11,12,13,14].map(N=>`<div class="row wait" data-n="${N}">
        <span class="c1">${N}</span><span class="f0 m">?</span><span class="p0 m">?</span>
        <span class="need m">?</span><span class="mm">?</span></div>`).join('')}
      <div class="foot"><span>모든 <span class="m"><i>m</i></span> 의 합 =</span><span class="val" id="footv">?</span></div>
    </div>
    <div id="note14">✗ <span class="m"><i>m</i> = 114</span> 는 100 을 넘으므로 제외</div>`;
  }
  stepsEl.appendChild(d);
});

const dots=document.getElementById('dots');
STEPS.forEach(()=>{const d=document.createElement('div');d.className='sd';dots.appendChild(d);});

function renderSteps(){
  [...stepsEl.children].forEach((el,i)=>{
    el.classList.toggle('on',i<S.step);
    el.classList.toggle('live',i===S.step-1);
  });
  [...dots.children].forEach((d,i)=>{
    d.classList.toggle('on',i<S.step);
    d.classList.toggle('live',i===S.step-1);
  });
  const cur=stepsEl.children[S.step-1];
  if(cur) cur.scrollIntoView({behavior:'smooth',block:'nearest'});
}

/* ===== 섹션 순차 노출 (점화식 카드는 항상 보임) ===== */
function renderSecs(){
  const on={
    ctl:  true,
    strip:S.step>=1,
    osc:  S.step>=2 || S.gen>=S.N+1,
    read: S.step>=3 || S.touched
  };
  for(const id in on) document.getElementById(id).classList.toggle('live',on[id]);
}

/* ===== 프리셋 ===== */
const preHost=document.getElementById('presets');
[5,11,12,13,14].forEach(v=>{
  const b=document.createElement('div');b.className='pre';b.textContent=v;b.dataset.v=v;
  b.onclick=()=>setN(v);preHost.appendChild(b);
});

/* ===== 렌더 ===== */
function setN(v){v=Math.max(1,Math.min(15,v));S.N=v;S.gen=1;S.k=0;S.touched=false;S.sel={t:'dec',m:1};renderAll();}

function renderCtl(){
  document.getElementById('a1val').textContent=S.N;
  [...preHost.children].forEach(b=>b.classList.toggle('on',+b.dataset.v===S.N));
}

function renderCards(){
  const host=document.getElementById('cards');host.innerHTML='';
  const total=S.N+1, cols=Math.min(8,total);
  host.style.gridTemplateColumns=`repeat(${cols},1fr)`;
  for(let n=1;n<=total;n++){
    const d=document.createElement('div');
    if(n<=S.gen){
      const v=aVal(S.N,n);
      d.className='card'+(v===0?' zero':'')+(v<0?' neg':'')
                 +(S.sel&&S.sel.t==='dec'&&S.sel.m===n?' sel':'');
      d.innerHTML=`<span class="n m"><i>a</i><sub>${n}</sub></span>`
                 +`<span class="v">${mf(v)}</span>`
                 +`<span class="s m"><i>S</i>=${sumVal(S.N,n)}</span>`;
      d.onclick=()=>{S.touched=true;S.sel={t:'dec',m:n};renderCards();renderRead();renderSecs();};
    }else if(n===S.gen+1){
      d.className='card next';
      d.innerHTML=`<span class="n m"><i>a</i><sub>${n}</sub></span>`
                 +`<span class="v">＋</span>`
                 +`<span class="n">터치</span>`;
      d.onclick=()=>{S.touched=true;S.gen=n;S.sel={t:'dec',m:n};
                     if(S.gen===total){S.k=1;S.sel={t:'osc'};}renderAll();};
    }else{
      d.className='card ghost';
      d.innerHTML=`<span class="n m"><i>a</i><sub>${n}</sub></span>`;
    }
    host.appendChild(d);
  }
}

function renderOsc(){
  const chips=document.getElementById('chips');chips.innerHTML='';
  for(let t=1;t<=4;t++){
    const idx=S.N+t, v=aVal(S.N,idx);
    const c=document.createElement('div');c.className='chip '+(v<0?'neg':'zero');
    c.innerHTML=`<span class="cv">${mf(v)}</span><span class="cn m"><i>a</i><sub>${idx}</sub></span>`;
    chips.appendChild(c);
  }
  const dd=document.createElement('span');dd.className='dots3';dd.textContent='⋯';chips.appendChild(dd);
  const kk=Math.max(S.k,1), m=S.N+2*kk;
  const cur=document.createElement('div');cur.className='chip cur neg';
  cur.innerHTML=`<span class="cv">−1</span><span class="cn m">지금 보는 항 &nbsp;<i>a</i><sub>${m}</sub></span>`;
  chips.appendChild(cur);

  const kmax=kmaxOf(S.N);
  document.getElementById('trkA').innerHTML=`<i>m</i>=${S.N+2}`;
  document.getElementById('trkB').innerHTML=`<i>m</i>=${S.N+2*kmax}`;
  const trk=document.getElementById('track'),h=document.getElementById('handle'),f=document.getElementById('fill');
  const p=(kk-1)/(kmax-1), W=trk.clientWidth||420, HW=h.offsetWidth||76;
  /* 핸들이 트랙 밖으로 나가지 않도록 반너비만큼 안쪽에 가둔다 */
  h.style.left=(HW/2 + p*Math.max(W-HW,0))+'px';
  h.textContent=S.k?m:'–';
  f.style.width=(p*W)+'px';
  h.classList.toggle('hitt',sumVal(S.N,m)===55);
  document.getElementById('kvm').textContent=S.k?m:'–';
  document.getElementById('kvs').textContent=S.k?sumVal(S.N,m):'–';
}

function renderRead(){
  const eq=document.getElementById('eq'),vd=document.getElementById('verdict'),box=document.getElementById('read');
  box.classList.remove('good','bad','warn');vd.innerHTML='';
  if(!S.sel){eq.innerHTML='<span class="hint">카드를 터치하거나 핸들을 움직여 보세요</span>';return;}
  const m = S.sel.t==='osc' ? S.N+2*Math.max(S.k,1) : S.sel.m;
  const a=aVal(S.N,m), s=sumVal(S.N,m), p=a*s;
  const af = a<0 ? `(${mf(a)})` : `${a}`;
  eq.innerHTML=`<span class="m"><i>a</i><sub>${m}</sub> × <i>S</i><sub>${m}</sub></span><span class="op">=</span>`
    +`<span class="m">${af} × ${mf(s)}</span><span class="op">=</span><span class="res">${mf(p)}</span>`;
  if(p===-55){
    const ok=(m>=10&&m<=100);
    box.classList.add(ok?'good':'warn');
    vd.innerHTML = ok
      ? `<b style="color:var(--teal)">−55 성립!</b> &nbsp; <span class="m">10 ≤ <i>m</i> = ${m} ≤ 100</span> ✓`
      : `<b style="color:var(--amber)">−55 는 성립하지만</b> &nbsp; <span class="m"><i>m</i> = ${m}</span> 은 범위 밖 ✗`;
    record(S.N,m,ok);
  }else{
    box.classList.add('bad');
    vd.innerHTML = a>=0
      ? `<span class="m"><i>a</i><sub>${m}</sub> ≥ 0</span> 이라 곱이 음수가 될 수 없음`
      : `<span class="m"><i>S</i><sub>${m}</sub></span> 가 55 가 아니므로 −55 가 아님`;
  }
}

function record(N,m,ok){
  if(!(N in S.found)||S.found[N])return;
  S.found[N]={m,ok};
  fillRow(N,ok);
  toast(`a₁ = ${N} → m = ${m} ${ok?'✓':'(범위 밖 ✗)'}`);
  if([11,12,13].every(n=>S.found[n])&&!S.done) revealAnswer();
}

function fillRow(N,ok){
  const row=document.querySelector(`#tbl .row[data-n="${N}"]`);
  if(!row)return;
  const first=N+2, p0=-(peak(N)-1), need=-55-p0;
  row.querySelector('.f0').innerHTML=`<i>a</i><sub>${first}</sub>`;
  row.querySelector('.p0').textContent=mf(p0);
  row.querySelector('.need').innerHTML=`+${need} → ${2*need}칸`;
  const mv=N*N+2*N-110;
  row.querySelector('.mm').innerHTML = ok ? `${mv}` : `${mv} <span style="font-size:26px">✗</span>`;
  if(!ok) document.getElementById('note14').style.opacity='1';
  row.classList.remove('wait');
  row.classList.add(ok?'done':'bad');
  row.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function revealAnswer(){
  S.done=true;
  [11,12,13,14].forEach(N=>{
    if(!S.found[N]){const ok=(N*N+2*N-110)<=100;S.found[N]={ok};fillRow(N,ok);}
  });
  document.getElementById('footv').textContent='33 + 58 + 85 = 176';
  document.getElementById('ansBadge').classList.add('on');
  if(S.step<STEPS.length) S.step=STEPS.length;
  renderSteps();renderSecs();
}

function toast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2400);
}

function renderAll(){renderCtl();renderCards();renderOsc();renderRead();renderSteps();renderSecs();}

/* ===== 9. 인터랙션 ===== */
document.getElementById('plus').onclick =()=>setN(S.N+1);
document.getElementById('minus').onclick=()=>setN(S.N-1);
document.getElementById('genall').onclick=()=>{S.touched=true;S.gen=S.N+1;S.k=Math.max(S.k,1);S.sel={t:'osc'};renderAll();};

function setK(v){
  if(S.gen<S.N+1)return;
  S.touched=true;
  S.k=Math.max(1,Math.min(kmaxOf(S.N),v));S.sel={t:'osc'};
  renderOsc();renderRead();renderSecs();
}
document.getElementById('kp').onclick=()=>setK(S.k+1);
document.getElementById('km').onclick=()=>setK(S.k-1);

/* 트랙 드래그 — rAF 로 프레임당 1회만 */
const trk=document.getElementById('track');
let dragging=false, pendingK=null, rafId=0;
function flushK(){rafId=0;if(pendingK!==null){setK(pendingK);pendingK=null;}}
function queueK(v){pendingK=v;if(!rafId)rafId=requestAnimationFrame(flushK);}
function kFromX(x){
  const r=trk.getBoundingClientRect();
  const p=Math.max(0,Math.min(1,(x-r.left)/r.width));
  return Math.round(1+p*(kmaxOf(S.N)-1));
}
trk.addEventListener('pointerdown',e=>{
  if(S.gen<S.N+1)return;
  dragging=true;trk.setPointerCapture(e.pointerId);setK(kFromX(e.clientX));
});
trk.addEventListener('pointermove',e=>{if(dragging)queueK(kFromX(e.clientX));});
['pointerup','pointercancel'].forEach(ev=>trk.addEventListener(ev,()=>{dragging=false;flushK();}));

/* 단계 이동 */
function nextStep(){ if(S.step<STEPS.length){S.step++;renderSteps();renderSecs();} else if(!S.done){revealAnswer();} }
function prevStep(){ if(S.step>0){S.step--;renderSteps();renderSecs();} }
document.getElementById('nextb').onclick=nextStep;
document.getElementById('prevb').onclick=prevStep;

/* 전체화면 */
const fsb=document.getElementById('fsb');
function fsOn(){return !!(document.fullscreenElement||document.webkitFullscreenElement);}
function toggleFS(){
  const el=document.documentElement;
  if(fsOn()){ (document.exitFullscreen||document.webkitExitFullscreen).call(document); }
  else{ (el.requestFullscreen||el.webkitRequestFullscreen).call(el); }
}
fsb.onclick=toggleFS;
function syncFS(){ fsb.textContent=fsOn()?'⛶ 창 모드':'⛶ 전체화면'; [0,60,300,700].forEach(t=>setTimeout(fitStage,t)); }
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,syncFS));

/* ===== 7. 레이저 포인터 (기본 꺼짐) ===== */
const laserEl=document.getElementById('laser'), laserBtn=document.getElementById('laserb');
const TAIL=5, pts=[];
let lx=-999, ly=-999, laserOn=false;
for(let i=0;i<TAIL;i++){
  const d=document.createElement('div');
  d.className='ldot'+(i===0?' head':'');
  if(i>0){const sz=16-i*2.4;d.style.width=sz+'px';d.style.height=sz+'px';d.style.opacity=(0.42-i*0.07);}
  laserEl.appendChild(d);pts.push({el:d,x:-999,y:-999});
}
function laserLoop(){
  pts[0].x+=(lx-pts[0].x)*0.55; pts[0].y+=(ly-pts[0].y)*0.55;
  for(let i=1;i<TAIL;i++){
    pts[i].x+=(pts[i-1].x-pts[i].x)*0.42;
    pts[i].y+=(pts[i-1].y-pts[i].y)*0.42;
  }
  pts.forEach(p=>{p.el.style.left=p.x+'px';p.el.style.top=p.y+'px';});
  requestAnimationFrame(laserLoop);
}
requestAnimationFrame(laserLoop);
addEventListener('pointermove',e=>{
  if(e.pointerType!=='mouse')return;
  document.body.classList.add('has-mouse');
  lx=e.clientX; ly=e.clientY;
},{passive:true});
addEventListener('pointerdown',e=>{
  if(!laserOn||e.pointerType!=='mouse')return;
  const r=document.createElement('div');r.className='lring';
  r.style.left=e.clientX+'px';r.style.top=e.clientY+'px';
  laserEl.appendChild(r);
  r.animate([{width:'0px',height:'0px',opacity:.9},{width:'110px',height:'110px',opacity:0}],
            {duration:520,easing:'ease-out'}).onfinish=()=>r.remove();
},{passive:true});
function toggleLaser(on){
  laserOn = (on===undefined) ? !laserOn : on;
  document.body.classList.toggle('laser-on',laserOn);
  laserBtn.classList.toggle('on',laserOn);
  laserBtn.textContent = laserOn ? '● 레이저 끄기' : '● 레이저';
}
laserBtn.onclick=()=>toggleLaser();

/* 처음부터 */
function resetAll(){
  S.step=1;S.done=false;S.found={11:null,12:null,13:null,14:null};
  document.getElementById('ansBadge').classList.remove('on');
  document.getElementById('footv').textContent='?';
  document.getElementById('note14').style.opacity='0';
  document.querySelectorAll('#tbl .row[data-n]').forEach(r=>{
    r.className='row wait';
    r.querySelector('.f0').textContent='?';r.querySelector('.p0').textContent='?';
    r.querySelector('.need').textContent='?';r.querySelector('.mm').textContent='?';
  });
  setN(5);
}

/* 키보드 */
addEventListener('keydown',e=>{
  if(e.key===' '||e.key==='ArrowRight'){e.preventDefault();nextStep();}
  else if(e.key==='ArrowLeft'){e.preventDefault();prevStep();}
  else if(e.key==='ArrowUp'){e.preventDefault();setK(S.k+1);}
  else if(e.key==='ArrowDown'){e.preventDefault();setK(S.k-1);}
  else if(e.key==='r'||e.key==='R'){resetAll();}
  else if(e.key==='a'||e.key==='A'){document.getElementById('genall').click();}
  else if(e.key==='f'||e.key==='F'){toggleFS();}
  else if(e.key==='l'||e.key==='L'){toggleLaser();}
  else if('01234'.includes(e.key)){setN({'0':5,'1':11,'2':12,'3':13,'4':14}[e.key]);}
});

setN(5);
setTimeout(renderOsc,80);
</script>
</body>
</html>
